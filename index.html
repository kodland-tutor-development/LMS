T.it = {
launch_note: `<p><strong>📆 Solo questa settimana: partiamo mercoledì 02.09.2026.</strong></p><p>Dalla settimana prossima vale il ritmo abituale — tutto viene ricalcolato il <strong>lunedì</strong> e i messaggi partono a inizio settimana. Questa prima settimana lanciamo <strong>mercoledì</strong> di proposito, così hai un paio di giorni per guardarti intorno, prendere familiarità con i tuoi numeri e dirci cosa non ti sembra giusto.</p><p>Se qualcosa va sistemato, questi due giorni servono esattamente a questo: segnalalo su <strong>#lms-feedback-tts</strong> e lo correggiamo prima che inizi il normale ciclo settimanale.</p>`,
brandLabel: "LMS di Kodland",
footerNote: "Questa pagina ricrea la guida Notion dell'LMS di Kodland a scopo di traduzione. I riquadri segnaposto indicano dove inserire le immagini originali di Notion.",
imgNote: "Segnaposto per screenshot — l'immagine originale non era inclusa nel contenuto di partenza; aggiungila qui.",

title: "L'LMS di Kodland: la tua guida",
intro1: `<p><strong>🚀 Finalmente è arrivato. E lo chiedevi da tanto tempo.</strong></p>
<p><em>"Come stanno andando davvero i miei gruppi?" · "Quale dei miei studenti sta per abbandonare?" · "Posso avere una formazione su ciò con cui ho davvero difficoltà?" · "Posso semplicemente parlare con qualcuno che conosce i miei gruppi?"</em></p>
<p>Sono domande legittime. Semplicemente non avevamo gli strumenti né i processi per rispondere. <strong>Ora li abbiamo.</strong></p>
<p><strong>È costruito intorno al tuo insegnamento, non ai report — ed è solo l'inizio.</strong></p>`,
intro2: `<p><strong>🗺 Come leggere questa pagina.</strong> Procederemo in ordine: cos'è → cosa contiene → la prima metrica e come leggere i tuoi numeri → come appare una settimana normale → cosa arriverà dopo. Circa otto minuti. Le FAQ in fondo sono lì per dopo.</p>`,

s1_h: "🧭 1 · Prima di tutto, cos'è?",
s1_p1: `<p>L'<strong>LMS (Learning Management System)</strong> è una piattaforma costruita dal team di Tutor Development, per i tutor. Hai già una piattaforma per il lato operativo del tuo lavoro. Questa è per il lato didattico.</p>`,
backoffice: `<p><strong>🏢 Back Office — la piattaforma operativa</strong></p><p>Orari, gruppi, pagamenti, amministrazione. Gestisce il <em>business</em> dell'insegnamento.</p>`,
lms: `<p><strong>🎓 LMS — la piattaforma didattica</strong></p><p>Il tuo <em>insegnamento</em>. Come vanno davvero i tuoi gruppi, e cosa ti aiuta a migliorarli.</p>`,
s1_p2: `<p>Nessuna sostituisce l'altra. Il Back Office risponde a <em>"cosa è programmato?"</em> — l'LMS risponde a <em>"come sta andando il mio insegnamento, e cosa devo fare al riguardo?"</em></p>`,
login: `<p><strong>🔗 La schermata di login e la prima cosa che vedi dopo l'accesso.</strong></p><p>https://tutors.kodland.org/</p><p>Salvala nei preferiti. Riceverai le tue credenziali di accesso da noi — vedi la sezione 8 più sotto per capire come funziona l'accesso.</p>`,

s2_h: "💡 2 · Perché l'abbiamo costruito",
s2_p1: `<p><strong>Perché lo hai chiesto. Ripetutamente, nelle riunioni dei tutor, per anni.</strong></p>`,
s2_p2: `<p>Fino ad ora, quando uno dei tuoi gruppi iniziava a scivolare — uno studente che diventava silenzioso, un altro che saltava le lezioni — toccava quasi sempre a te accorgertene. E quando arrivava il supporto, spesso erano già passate settimane. Non perché a nessuno importasse: perché le informazioni erano sparse in luoghi che nessuno poteva leggere insieme, e non c'era un processo per trasformarle in aiuto.</p>
<p>Quando una famiglia disdice, il motivo è di solito già visibile in aula <strong>da settimane</strong>. Ora è visibile anche a noi — e a te per primo.</p>`,
s2_idea: `<p><strong>🎯 Tutta l'idea in una riga:</strong> lo scopri in una settimana invece che in un mese — e ricevi aiuto mentre il problema è ancora risolvibile.</p>`,

s3_h: "🧰 3 · Quindi, cosa c'è davvero dentro?",
s3_intro: `<p>Cinque cose. Ecco ciascuna, e cosa fa per te.</p>`,
s3_metrics_h: "📊 Le tue metriche",
s3_metrics_p: `<p>Come stanno andando i tuoi gruppi, in un unico posto — aggiornato ogni settimana, visibile a te per primo. Non devi più indovinare a che punto sei, né aspettare una riunione per scoprirlo.</p>`,
img_metrics: "La tua pagina delle metriche — i tuoi numeri, aggiornati ogni settimana.",
s3_watch_h: "👥 La tua lista di monitoraggio studenti",
s3_watch_p: `<p>I <strong>nomi</strong> degli studenti dei tuoi gruppi che hanno bisogno di attenzione extra questa settimana, e <em>perché</em> ciascuno è nella lista. Questa è la parte che, secondo i tutor, cambia di più le cose: un elenco di nomi è qualcosa su cui puoi agire nella tua prossima lezione. Una percentuale no.</p>`,
s3_watch_aside: `<p><strong>💡 Tutti i nomi sono cliccabili</strong> e ti reindirizzano al profilo dello studente nel Backoffice.</p>`,
img_watch: "La lista di monitoraggio studenti con nomi e stati.",
s3_train_h: "🎓 Formazioni e il DST",
s3_train_p: `<p>Formazioni brevi e mirate — non corsi generici. Quando qualcosa nei tuoi dati richiede attenzione, ricevi la formazione specifica che aiuta <em>proprio con quello</em>, più un <strong>Diagnostic Skill Test (DST)</strong> per verificare che sia stato assimilato. Entrambi sono pensati per essere completati in un'unica sessione.</p>`,
img_train: "Una pagina di formazione + il DST.",
s3_coach_h: "🤝 Sessioni di coaching 1:1",
s3_coach_p: `<p>Prenota del tempo con il tuo mentore regionale in due clic — scegli uno slot, dici di cosa vuoi parlare, fatto. Una conversazione vera sui tuoi gruppi reali, non una revisione generica.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Puoi richiederne una quando vuoi; non devi aspettare una segnalazione.</p>`,
img_coach: "Il flusso di prenotazione del coaching.",
s3_new_h: "🚀 Nuovi corsi da insegnare",
s3_new_p: `<p>Formazioni e test per <strong>assunzioni interne</strong>. Vuoi insegnare qualcosa di nuovo? I materiali sono lì e la porta è aperta — crescere qui smette di dipendere dal fatto che qualcuno noti che sei pronto.</p>`,
img_new: "L'area di assunzioni interne / corsi disponibili.",
s3_slack: `<p><strong>💬 E non devi ricordarti di accedere.</strong> Tutto ti arriva su <strong>Slack</strong>, nella tua lingua — la lista di monitoraggio settimanale, una formazione assegnata, una conferma di coaching. La piattaforma è dove vai per approfondire.</p>`,

s4_h: "🙋 4 · La prima metrica: Presenza (Attendance)",
s4_p1: `<p>Ora la parte più importante, perché è quella che parte per prima.</p>`,
s4_p2: `<p><strong>Iniziamo deliberatamente con una sola metrica, fatta bene.</strong> E ora quella metrica risponde a due domande invece di una — perché uno studente può essere <em>assente dalla lezione</em>, oppure <em>presente ma con la testa altrove</em>, e sono problemi completamente diversi.</p>`,

s4_absence_h: "🟡🔴 Come viene registrata la Presenza Back Office: due tipi di assenza",
s4_absence_p: `<p>Estraiamo i dati su assenze e tipi di assenza da ciò che registri manualmente.</p>`,
s4_yellow: `<p><strong>🟡 Giallo — la famiglia ti ha avvisato.</strong> Qualcuno ti ha informato. Una famiglia che gestisce una situazione, uno studente con un esame, un laptop rotto. Selezioni giallo <strong>e scegli il motivo che ti è stato dato</strong>. Quelle dodici opzioni non sono burocrazia. Sono l'unico modo in cui scopriamo <strong>quali assenze avremmo potuto prevenire dal nostro lato.</strong> Scegli quella più vicina con onestà. Cinque secondi da parte tua, e uno schema su cui possiamo davvero agire.</p><p>Motivi gialli disponibili:</p>`,
s4_red: `<p><strong>🔴 Rosso — nessuno ti ha detto nulla.</strong> Lo studente semplicemente non si è presentato, e nessuno ha detto perché. Seleziona rosso <strong>solo</strong> in quel caso. Rosso non è un'etichetta più severa per la stessa cosa — <strong>significa che non sappiamo cosa è successo.</strong> Questo è ciò che lo rende lo stato più pericoloso di tutta la pagina: un'assenza con un motivo è una situazione gestita, mentre un'assenza senza motivo è uno studente che potrebbe già essersene andato, e nessuno può aiutare qualcuno il cui problema è invisibile.</p>`,
s4_red_aside: `<p><strong>💡 Rosso non è un verdetto — è "non ancora saputo".</strong></p>
<p>Se segni uno studente in rosso e la famiglia poi spiega, <strong>cambialo in giallo e aggiungi il motivo</strong>. Non è correggere un errore; è il processo che funziona: hai contattato, hai ottenuto una risposta, e il registro ora riflette la realtà.</p>
<p>Questa è anche la cosa più veloce che puoi fare per i tuoi numeri. Un'assenza non spiegata che resta non spiegata conta contro la tua presenza. La stessa assenza, una volta che hai parlato con la famiglia e registrato il motivo, non conta.</p>`,

s4_presence_h: "🧮 Come viene calcolata la Presenza in Classe",
s4_presence_p: `<p>Nessuna scatola nera. Tre passaggi.</p>`,
presence_why: `<p><strong>Perché la misuriamo.</strong> Mostra per quanta parte della lezione lo studente è davvero presente &mdash; ed è strettamente legata alla retention. Uno studente che si collega e poi si allontana è sulla strada dell'uscita molto prima che lo si veda nelle presenze.</p>`,
step1: `<p><strong>1 &middot; Per ogni lezione sommiamo tutto il tempo in cui lo studente è stato connesso.</strong></p>`,
step1b: `<p>La Presenza in Classe è la <strong>somma di tutti i segmenti tra la connessione e la disconnessione dello studente</strong>. Se la connessione cade e lo studente rientra, i segmenti si sommano &mdash; la riconnessione in sé non costa nulla.</p>`,
step2: `<p><strong>2 &middot; Dividiamo quel totale per la durata programmata della lezione.</strong></p>`,
step2b: `<p>Due esempi svolti:</p>`,
presence_examples: [
 "<strong>Lezione 19:00 &ndash; 20:00.</strong> Lo studente si collega alle 19:00 e si disconnette alle 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Lezione 19:00 &ndash; 20:00.</strong> Lo studente si collega alle 19:00 e si disconnette alle 19:20; dopo aver risolto un problema di PC o di connessione, rientra alle 19:40 e resta altri 20 minuti. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; La sua Presenza in Classe è la media di questo valore sulle lezioni degli ultimi 30 giorni</strong> &mdash; calcolata <strong>per gruppo e per corso</strong>, quindi uno studente che è con te su due corsi viene misurato separatamente su ciascuno. La finestra è mobile e i numeri si aggiornano <strong>ogni lunedì</strong>.</p>`,
exclude_intro: `<p>Cosa viene escluso, e perché:</p>`,
presence_note: `<p><strong>👀 Utile da sapere:</strong> la Presenza in Classe misura il <strong>tempo in aula</strong> — nient'altro. Non riguarda la tua telecamera, la tua chat, o chi parla di più. Questi segnali appartengono a una metrica diversa in arrivo più avanti questo trimestre, e la spiegheremo con la stessa trasparenza.</p>`,

presence_reliability: `<p><strong>🔧 Se un numero sembra sbagliato, dillo.</strong> Scrivilo nel canale <strong>#lms-feedback-tts</strong> allegando uno screenshot e una breve descrizione del problema, e tagga il tuo mentore regionale.</p>`,
s4_risk_h: "🚦 I tuoi due segnali",
risk_p1: `<p>Ogni studente ha <strong>due categorie</strong> &mdash; una dalla Presenza in Classe, una dalle presenze in Back Office. Le tue liste mostrano <strong>la peggiore delle due</strong>, così nessuno sfugge quando i due segnali non concordano.</p>`,
alert_warning: `<p><strong>⚠️ Una parola, due significati &mdash; leggi l'etichetta insieme al suo segnale.</strong> <strong>ALERT</strong> sul lato Presenza in Classe significa presenza sotto il 50%. <strong>Alert</strong> sul lato Back Office significa 2&ndash;3 assenze spiegate. Sono segnali diversi con gravità diverse &mdash; quindi nomina sempre il segnale: <em>ALERT (presenza)</em>, <em>Alert (assenze)</em>. Consigliamo di fare lo stesso quando parli di uno studente con il tuo mentore. I nomi dei gruppi compaiono in inglese nel LMS, ed è per questo che li teniamo in inglese anche qui.</p>`,
risk_p2: `<p>Leggile come <strong>alternative, non condizioni</strong>: lo studente viene collocato <em>o</em> dalle assenze <em>o</em> dalla presenza &mdash; quale sia peggiore. Uno studente senza alcuna assenza può finire in 🟠 RISK per la sola presenza se è in aula solo per il 60% della lezione, e uno studente con presenza perfetta può finire in 🔴 Critical per una singola assenza non spiegata.</p>`,
risk_p3: `<p>Per ogni studente segnalato vedi anche il <strong>motivo</strong> dietro ogni assenza gialla &mdash; uno dei dodici elencati sopra &mdash; così non devi indovinare.</p>`,
s4_hpr_h: "📈 HPR e LPR — i due numeri sulla tua scheda",
hpr_intro: `<p>Vengono misurati sulla <strong>Presenza in Classe</strong>:</p>`,
bar_p: `<p>La soglia che manteniamo in tutte le regioni: <strong>LPR pari o inferiore al 25,5%</strong> · <strong>HPR pari o superiore al 49,5%</strong>.</p>`,
target_aside: `<p><strong>📌 Questi sono gli obiettivi globali per il trimestre di lancio.</strong> Gli obiettivi regionali sono in fase di conferma con ciascun Head of Teaching, e la tua scheda nell'LMS mostra sempre quello che si applica a te — quindi fidati della scheda più di qualsiasi numero scritto altrove.</p>`,
goal_aside: `<p><strong>🎯 Per la Presenza in Classe, l'obiettivo è numerico:</strong> alzare l'HPR, abbassare l'LPR.</p>
<p><strong>Per la Presenza Back Office, l'obiettivo sono due risultati — senza tasso:</strong></p>
<ul>
<li>🔴 <strong>Eliminare le assenze non giustificate.</strong> Un'assenza rossa significa che uno studente è sparito e nessuno ha fatto seguito. Questo dovrebbe smettere di essere possibile.</li>
<li>🟡 <strong>Eliminare l'abbandono che inizia alla seconda assenza giustificata.</strong> Due gialle sono il punto in cui uno studente inizia ad allontanarsi <em>e</em> può ancora essere recuperato. Dopo, le probabilità crollano velocemente.</li>
</ul>
<p><strong>Nessuno studente dovrebbe sparire in silenzio, e nessuno dovrebbe perdersi per due assenze a cui nessuno ha risposto.</strong></p>`,

s4_payoff_h: "🧭 Ed ecco l'utilità pratica",
payoff_p1: `<p>Le due misure puntano a problemi diversi, con soluzioni diverse. Ecco perché le abbiamo separate:</p>`,
payoff_p2: `<p>La stessa percentuale unica che avevi prima, con due piani d'azione completamente diversi nascosti dentro.</p>`,

maria_h: "🧑‍🏫 Caso 1 · Maria — un problema di Presenza in Classe",
maria_p1: `<p>Maria insegna a <strong>3 gruppi</strong>, <strong>21 studenti</strong> in totale. Ecco i suoi ultimi 30 giorni.</p>`,
maria_p2: `<p>Quindi i suoi due numeri sono:</p>`,
maria_aside: `<p><strong>💡 Maria viene segnalata sull'HPR, non sull'LPR — ed è il caso più comune.</strong></p>
<p>Nessuno è sparito. Tutti i suoi studenti <em>vengono</em>. Ma nove di loro se ne vanno a metà, quindi troppo pochi dei suoi studenti sono davvero presenti per tutta la lezione. Con il vecchio numero unico questo era invisibile: quei nove studenti contavano come "presenti".</p>`,

monday_h: "📅 Lunedì mattina — cosa succede davvero",
monday_step1: `<p><strong>1 · Arriva un DM su Slack.</strong> Da Tutor Development, nella lingua di Maria. Assomiglia a questo:</p>`,
monday_after_quote: `<p>Maria non deve accedere per scoprirlo. <strong>La piattaforma viene da lei.</strong></p>`,
monday_step2: `<p><strong>2 · Apre l'LMS per vedere il dettaglio.</strong> Su tutors.kodland.org trova le sue due misure, il suo HPR e LPR rispetto agli obiettivi, e la stessa lista di monitoraggio — ma con il gruppo di ogni studente, la sua percentuale di presenza e un link diretto al suo profilo nel Back Office. È lì che va quando vuole sapere <em>in quale gruppo</em> si trova il problema.</p>`,
monday_step3: `<p><strong>3 · Nota qualcosa che il messaggio Slack non può dirle.</strong> Sette dei suoi nove studenti che escono presto sono nello stesso gruppo — la sua classe del sabato alle 18. Non è un problema di insegnamento generale, è un'aula, in un orario, con una dinamica. Ora sa dove concentrarsi.</p>`,
monday_step4: `<p><strong>4 · Fa la formazione.</strong> È nell'LMS, assegnata a lei, breve. La completa insieme al DST entro i quattro giorni e riceve un messaggio Slack che le conferma di averlo superato.</p>`,
monday_step5: `<p><strong>5 · Cambia due cose nelle sue prossime lezioni.</strong> Dalla formazione e dai consigli settimanali: inizia ad aprire con una domanda a cui ogni singolo studente deve rispondere per nome, e smette di lasciare che gli ultimi cinque minuti vadano persi — il riepilogo e la frase "cosa ci aspetta nella prossima lezione" sono ciò che mantiene gli studenti in aula fino alla fine.</p>`,
monday_step6: `<p><strong>6 · Due settimane dopo il suo HPR è al 51%.</strong> Riceve un messaggio Slack che le dice che non è più segnalata. Nessuno ha mai avuto una conversazione difficile con lei in nessun momento.</p>`,
maria_ifnot: `<p><strong>🤝 E se non fosse migliorata?</strong> Dopo la formazione, se la metrica è ancora sotto l'obiettivo, a Maria viene chiesto di prenotare una sessione <strong>1:1 con il suo mentore regionale</strong> — due clic, scegli un orario. Quella conversazione riguarda i suoi gruppi reali, molto probabilmente quella classe del sabato alle 18. Continua a non esserci nessuno che decide qualcosa su di lei a partire da un numero.</p>`,

cases_h: "🧭 Due casi, un solo processo",
cases_intro: `<p>Un messaggio ti arriva quando succede una di tre cose. La tua <strong>Presenza in Classe</strong> è fuori target — HPR sotto, oppure LPR sopra. Le tue <strong>assenze in Back Office</strong> risultano problematiche — due o più studenti con due o più assenze che nessuno ha spiegato, oppure, quando hai già 10 o più studenti, più della metà del tuo elenco con una. Oppure scatta un <strong>caso urgente</strong>: uno studente con tre o più assenze non spiegate, o due studenti con quattro o più assenze spiegate — indipendentemente da cosa dicono i tuoi tassi.</p><p>Maria ha il primo problema, Marco il secondo. Quello che succede dopo è identico in tutti i casi:</p>`,
cases_list: ["<strong>Un messaggio</strong> — con consigli pratici <em>e</em> le regole che si applicano, allegate, così non devi mai andare a cercare una norma.","<strong>Una formazione breve nell'LMS</strong> — assegnata a te, più il DST, quattro giorni per completarla.","<strong>Un 1:1 con il tuo mentore regionale</strong> — se dopo tutto questo il numero non si è ancora mosso."],
cases_aside: `<p><strong>🤝 Nulla qui viene deciso da un numero.</strong> La piattaforma decide dove guardare per prima cosa — poi è una persona a parlare con te. Se qualcosa nei dati sembra sbagliato, dirlo è utile, non imbarazzante.</p>`,
marco_flag: `<p>È questo che fa scattare il suo messaggio. La Presenza Back Office non scatta in base a una media, ma in base allo stato dei registri: <strong>due o più studenti con due o più assenze che nessuno ha spiegato</strong>, oppure, quando hai già 10 o più studenti, <strong>più della metà del tuo elenco con una</strong>. I due studenti di Marco, con due assenze non spiegate ciascuno, sono esattamente questo. Un'assenza con un motivo è una situazione gestita. Una rossa è uno studente che potrebbe essersene già andato.</p>`,
marco_week_h: "📅 Il suo lunedì mattina — cosa succede davvero",
marco_s0: `<p><strong>1 · Lo stesso DM su Slack — con le regole allegate.</strong> Marco non deve cercare né ricordarsi nessuna norma. Si presenta così:</p>`,
marco_quote: [
 "Ciao Marco 👋",
 "Ti scriviamo dal Dipartimento Tutor Development a proposito dei registri di presenza nei tuoi gruppi. <strong>Due dei tuoi studenti hanno due assenze ciascuno segnate come 🔴 rosse</strong> — registrate senza motivo.",
 "Studenti da ricontattare:<br>🔴 Lukas Meyer — 2 lezioni, nessun motivo registrato<br>🔴 Ana Silva — 2 lezioni, nessun motivo registrato",
 "Ti abbiamo assegnato una breve formazione che può aiutarti: <em>Gestire le Assenze</em> — [link]. Completalo insieme al DST entro i prossimi 4 giorni.",
 "Le regole per le assenze rosse e gialle sono allegate a questo messaggio — cosa fare, in che ordine, e cosa registrare.",
 "Il tuo mentor regionale è sempre disponibile ad aiutarti.",
],
marco_s1: `<p><strong>2 · Apre l'LMS per vedere chi e dove.</strong> La stessa lista di monitoraggio che vede Maria, ma la sua mostra i due studenti, i loro gruppi, e un link diretto al profilo Back Office di ciascuno.</p>`,
marco_s2: `<p><strong>3 · Scrive a entrambe le famiglie lo stesso giorno.</strong> La registrazione, un breve riassunto di cosa si sono perse, e una domanda: cosa è successo? Un'assenza che nessuno riconosce ha molte più probabilità di diventarne una seconda.</p>`,
marco_s3: `<p><strong>4 · Registra quello che gli è stato detto.</strong> Il 🔴 rosso diventa 🟡 giallo con il motivo allegato — in un caso una settimana di esami, nell'altro un laptop rotto. Un'assenza rossa non dovrebbe mai restare senza spiegazione per più di 48 ore.</p>`,
marco_s4: `<p><strong>5 · Chiede prima di promettere qualcosa in più.</strong> Uno dei due è rimasto indietro, così Marco lo segnala al suo TL — una lezione extra o motivazionale è una loro decisione, mai qualcosa da offrire direttamente a una famiglia. "Faccio verificare" è una risposta completa nel frattempo.</p>`,
marco_s5: `<p><strong>6 · La settimana dopo i suoi registri sono in ordine</strong>, e un messaggio Slack gli dice che non è più segnalato. Come per Maria, nessuno ha avuto con lui una conversazione difficile in nessun momento.</p>`,
marco_ifnot: `<p><strong>🤝 E se le assenze continuassero?</strong> Esattamente come per Maria: se il quadro non è migliorato dopo la formazione, a Marco viene chiesto di prenotare un <strong>1:1 con il suo mentore regionale</strong> — due clic, scegli un orario. Stesso processo, tema diverso: quello di Maria riguarda come si conduce la lezione, quello di Marco cosa succede tra una lezione e l'altra.</p>`,
marco_h: "🔄 Caso 2 · Marco — un problema di Presenza Back Office",
marco_p1: `<p>Marco insegna anche lui a 3 gruppi. Gli studenti che si presentano sono pienamente presenti — il suo HPR è 61%, comodamente sopra l'obiettivo, quindi nulla nella sua Presenza in Classe è segnalato. Il suo problema è l'altra misura: <strong>due dei suoi studenti non sono venuti alle ultime due lezioni e non gliel'hanno mai detto.</strong> Entrambi risultano nel registro come 🔴 rosso — nessuno sa perché.</p>`,
marco_aside: `<p><strong>🎯 Stessa metrica, due problemi opposti.</strong> Il lavoro di Maria è <em>dentro</em> la lezione. Quello di Marco è <em>fuori</em> da essa. Ecco esattamente perché abbiamo diviso la presenza in due misure — così l'aiuto che ricevi corrisponde al problema che hai davvero.</p>`,

s5_h: "📅 5 · Come appare una settimana normale",
s5_p1: `<p>Ora sai cos'è la piattaforma e cosa significano i numeri. Ecco l'intero flusso in un unico posto.</p>`,
s5_flow_h: "🧭 Il flusso, in breve",
s5_when_h: "❓ Quando esattamente riceverò una segnalazione, e perché?",
s5_when_p: `<p>Tre situazioni, e nient'altro:</p>`,
s5_when_aside: `<p><strong>🙋 E cosa devo fare?</strong> Tre cose, ogni volta.</p>
<ol class="list">
<li>Leggi il messaggio. Indica la metrica, gli studenti e la scadenza.</li>
<li>Completa la formazione e il DST entro 4 giorni. Sono brevi per scelta.</li>
<li>Dai a quegli studenti un modo per partecipare nelle tue prossime lezioni. La formazione e i consigli ti dicono come — questa è la parte che davvero muove il numero.</li>
</ol>`,

s5_arrive_h: "📨 Ed ecco come ti arriva",
s5_three_aside: `<p><strong>🙌 Tre cose che ti chiediamo</strong></p>
<ol class="list">
<li>Leggi il messaggio quando arriva.</li>
<li>Agisci di conseguenza — se viene assegnata una formazione, completala con il DST entro 4 giorni.</li>
<li>Chiedi se qualcosa non è chiaro. È esattamente a questo che serve il tuo mentore regionale.</li>
</ol>`,

s5_msg_h: "📲 È appena arrivato un messaggio. Cosa faccio?",
s5_msg_p: `<p>Tutto ti arriva come un <strong>DM Slack da Tutor Development</strong>. Ci sono solo cinque tipi, e nessuno richiede una risposta lunga.</p>`,
s5_msg_aside: `<p><strong>🤖 Questi DM vengono inviati automaticamente</strong>, quindi rispondere al messaggio non raggiunge una persona. Se vuoi dire qualcosa, scrivi direttamente al tuo <strong>mentore regionale</strong> — oppure pubblicalo nel canale qui sotto, che di solito è più veloce.</p>`,

s5_feedback_h: "🛠 Qualcosa non va? C'è un solo posto per segnalarlo",
feedback_aside: `<p><strong>📣 Pubblicalo su #lms-feedback-tts.</strong></p>
<p>Non un DM a chiunque tu conosca, e non sepolto nel tuo canale tutor. Un unico canale significa che vediamo ogni segnalazione, sistemiamo le cose una volta invece che nove, e puoi vedere che qualcuno l'ha raccolta.</p>
<p>Vale la pena segnalare:</p>
<ul>
<li>🔢 Un numero che sembra sbagliato — uno studente segnato come assente che era chiaramente in aula, una percentuale che non corrisponde a ciò che hai visto</li>
<li>🔗 Un link rotto, o una formazione che non corrisponde al problema descritto nel messaggio</li>
<li>🌐 Un messaggio nella lingua sbagliata, o che nomina uno studente che non è tuo</li>
<li>🔑 Credenziali che non riesci a trovare in Bitwarden una volta che i messaggi sono iniziati</li>
<li>😵 Qualsiasi cosa confusa, rotta o lenta — e qualsiasi cosa vorresti che facesse e non fa</li>
</ul>
<p><strong>Questo non è lamentarsi e non conta contro di te.</strong> Nelle prime settimane in particolare, siete le uniche persone che possono vedere se questo funziona davvero. Una segnalazione che risparmia al prossimo tutor la stessa confusione vale per noi molto più di un silenzio educato.</p>`,

s5_mentor_h: "🌍 Il tuo mentore regionale",
mentor_p: `<p>Questa è la persona nominata in ogni messaggio che ricevi da noi — e l'essere umano con cui parlerai davvero. Non devi aspettare una segnalazione per farti sentire.</p>`,

s6_h: "🙅 6 · Cosa NON è questo",
s6_p1: `<p>Prima di accedere per la prima volta, siamo diretti riguardo alle cose che preoccupano le persone.</p>`,
s6_aside: `<p><strong>⚖️</strong> E dove i dati sono davvero sbagliati — uno studente segnato come assente che era chiaramente in aula, un guasto della piattaforma — <strong>dillo a #lms-feedback-tts</strong>. Anche quei casi sono visibili a noi, e segnalarli protegge sia te che lo studente.</p>`,

s7_h: "🔮 7 · Cosa arriverà dopo",
s7_p1: `<p>La presenza è la prima metrica, non l'ultima.</p>`,
s7_aside: `<p><strong>🛠 Questa è la versione uno</strong>, e intendiamo continuare a costruirla insieme a te. Se qualcosa è confuso, mancante o sbagliato, dillo — quel feedback è come si scrive la prossima versione.</p>`,

s8_h: "🔐 8 · Ottenere l'accesso",
s8_aside: `<p><strong>🔑 Le tue credenziali stanno arrivando su Bitwarden</strong> — e saranno lì entro un paio di giorni.</p>
<p>L'LMS contiene <strong>dati personali</strong> su di te e sui tuoi studenti, quindi l'accesso è nominale e individuale: nessun login condiviso, nessun account di prova, nessuna eccezione.</p>
<p><strong>Come entrerai:</strong> stiamo aggiungendo le tue credenziali LMS a <strong>Bitwarden</strong>, lo stesso posto dove tieni già gli altri accessi di lavoro. Non c'è nulla da richiedere e nessuno da sollecitare — semplicemente appariranno lì.</p>
<p><strong>I tempi sono allineati di proposito.</strong> Le credenziali entrano in Bitwarden nei prossimi giorni, ed è anche il momento in cui attiviamo i messaggi automatici. Quindi quando ti arriva il primo messaggio Slack, potrai aprire <strong>tutors.kodland.org</strong> e vedere i dettagli dietro di esso.</p>
<p>Se i messaggi sono già iniziati e ancora non riesci a trovare le credenziali LMS nel tuo Bitwarden — pubblicalo su <strong>#lms-feedback-tts</strong> e lo risolveremo lo stesso giorno.</p>`,

s9_h: "❓ 9 · FAQ",
faq1_q: `<p><strong><em>"Ho tanti gruppi. Devo fare tutto questo ovunque?"</em></strong></p>`,
faq1_a: `<p>No. Costruisci <strong>una</strong> routine di apertura e una di chiusura che funzionino in ogni gruppo, e usale in modo identico. Se il carico di lavoro in sé è il problema, dillo — è una conversazione sugli orari con Teaching Ops, non qualcosa da risolvere con più sforzo.</p>`,
faq2_q: `<p><strong><em>"I miei studenti semplicemente non accendono la telecamera. È il mio punteggio?"</em></strong></p>`,
faq2_a: `<p>No — la Presenza in Classe riguarda il <strong>tempo in aula</strong>, non le telecamere. Telecamere, chat e partecipazione appartengono a una metrica diversa in arrivo più avanti questo trimestre, e anche lì la telecamera è solo uno dei vari segnali.</p>`,
faq3_q: `<p><strong><em>"Uno studente ha problemi di connessione e continua a scollegarsi. Conta contro di me?"</em></strong></p>`,
faq3_a: `<p>Le riconnessioni ripetute e i guasti della piattaforma sono visibili nei dati e non vengono interpretati come colpa tua. Segnalali comunque — ti protegge e aiuta lo studente.</p>`,
faq4_q: `<p><strong><em>"Uno dei miei gruppi è molto più difficile degli altri."</em></strong></p>`,
faq4_a: `<p>I tuoi numeri sono calcolati per gruppo e per corso, quindi un gruppo difficile non si nasconde dietro una media — e nemmeno trascina giù tutto il resto. La domanda utile di solito è <em>perché un'aula specifica si comporta diversamente dalle altre</em>, ed è una buona cosa da portare a una sessione di coaching.</p>`,
faq5_q: `<p><strong><em>"Qual è l'unica cosa più veloce che posso cambiare?"</em></strong></p>`,
faq5_body: `<p>Due cose, e non costano nulla da preparare:</p>
<ul>
<li>Essere in aula prima dei tuoi studenti — anche solo di un minuto.</li>
<li>Aprire con una domanda a cui ogni studente deve rispondere per nome, senza risposta sbagliata. "Una parola: cosa hai costruito la settimana scorsa?" Fai il giro di tutta l'aula prima di condividere lo schermo.</li>
</ul>
<p>Queste due cose muovono più di qualsiasi altra cosa in questa pagina.</p>`,
faq6_q: `<p><strong><em>"Uno studente ha saltato due lezioni di fila. Cosa faccio?"</em></strong></p>`,
faq6_a: `<p><strong>Dillo a qualcuno — non aspettare la terza.</strong> Quello è il punto in cui uno studente che si sta allontanando può ancora essere recuperato, e di solito sei l'unica persona che lo vede in tempo.</p>`,
faq7_q: `<p><strong><em>"A chi chiedo se qualcosa non è chiaro?"</em></strong></p>`,
faq7_a: `<p>Al tuo mentore regionale.</p>`,
faq_aside: `<p><strong>💬 C'è qualcosa che questa pagina non ha risposto?</strong> Chiedi nel tuo canale tutor o scrivi al tuo mentore regionale. Se una domanda emerge più di due volte, appartiene a questa pagina — quindi chiedere aiuta tutti.</p>`,

closing_aside: `<p><strong>🎓 In una riga</strong></p><p>L'LMS esiste affinché, quando qualcosa inizia ad andare storto in uno dei tuoi gruppi, <strong>tu lo scopra alla seconda settimana invece che al terzo mese — e riceva aiuto mentre è ancora risolvibile.</strong></p>`,

T.tr = {
launch_note: `<p><strong>📆 Sadece bu hafta: 2 Eylül 2026 Çarşamba günü başlıyoruz.</strong></p><p>Gelecek haftadan itibaren olağan ritim geçerli — her şey <strong>pazartesi</strong> yeniden hesaplanır ve mesajlar haftanın başında gönderilir. Bu ilk hafta bilinçli olarak <strong>çarşamba</strong> günü başlatıyoruz; böylece etrafa bakmak, kendi sayılarınızla tanışmak ve yanlış görünen şeyleri bize söylemek için birkaç gününüz olur.</p><p>Bir şeyin düzeltilmesi gerekiyorsa, bu iki gün tam olarak bunun için: <strong>#lms-feedback-tts</strong> kanalında bildirin, normal haftalık döngü başlamadan önce düzeltelim.</p>`,
brandLabel: "Kodland LMS",
footerNote: "Bu sayfa, çeviri amacıyla Kodland LMS Notion rehberini yeniden oluşturur. Yer tutucu kutular, orijinal Notion görsellerinin nereye ekleneceğini gösterir.",
imgNote: "Ekran görüntüsü yer tutucusu — orijinal görsel kaynak içeriğe dahil değildi; buraya ekleyin.",

title: "Kodland LMS: rehberiniz",
intro1: `<p><strong>🚀 Sonunda geldi. Ve bunu uzun zamandır istiyordunuz.</strong></p>
<p><em>"Gruplarım gerçekte nasıl gidiyor?" · "Öğrencilerimden hangisi bırakmak üzere?" · "Gerçekten zorlandığım konuda eğitim alabilir miyim?" · "Gruplarımı bilen biriyle konuşabilir miyim?"</em></p>
<p>Bunlar haklı sorular. Bunları yanıtlayacak ne araçlarımız ne de süreçlerimiz vardı. <strong>Artık var.</strong></p>
<p><strong>Raporlama etrafında değil, öğretiminiz etrafında kurgulandı — ve bu daha başlangıç.</strong></p>`,
intro2: `<p><strong>🗺 Bu sayfayı nasıl okumalı.</strong> Sırayla ilerleyeceğiz: bu şey nedir → içinde ne var → ilk metrik ve kendi sayılarınızı nasıl okuyacağınız → normal bir hafta nasıl görünür → sırada ne var. Yaklaşık sekiz dakika. En alttaki SSS bölümü sonra için.</p>`,

s1_h: "🧭 1 · Önce, bu nedir?",
s1_p1: `<p><strong>LMS (Learning Management System)</strong>, Tutor Development ekibi tarafından tutorlar için oluşturulmuş bir platform. İşinizin operasyonel tarafı için zaten bir platformunuz var. Bu, öğretim tarafı için.</p>`,
backoffice: `<p><strong>🏢 Back Office — operasyonel platform</strong></p><p>Programlar, gruplar, ödemeler, yönetim. Öğretimin <em>işini</em> yürütür.</p>`,
lms: `<p><strong>🎓 LMS — pedagojik platform</strong></p><p><em>Öğretiminiz</em>. Gruplarınızın gerçekte nasıl gittiği ve onları daha iyi hale getirmenize ne yardımcı olduğu.</p>`,
s1_p2: `<p>Hiçbiri diğerinin yerini almaz. Back Office <em>"ne planlandı?"</em> sorusuna yanıt verir — LMS <em>"öğretimim nasıl gidiyor ve bu konuda ne yapmalıyım?"</em> sorusuna yanıt verir.</p>`,
login: `<p><strong>🔗 Giriş ekranı ve oturum açtıktan sonra gördüğünüz ilk şey.</strong></p><p>https://tutors.kodland.org/</p><p>Yer imlerine ekleyin. Kendi giriş bilgilerinizi bizden alacaksınız — erişimin nasıl işlediğini görmek için aşağıdaki 8. bölüme bakın.</p>`,

s2_h: "💡 2 · Bunu neden geliştirdik",
s2_p1: `<p><strong>Çünkü istediniz. Yıllarca, tutor toplantılarında, tekrar tekrar.</strong></p>`,
s2_p2: `<p>Şimdiye kadar, gruplarınızdan biri kaymaya başladığında — bir öğrenci sessizleşiyor, bir başkası derslere gelmiyor — bunu fark etmek büyük ölçüde size kalıyordu. Destek geldiğinde ise genellikle haftalar geçmiş oluyordu. Kimsenin umursamamasından değil: bilgiler kimsenin bir arada okuyamayacağı yerlere dağılmıştı ve bunu yardıma dönüştürecek bir süreç yoktu.</p>
<p>Bir aile iptal ettiğinde, sebep genellikle sınıfta <strong>haftalardır</strong> görünür durumdaydı. Artık bizim için de görünür — ve önce sizin için.</p>`,
s2_idea: `<p><strong>🎯 Tüm fikir tek cümlede:</strong> bir ay yerine bir hafta içinde öğreniyorsunuz — ve sorun hâlâ çözülebilirken yardım alıyorsunuz.</p>`,

s3_h: "🧰 3 · Peki gerçekte içinde ne var?",
s3_intro: `<p>Beş şey. İşte her biri ve sizin için ne yapıyor.</p>`,
s3_metrics_h: "📊 Metrikleriniz",
s3_metrics_p: `<p>Gruplarınızın nasıl gittiği, tek bir yerde — haftalık güncellenir, önce size görünür. Nerede durduğunuzu tahmin etmeye ya da öğrenmek için bir toplantı beklemeye son.</p>`,
img_metrics: "Metrikler sayfanız — kendi sayılarınız, her hafta güncellenir.",
s3_watch_h: "👥 Öğrenci takip listeniz",
s3_watch_p: `<p>Gruplarınızdaki, bu hafta ekstra ilgiye ihtiyacı olan öğrencilerin <strong>isimleri</strong> ve her birinin listede olma <em>nedeni</em>. Tutorların bize en çok fark yarattığını söylediği kısım burası: bir isim listesi, bir sonraki dersinizde harekete geçebileceğiniz bir şeydir. Bir yüzde değildir.</p>`,
s3_watch_aside: `<p><strong>💡 Tüm isimler tıklanabilir</strong> ve sizi Backoffice'teki öğrenci profiline yönlendirir.</p>`,
img_watch: "İsimler ve durumlarla öğrenci takip listesi.",
s3_train_h: "🎓 Eğitimler ve DST",
s3_train_p: `<p>Kısa, hedefli eğitimler — genel kurslar değil. Verilerinizde bir şey dikkat gerektirdiğinde, tam olarak <em>o konuda</em> yardımcı olan spesifik eğitimi alırsınız, artı öğrenilenin yerleştiğini kontrol etmek için bir <strong>Diagnostic Skill Test (DST)</strong>. İkisi de tek oturumda tamamlanacak şekilde tasarlanmıştır.</p>`,
img_train: "Bir eğitim sayfası + DST.",
s3_coach_h: "🤝 1:1 koçluk seansları",
s3_coach_p: `<p>İki tıkla bölge mentörünüzle randevu ayırtın — bir zaman dilimi seçin, ne hakkında konuşmak istediğinizi söyleyin, tamam. Genel bir inceleme değil, gerçek gruplarınız hakkında gerçek bir sohbet.</p>`,
s3_coach_aside: `<p><strong>💡</strong> İstediğiniz zaman talep edebilirsiniz; işaretlenmenizi beklemenize gerek yok.</p>`,
img_coach: "Koçluk randevu alma akışı.",
s3_new_h: "🚀 Öğretilecek yeni kurslar",
s3_new_p: `<p><strong>İç işe alım</strong> için eğitimler ve testler. Yeni bir şey öğretmek mi istiyorsunuz? Materyaller orada ve kapı açık — burada büyümek artık birinin hazır olduğunuzu fark etmesine bağlı değil.</p>`,
img_new: "İç işe alım / mevcut kurslar alanı.",
s3_slack: `<p><strong>💬 Ve oturum açmayı hatırlamanıza gerek yok.</strong> Her şey <strong>Slack</strong> üzerinden, kendi dilinizde size ulaşır — haftalık takip listesi, atanan bir eğitim, bir koçluk onayı. Platform, derinlemesine bakmak için gittiğiniz yerdir.</p>`,

s4_h: "🙋 4 · İlk metrik: Devam Durumu (Attendance)",
s4_p1: `<p>Şimdi en önemli kısım, çünkü ilk canlıya geçen bu.</p>`,
s4_p2: `<p><strong>Kasıtlı olarak, düzgün yapılmış tek bir metrikle başlıyoruz.</strong> Ve o metrik artık bir yerine iki soruya cevap veriyor — çünkü bir öğrenci ya hiç derse gelmemiş olabilir ya da derste olup zihnen kopmuş olabilir ve bunlar tamamen farklı sorunlardır.</p>`,

s4_absence_h: "🟡🔴 Backoffice Devam Durumu nasıl kaydedilir: iki tür devamsızlık",
s4_absence_p: `<p>Devamsızlıklar ve devamsızlık türleri hakkındaki verileri, manuel olarak girdiğiniz bilgilerden çıkarıyoruz.</p>`,
s4_yellow: `<p><strong>🟡 Sarı — aile size haber verdi.</strong> Biri size bildirdi. Bir durumla uğraşan bir aile, sınavı olan bir öğrenci, bozuk bir laptop. Sarıyı seçersiniz <strong>ve size verilen nedeni işaretlersiniz</strong>. O on iki seçenek evrak işi değildir. Bunlar, <strong>kendi tarafımızdan hangi devamsızlıkları önleyebileceğimizi</strong> öğrenmemizin tek yoludur. En yakın olanı dürüstçe seçin. Sizden beş saniye ve gerçekten harekete geçebileceğimiz bir örüntü.</p><p>Mevcut sarı nedenler:</p>`,
s4_red: `<p><strong>🔴 Kırmızı — kimse size hiçbir şey söylemedi.</strong> Öğrenci öylece gelmedi ve kimse nedenini söylemedi. Kırmızıyı <strong>yalnızca</strong> bu durumda seçin. Kırmızı, aynı şey için daha sert bir etiket değildir — <strong>ne olduğunu bilmediğimiz anlamına gelir.</strong> Bu da onu tüm sayfadaki en tehlikeli duruma dönüştüren şeydir: nedeni olan bir devamsızlık yönetilen bir durumdur, nedeni olmayan bir devamsızlık ise belki de çoktan gitmiş olan bir öğrencidir ve sorunu görünmez olan birine kimse yardım edemez.</p>`,
s4_red_aside: `<p><strong>💡 Kırmızı bir hüküm değildir — "henüz bilinmiyor" demektir.</strong></p>
<p>Bir öğrenciyi kırmızı olarak işaretlerseniz ve aile daha sonra açıklama yaparsa, <strong>sarıya çevirin ve nedeni ekleyin</strong>. Bu bir hatayı düzeltmek değildir; işleyen sürecin ta kendisidir: iletişime geçtiniz, bir yanıt aldınız ve kayıt artık gerçeği yansıtıyor.</p>
<p>Bu aynı zamanda kendi sayılarınız için yapabileceğiniz en hızlı şeydir. Açıklanmadan kalan bir devamsızlık, devam durumunuzun aleyhine sayılır. Aynı devamsızlık, aileyle konuştuktan ve nedeni kaydettikten sonra sayılmaz.</p>`,

s4_presence_h: "🧮 Sınıf İçi Katılım nasıl hesaplanır",
s4_presence_p: `<p>Kara kutu yok. Üç adım.</p>`,
presence_why: `<p><strong>Neden ölçüyoruz.</strong> Öğrencinin dersin ne kadarında gerçekten orada olduğunu gösterir &mdash; ve bu, öğrencinin bizimle kalmasıyla doğrudan bağlantılıdır. Bağlanıp sonra uzaklaşan bir öğrenci, bu durum yoklamada görünmeden çok önce ayrılma yolundadır.</p>`,
step1: `<p><strong>1 &middot; Her ders için öğrencinin bağlı kaldığı tüm süreyi toplarız.</strong></p>`,
step1b: `<p>Sınıf İçi Katılım, <strong>öğrencinin bağlanması ile bağlantısının kesilmesi arasındaki tüm bölümlerin toplamıdır</strong>. Bağlantı koparsa ve öğrenci geri dönerse bölümler toplanır &mdash; yeniden bağlanmanın kendisi hiçbir şeye mal olmaz.</p>`,
step2: `<p><strong>2 &middot; Bu toplamı dersin planlanan süresine böleriz.</strong></p>`,
step2b: `<p>İki çözümlü örnek:</p>`,
presence_examples: [
 "<strong>Ders 19:00 &ndash; 20:00.</strong> Öğrenci 19:00'da bağlanır ve 19:50'de ayrılır. &rarr; 50 / 60 = <strong>%83,33</strong>",
 "<strong>Ders 19:00 &ndash; 20:00.</strong> Öğrenci 19:00'da bağlanır ve 19:20'de ayrılır; bilgisayar ya da bağlantı sorununu çözdükten sonra 19:40'ta yeniden bağlanır ve 20 dakika daha kalır. &rarr; (20 + 20) / 60 = <strong>%66,66</strong>",
],
step3: `<p><strong>3 &middot; Öğrencinin Sınıf İçi Katılımı, son 30 gündeki derslerinin ortalamasıdır</strong> &mdash; <strong>grup ve kurs bazında</strong> hesaplanır, yani sizinle iki kursta bulunan bir öğrenci her birinde ayrı ayrı ölçülür. Pencere kayar ve sayılar <strong>her pazartesi</strong> yenilenir.</p>`,
exclude_intro: `<p>Neler dışlanır ve nedeni:</p>`,
presence_note: `<p><strong>👀 Bilmekte fayda var:</strong> Sınıf İçi Katılım <strong>sınıfta geçirilen zamanı</strong> ölçer — başka hiçbir şeyi değil. Kameranız, sohbetiniz ya da en çok kimin konuştuğuyla ilgili değildir. Bu sinyaller bu çeyrekte ilerleyen zamanda gelecek farklı bir metriğe ait ve onu da aynı şeffaflıkla açıklayacağız.</p>`,

presence_reliability: `<p><strong>🔧 Bir sayı yanlış görünüyorsa bize söyleyin.</strong> <strong>#lms-feedback-tts</strong> kanalına bir ekran görüntüsü ve sorunun kısa bir açıklamasıyla yazın ve bölge mentörünüzü etiketleyin.</p>`,
s4_risk_h: "🚦 İki sinyaliniz",
risk_p1: `<p>Her öğrencinin <strong>iki kategorisi</strong> vardır &mdash; biri Sınıf İçi Katılımdan, biri Back Office yoklamasından. Listeleriniz <strong>ikisinin kötü olanını</strong> gösterir, böylece ikisi uyuşmadığında kimse gözden kaçmaz.</p>`,
alert_warning: `<p><strong>⚠️ Tek kelime, iki anlam &mdash; etiketi sinyaliyle birlikte okuyun.</strong> Sınıf İçi Katılım tarafında <strong>ALERT</strong>, %50'nin altında katılım anlamına gelir. Back Office tarafında <strong>Alert</strong>, 2&ndash;3 açıklanmış devamsızlık anlamına gelir. Farklı ağırlıkta farklı sinyaller &mdash; bu yüzden sinyali her zaman adıyla söyleyin: <em>ALERT (katılım)</em>, <em>Alert (devamsızlık)</em>. Mentörünüzle bir öğrenciyi konuşurken de aynısını öneririz. Grup adları LMS'te İngilizce görünür, bu yüzden burada da İngilizce bırakıyoruz.</p>`,
risk_p2: `<p>Bunları <strong>koşullar değil, alternatifler</strong> olarak okuyun: öğrenciyi <em>ya</em> devamsızlıklar <em>ya da</em> katılım yerleştirir &mdash; hangisi daha kötüyse. Hiç devamsızlığı olmayan bir öğrenci, dersin yalnızca %60'ında sınıftaysa sadece katılım nedeniyle 🟠 RISK'e düşebilir; mükemmel katılımı olan bir öğrenci de tek bir açıklanmamış devamsızlıktan 🔴 Critical'a düşebilir.</p>`,
risk_p3: `<p>İşaretlenen her öğrenci için her sarı devamsızlığın arkasındaki <strong>nedeni</strong> de görürsünüz &mdash; yukarıda listelenen on iki nedenden biri &mdash; böylece tahmin etmenize gerek kalmaz.</p>`,
s4_hpr_h: "📈 HPR ve LPR — kartınızdaki iki sayı",
hpr_intro: `<p>Bunlar <strong>Sınıf İçi Katılım</strong> üzerinden ölçülür:</p>`,
bar_p: `<p>Tüm bölgelerde tuttuğumuz eşik: <strong>LPR %25,5 veya altında</strong> · <strong>HPR %49,5 veya üstünde</strong>.</p>`,
target_aside: `<p><strong>📌 Bunlar lansman çeyreği için küresel hedeflerdir.</strong> Bölgesel hedefler her Head of Teaching ile teyit ediliyor ve LMS'teki kartınız her zaman sizin için geçerli olan hedefi gösterir — bu yüzden başka bir yerde yazan sayılara değil, karta güvenin.</p>`,
goal_aside: `<p><strong>🎯 Sınıf İçi Katılımda hedef sayısaldır:</strong> HPR'yi yükseltin, LPR'yi düşürün.</p>
<p><strong>Back Office Devam Durumunda hedef iki sonuçtur — oran değil:</strong></p>
<ul>
<li>🔴 <strong>Mazeretsiz devamsızlıkları ortadan kaldırmak.</strong> Kırmızı bir devamsızlık, bir öğrencinin kaybolduğu ve kimsenin takip etmediği anlamına gelir. Bunun mümkün olmaması gerekir.</li>
<li>🟡 <strong>İkinci mazeretli devamsızlıkta başlayan kopuşu ortadan kaldırmak.</strong> İki sarı, bir öğrencinin uzaklaşmaya başladığı ve hâlâ geri kazanılabildiği noktadır. Bundan sonra olasılıklar hızla düşer.</li>
</ul>
<p><strong>Hiçbir öğrenci sessizce kaybolmamalı ve hiçbiri kimsenin yanıtlamadığı iki devamsızlık yüzünden kaybedilmemeli.</strong></p>`,

s4_payoff_h: "🧭 Ve işte pratik faydası",
payoff_p1: `<p>İki ölçü farklı sorunlara işaret eder, farklı çözümlerle. Onları bu yüzden ayırdık:</p>`,
payoff_p2: `<p>Önceden sahip olduğunuz aynı tek yüzde, içinde tamamen farklı iki eylem planı saklıyor.</p>`,

maria_h: "🧑‍🏫 Vaka 1 · Maria — bir Sınıf İçi Katılım sorunu",
maria_p1: `<p>Maria <strong>3 gruba</strong>, toplam <strong>21 öğrenciye</strong> ders veriyor. İşte son 30 günü.</p>`,
maria_p2: `<p>Yani iki sayısı şöyle:</p>`,
maria_aside: `<p><strong>💡 Maria, LPR değil HPR üzerinden işaretleniyor — ve bu en yaygın durumdur.</strong></p>
<p>Kimse kaybolmadı. Tüm öğrencileri <em>geliyor</em>. Ama dokuzu yarı yolda ayrılıyor, bu yüzden öğrencilerinin çok azı dersin tamamında gerçekten mevcut oluyor. Eski tek sayıda bu görünmezdi: o dokuz öğrenci "katıldı" sayılıyordu.</p>`,

monday_h: "📅 Pazartesi sabahı — gerçekte ne olur",
monday_step1: `<p><strong>1 · Bir Slack DM'i gelir.</strong> Tutor Development'tan, Maria'nın kendi dilinde. Şöyle görünür:</p>`,
monday_after_quote: `<p>Maria bunu öğrenmek için oturum açmak zorunda değil. <strong>Platform ona geliyor.</strong></p>`,
monday_step2: `<p><strong>2 · Detayları görmek için LMS'i açar.</strong> tutors.kodland.org'da iki ölçüsünü, hedeflere karşı HPR ve LPR'sini ve aynı takip listesini bulur — ama bu sefer her öğrencinin grubu, katılım yüzdesi ve Back Office profiline doğrudan bir bağlantı ile birlikte. Sorunun <em>hangi grupta</em> olduğunu öğrenmek istediğinde gittiği yer burasıdır.</p>`,
monday_step3: `<p><strong>3 · Slack mesajının ona söyleyemeyeceği bir şey fark eder.</strong> Erken ayrılan dokuz öğrencisinden yedisi aynı grupta — Cumartesi saat 18:00 sınıfı. Bu genel bir öğretim sorunu değil, tek bir sınıf, tek bir saatte, tek bir dinamikle. Artık nereye odaklanacağını biliyor.</p>`,
monday_step4: `<p><strong>4 · Eğitimi tamamlar.</strong> LMS'te, ona atanmış, kısa. Onu DST ile birlikte dört gün içinde tamamlar ve geçtiğini onaylayan bir Slack mesajı alır.</p>`,
monday_step5: `<p><strong>5 · Sonraki derslerinde iki şeyi değiştirir.</strong> Eğitimden ve haftalık ipuçlarından: her öğrencinin ismiyle cevaplaması gereken bir soruyla açmaya başlar ve son beş dakikanın harcanmasına izin vermeyi bırakır — özet ve "bir sonraki derste ne var" cümlesi, öğrencileri sona kadar sınıfta tutan şeylerdir.</p>`,
monday_step6: `<p><strong>6 · İki hafta sonra HPR'si %51 olur.</strong> Artık işaretli olmadığını söyleyen bir Slack mesajı alır. Hiç kimse onunla hiçbir noktada zor bir konuşma yapmadı.</p>`,
maria_ifnot: `<p><strong>🤝 Ya düzelmemiş olsaydı?</strong> Eğitimden sonra metrik hâlâ hedefin altındaysa, Maria'dan <strong>bölge mentörü ile bir 1:1 oturumu</strong> ayırtması istenir — iki tık, bir saat seçin. O görüşme onun gerçek grupları hakkındadır, büyük olasılıkla o cumartesi 18:00 dersi. Hâlâ kimse bir sayıya bakarak onun hakkında bir karar vermiyor.</p>`,

cases_h: "🧭 İki vaka, tek bir süreç",
cases_intro: `<p>Üç durumdan biri gerçekleştiğinde size bir mesaj ulaşır. <strong>Sınıf İçi Katılımınız</strong> hedefin dışındadır — HPR altında ya da LPR üstünde. <strong>Back Office devamsızlıklarınız</strong> sorunlu görünür — iki veya daha fazla öğrencinin, kimsenin açıklamadığı iki veya daha fazla devamsızlığı vardır, ya da 10 veya daha fazla öğrenciniz olduğunda listenizin yarısından fazlasının birer devamsızlık taşıması. Ya da bir <strong>acil vaka</strong> tetiklenir: bir öğrencinin üç veya daha fazla açıklanmamış devamsızlığı, ya da iki öğrencinin dörder veya daha fazla açıklanmış devamsızlığı — oranlarınız ne derse desin.</p><p>Maria'da ilk sorun var, Marco'da ikincisi. Sonrasında olan şey her durumda aynıdır:</p>`,
cases_list: ["<strong>Bir mesaj</strong> — pratik ipuçları <em>ve</em> geçerli kurallar ekli olarak, böylece hiçbir zaman bir kuralı aramanız gerekmez.","<strong>LMS'te kısa bir eğitim</strong> — size atanmış, ayrıca DST, tamamlamak için dört gün.","<strong>Bölge mentörünüzle bir 1:1</strong> — bunlardan sonra sayı hâlâ hareket etmediyse."],
cases_aside: `<p><strong>🤝 Burada hiçbir şeye bir sayı karar vermiyor.</strong> Platform yalnızca önce nereye bakacağımıza karar verir — sonra bir insan sizinle konuşur. Verilerde bir şey yanlış görünüyorsa, bunu söylemek yararlıdır, tuhaf değil.</p>`,
marco_flag: `<p>Mesajını tetikleyen şey bu. Back Office devam durumu bir ortalamaya göre işaretleme yapmaz — kayıtların durumuna göre yapar: <strong>iki veya daha fazla öğrencinin, kimsenin açıklamadığı iki veya daha fazla devamsızlığı</strong>, ya da 10 veya daha fazla öğrenciniz olduğunda <strong>listenizin yarısından fazlasının birer devamsızlık taşıması</strong>. Marco'nun iki öğrencisi, her biri iki açıklanmamış devamsızlıkla, tam olarak bu durumdur. Nedeni olan bir devamsızlık yönetilen bir durumdur. Kırmızı olan, belki de çoktan gitmiş bir öğrencidir.</p>`,
marco_week_h: "📅 Onun pazartesi sabahı — gerçekte ne olur",
marco_s0: `<p><strong>1 · Aynı Slack DM'i — kurallar ekli.</strong> Marco'nun hiçbir kuralı aramasına ya da hatırlamasına gerek yok. Şöyle görünüyor:</p>`,
marco_quote: [
 "Merhaba Marco 👋",
 "Tutor Development Departmanından, gruplarınızdaki devam kayıtlarıyla ilgili yazıyoruz. <strong>İki öğrencinizin her birinin 🔴 kırmızı olarak işaretli iki devamsızlığı var</strong> — neden belirtilmeden kaydedilmiş.",
 "Takip edilecek öğrenciler:<br>🔴 Lukas Meyer — 2 ders, kayıtlı neden yok<br>🔴 Ana Silva — 2 ders, kayıtlı neden yok",
 "Yardımcı olması için kısa bir eğitim atadık: <em>Devamsızlıkları Yönetmek</em> — [bağlantı]. Lütfen önümüzdeki 4 gün içinde DST ile birlikte tamamlayın.",
 "Kırmızı ve sarı devamsızlıklara ilişkin kurallar bu mesaja eklidir — ne yapılacağı, hangi sırayla ve neyin kaydedileceği.",
 "Bölge mentörünüz her zaman yardıma hazır.",
],
marco_s1: `<p><strong>2 · Kimi ve nerede olduğunu görmek için LMS'i açıyor.</strong> Maria'nın gördüğü aynı takip listesi, ama onunki iki öğrenciyi, gruplarını ve her birinin Back Office profiline doğrudan bir bağlantıyı gösteriyor.</p>`,
marco_s2: `<p><strong>3 · Aynı gün iki aileye de yazıyor.</strong> Ders kaydı, kaçırılanların kısa bir özeti ve tek bir soru: ne oldu? Kimsenin farkına varmadığı bir devamsızlığın ikinciye dönüşme olasılığı çok daha yüksektir.</p>`,
marco_s3: `<p><strong>4 · Kendisine söyleneni kaydediyor.</strong> 🔴 kırmızı, nedeni eklenmiş 🟡 sarıya dönüşüyor — biri sınav haftası, diğeri bozuk bir laptop. Kırmızı bir devamsızlık 48 saatten fazla açıklanmadan kalmamalıdır.</p>`,
marco_s4: `<p><strong>5 · Ekstra bir şey vaat etmeden önce soruyor.</strong> İkisinden biri geride kaldı, bu yüzden Marco bunu TL'sine iletiyor — ekstra ya da motivasyon dersi onların kararıdır, asla bir aileye doğrudan teklif edilecek bir şey değil. Bu arada "Bunu bir kontrol edeyim" eksiksiz bir yanıttır.</p>`,
marco_s5: `<p><strong>6 · Ertesi hafta kayıtları temiz</strong> ve bir Slack mesajı artık işaretli olmadığını söylüyor. Maria'da olduğu gibi, hiçbir noktada kimse onunla zor bir konuşma yapmadı.</p>`,
marco_ifnot: `<p><strong>🤝 Ya devamsızlıklar sürseydi?</strong> Tam olarak Maria'da olduğu gibi: eğitimden sonra tablo düzelmediyse, Marco'dan <strong>bölge mentörü ile bir 1:1</strong> ayırtması istenir — iki tık, bir saat seçin. Aynı süreç, farklı konu: Maria'nınki dersi yürütmekle ilgili, Marco'nunki dersler arasında olup bitenlerle.</p>`,
marco_h: "🔄 Vaka 2 · Marco — bir Back Office Devam Durumu sorunu",
marco_p1: `<p>Marco da 3 gruba ders veriyor. Derse gelen öğrencileri dersin tamamında sınıfta kalıyor — HPR'si %61, hedefin rahatça üzerinde, yani Sınıf İçi Katılımında işaretlenen hiçbir şey yok. Onun sorunu diğer ölçüde: <strong>iki öğrencisi son iki derse gelmedi ve ona hiç haber vermedi.</strong> İkisi de kayıtta 🔴 kırmızı olarak duruyor — kimse nedenini bilmiyor.</p>`,
marco_aside: `<p><strong>🎯 Aynı metrik, iki zıt sorun.</strong> Maria'nın işi dersin <em>içinde</em>. Marco'nunki dersin <em>dışında</em>. Devam durumunu iki ölçüye ayırmamızın tam nedeni bu — böylece aldığınız yardım, sahip olduğunuz gerçek sorunla eşleşir.</p>`,

s5_h: "📅 5 · Normal bir hafta neye benzer",
s5_p1: `<p>Artık platformun ne olduğunu ve sayıların ne anlama geldiğini biliyorsunuz. İşte tüm akış tek bir yerde.</p>`,
s5_flow_h: "🧭 Akış, kısaca",
s5_when_h: "❓ Tam olarak ne zaman ve neden işaretlenirim?",
s5_when_p: `<p>Üç durum, başka hiçbir şey değil:</p>`,
s5_when_aside: `<p><strong>🙋 Peki ne yapmam gerekiyor?</strong> Her seferinde üç şey.</p>
<ol class="list">
<li>Mesajı okuyun. Metriği, öğrencileri ve son tarihi belirtir.</li>
<li>Eğitimi ve DST'yi 4 gün içinde tamamlayın. Tasarım gereği kısadırlar.</li>
<li>Sonraki derslerinizde o öğrencilere katılım için bir yol verin. Eğitim ve ipuçları nasıl yapacağınızı söyler — sayıyı gerçekten hareket ettiren kısım budur.</li>
</ol>`,

s5_arrive_h: "📨 Ve işte size nasıl ulaşır",
s5_three_aside: `<p><strong>🙌 Sizden istediğimiz üç şey</strong></p>
<ol class="list">
<li>Mesaj geldiğinde okuyun.</li>
<li>Buna göre hareket edin — bir eğitim atanmışsa, DST ile birlikte 4 gün içinde tamamlayın.</li>
<li>Bir şey belirsizse sorun. Bölge mentörünüz tam olarak bunun için var.</li>
</ol>`,

s5_msg_h: "📲 Az önce bir mesaj geldi. Ne yapmalıyım?",
s5_msg_p: `<p>Her şey size <strong>Tutor Development'tan bir Slack DM'i</strong> olarak ulaşır. Yalnızca beş tür vardır ve hiçbiri uzun bir yanıt gerektirmez.</p>`,
s5_msg_aside: `<p><strong>🤖 Bu DM'ler otomatik olarak gönderilir</strong>, bu yüzden mesajı yanıtlasanız kimseye ulaşmaz. Bir şey söylemek isterseniz, doğrudan <strong>bölge mentörünüze</strong> yazın — ya da genellikle daha hızlı olan aşağıdaki kanala gönderin.</p>`,

s5_feedback_h: "🛠 Bir şey yanlış mı görünüyor? Bunu söylemek için tek bir yer var",
feedback_aside: `<p><strong>📣 #lms-feedback-tts'e yazın.</strong></p>
<p>Rastgele tanıdığınız birine atılan bir DM değil; tutor kanalınızın içinde kaybolan bir mesaj da değil. Tek bir kanal, her raporu görmemiz, işleri dokuz kez yerine bir kez düzeltmemiz ve birinin bunu fark ettiğini görebilmeniz anlamına gelir.</p>
<p>Paylaşmaya değer olanlar:</p>
<ul>
<li>🔢 Yanlış görünen bir sayı — sınıfta açıkça olan ama devamsız işaretlenen bir öğrenci, gördüğünüzle uyuşmayan bir yüzde</li>
<li>🔗 Bozuk bir bağlantı ya da mesajda tanımlanan soruna uymayan bir eğitim</li>
<li>🌐 Yanlış dilde bir mesaj, ya da sizin olmayan bir öğrenciyi adlandıran bir mesaj</li>
<li>🔑 Mesajlar başladıktan sonra Bitwarden'da bulamadığınız kimlik bilgileri</li>
<li>😵 Kafa karıştırıcı, bozuk ya da yavaş herhangi bir şey — ve yapmasını istediğiniz ama yapmayan herhangi bir şey</li>
</ul>
<p><strong>Bu şikayet etmek değildir ve aleyhinize sayılmaz.</strong> Özellikle ilk haftalarda, bunun gerçekten işe yarayıp yaramadığını görebilecek tek kişiler sizsiniz. Bir sonraki tutoru aynı kafa karışıklığından kurtaran bir rapor, bizim için kibar bir sessizlikten çok daha değerlidir.</p>`,

s5_mentor_h: "🌍 Bölge mentörünüz",
mentor_p: `<p>Bu, bizden aldığınız her mesajda adı geçen kişi — ve gerçekten konuşacağınız insan. Ulaşmak için işaretlenmenizi beklemenize gerek yok.</p>`,

s6_h: "🙅 6 · Bunun ne olmadığı",
s6_p1: `<p>İlk kez oturum açmadan önce, insanları neyin endişelendirdiği konusunda dürüst olalım.</p>`,
s6_aside: `<p><strong>⚖️</strong> Ve veri gerçekten yanlışsa — sınıfta açıkça olan ama devamsız işaretlenen bir öğrenci, bir platform arızası — <strong>bize #lms-feedback-tts'te söyleyin</strong>. Bu durumlar da bizim için görünürdür ve onları işaretlemek hem sizi hem de öğrenciyi korur.</p>`,

s7_h: "🔮 7 · Sırada ne var",
s7_p1: `<p>Devam durumu ilk metrik, sonuncusu değil.</p>`,
s7_aside: `<p><strong>🛠 Bu birinci sürüm</strong> ve sizinle birlikte üzerinde çalışmaya devam etmeyi amaçlıyoruz. Bir şey kafa karıştırıcıysa, eksikse ya da yanlışsa söyleyin — bir sonraki sürüm o geri bildirimle yazılır.</p>`,

s8_h: "🔐 8 · Erişim sağlama",
s8_aside: `<p><strong>🔑 Kimlik bilgileriniz Bitwarden'a gidiyor</strong> — ve birkaç gün içinde orada olacak.</p>
<p>LMS, siz ve öğrencileriniz hakkında <strong>kişisel veriler</strong> içerir, bu yüzden erişim kişiye özel ve bireyseldir: paylaşılan giriş yok, deneme hesabı yok, istisna yok.</p>
<p><strong>Nasıl gireceksiniz:</strong> LMS kimlik bilgilerinizi, diğer iş girişlerinizi zaten tuttuğunuz yer olan <strong>Bitwarden</strong>'a ekliyoruz. İstenecek bir şey ve peşine düşülecek kimse yok — sadece orada belirecekler.</p>
<p><strong>Zamanlamayı bilinçli olarak denk getirdik.</strong> Kimlik bilgileri önümüzdeki birkaç gün içinde Bitwarden'a giriyor ve bu aynı zamanda otomatik mesajları açtığımız an. Yani ilk Slack mesajı size ulaştığında, <strong>tutors.kodland.org</strong>'u açıp arkasındaki detayı görebileceksiniz.</p>
<p>Mesajlar başladıysa ve hâlâ Bitwarden'ınızda LMS kimlik bilgilerini bulamıyorsanız — <strong>#lms-feedback-tts</strong>'e yazın, aynı gün çözeceğiz.</p>`,

s9_h: "❓ 9 · SSS",
faq1_q: `<p><strong><em>"Çok fazla grubum var. Bunların hepsini her yerde mi yapmalıyım?"</em></strong></p>`,
faq1_a: `<p>Hayır. Her grupta işe yarayan <strong>bir</strong> açılış ve bir kapanış rutini oluşturun ve bunları tüm gruplarda aynı şekilde kullanın. İş yükünün kendisi sorunsa bunu söyleyin — bu, ekstra çabayla çözülecek bir şey değil, Teaching Ops ile yapılacak bir program konuşmasıdır.</p>`,
faq2_q: `<p><strong><em>"Öğrencilerim kameralarını bir türlü açmıyor. Bu benim puanım mı?"</em></strong></p>`,
faq2_a: `<p>Hayır — Sınıf İçi Katılım <strong>sınıfta geçirilen zaman</strong> ile ilgilidir, kameralarla değil. Kameralar, sohbet ve katılım bu çeyrekte ilerleyen zamanda gelecek farklı bir metriğe ait ve orada bile kamera birkaç sinyalden yalnızca biridir.</p>`,
faq3_q: `<p><strong><em>"Bir öğrencinin bağlantı sorunları var ve sürekli düşüyor. Bu benim aleyhime mi sayılır?"</em></strong></p>`,
faq3_a: `<p>Tekrarlanan yeniden bağlanmalar ve platform arızaları verilerde görünürdür ve sizin yaptığınız olarak okunmaz. Yine de rapor edin — bu sizi korur ve öğrenciye yardım sağlar.</p>`,
faq4_q: `<p><strong><em>"Gruplarımdan biri diğerlerinden çok daha zor."</em></strong></p>`,
faq4_a: `<p>Sayılarınız grup ve kurs bazında hesaplanır, bu yüzden zor bir grup bir ortalamanın arkasına saklanmaz — ve diğer her şeyi de aşağı çekmez. Genellikle faydalı soru <em>neden belirli bir sınıf diğerlerinizden farklı davranıyor</em> sorusudur ve bunu bir koçluk oturumuna taşımak iyi bir şeydir.</p>`,
faq5_q: `<p><strong><em>"Değiştirebileceğim en hızlı tek şey nedir?"</em></strong></p>`,
faq5_body: `<p>İki şey ve hazırlanması hiç zaman almıyor:</p>
<ul>
<li>Öğrencilerinizden önce sınıfta olun — bir dakika bile olsa.</li>
<li>Her öğrencinin ismiyle cevaplaması gereken, yanlış cevabı olmayan bir soruyla açın. "Tek kelime: geçen hafta ne inşa ettin?" Ekranınızı paylaşmadan önce tüm sınıfı dolaşın.</li>
</ul>
<p>Bu iki şey, bu sayfadaki başka her şeyden daha fazlasını hareket ettirir.</p>`,
faq6_q: `<p><strong><em>"Bir öğrenci arka arkaya iki dersi kaçırdı. Ne yapmalıyım?"</em></strong></p>`,
faq6_a: `<p><strong>Birine söyleyin — üçüncüyü beklemeyin.</strong> Bu, uzaklaşan bir öğrencinin hâlâ geri kazanılabileceği noktadır ve genellikle bunu zamanında gören tek kişi sizsiniz.</p>`,
faq7_q: `<p><strong><em>"Bir şey belirsizse kime sorarım?"</em></strong></p>`,
faq7_a: `<p>Bölge mentörünüze.</p>`,
faq_aside: `<p><strong>💬 Bu sayfanın yanıtlamadığı bir şey mi var?</strong> Tutor kanalınızda sorun ya da bölge mentörünüze yazın. Bir soru ikiden fazla kez ortaya çıkarsa, bu sayfaya ait demektir — bu yüzden sormak herkese yardımcı olur.</p>`,

closing_aside: `<p><strong>🎓 Tek cümlede</strong></p><p>LMS, gruplarınızdan birinde bir şeyler ters gitmeye başladığında, <strong>üçüncü ay yerine ikinci hafta öğrenmeniz — ve sorun hâlâ çözülebilirken yardım almanız</strong> için var.</p>`,
