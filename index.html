T.pt = {
launch_note: `<p><strong>📆 Só esta semana: começamos na quarta-feira 02.09.2026.</strong></p><p>A partir da próxima semana vale o ritmo habitual — tudo é recalculado na <strong>segunda-feira</strong> e as mensagens saem no início da semana. Nesta primeira semana lançamos na <strong>quarta-feira</strong> de propósito, para você ter alguns dias para explorar, se familiarizar com os seus próprios números e nos dizer o que parece errado.</p><p>Se algo precisar de ajuste, estes dois dias são exatamente para isso: relate em <strong>#lms-feedback-tts</strong> e vamos corrigir antes de o ciclo semanal normal começar.</p>`,
brandLabel: "LMS da Kodland",
footerNote: "Esta página recria o guia do LMS da Kodland do Notion para fins de tradução. Os quadros com marcador indicam onde as imagens originais do Notion devem ser inseridas.",
imgNote: "Espaço reservado para captura de tela — a imagem original não foi incluída no conteúdo de origem; adicione-a aqui.",

title: "O LMS da Kodland: seu guia",
intro1: `<p><strong>🚀 Chegou. E você vem pedindo por isso há muito tempo.</strong></p>
<p><em>"Como estão realmente os meus grupos?" · "Qual dos meus alunos está prestes a desistir?" · "Posso receber treinamento sobre aquilo em que realmente tenho dificuldade?" · "Posso simplesmente falar com alguém que conheça meus grupos?"</em></p>
<p>São perguntas justas. Simplesmente não tínhamos as ferramentas nem os processos para respondê-las. <strong>Agora temos.</strong></p>
<p><strong>Foi construído em torno do seu ensino, não dos relatórios — e isso é só o começo.</strong></p>`,
intro2: `<p><strong>🗺 Como ler esta página.</strong> Vamos em ordem: o que é isso → o que tem dentro → a primeira métrica e como ler seus próprios números → como é uma semana normal → o que vem a seguir. Cerca de oito minutos. As perguntas frequentes no final ficam para depois.</p>`,

s1_h: "🧭 1 · Primeiro, o que é isso?",
s1_p1: `<p>O <strong>LMS (Learning Management System)</strong> é uma plataforma criada pela equipe de Desenvolvimento de Tutores, para os tutores. Você já tem uma plataforma para o lado operacional do seu trabalho. Esta é para o lado pedagógico.</p>`,
backoffice: `<p><strong>🏢 Back Office — a plataforma operacional</strong></p><p>Horários, grupos, pagamentos, administração. Ela gerencia o <em>negócio</em> do ensino.</p>`,
lms: `<p><strong>🎓 LMS — a plataforma pedagógica</strong></p><p>Seu <em>ensino</em>. Como seus grupos estão realmente indo, e o que ajuda você a melhorá-los.</p>`,
s1_p2: `<p>Nenhuma substitui a outra. O Back Office responde <em>"o que está agendado?"</em> — o LMS responde <em>"como está meu ensino, e o que eu faço a respeito?"</em></p>`,
login: `<p><strong>🔗 A tela de login e a primeira coisa que você vê ao entrar.</strong></p><p>https://tutors.kodland.org/</p><p>Salve nos favoritos. Você vai receber de nós suas próprias credenciais de acesso — veja a seção 8 abaixo para saber como funciona o acesso.</p>`,

s2_h: "💡 2 · Por que construímos isso",
s2_p1: `<p><strong>Porque você pediu. Repetidamente, nas reuniões de tutores, por anos.</strong></p>`,
s2_p2: `<p>Até agora, quando um dos seus grupos começava a se desviar — um aluno ficando quieto, outro faltando às aulas — você estava, em grande parte, sozinho para perceber isso. E quando o apoio chegava, muitas vezes semanas já haviam se passado. Não porque ninguém se importasse: porque a informação estava espalhada em lugares que ninguém conseguia ler em conjunto, e não havia um processo para transformá-la em ajuda.</p>
<p>Quando uma família cancela, o motivo normalmente já está visível na sala de aula <strong>há semanas</strong>. Agora também é visível para nós — e para você primeiro.</p>`,
s2_idea: `<p><strong>🎯 A ideia toda em uma linha:</strong> você fica sabendo em uma semana em vez de um mês — e recebe ajuda enquanto o problema ainda pode ser resolvido.</p>`,

s3_h: "🧰 3 · Então, o que realmente tem dentro?",
s3_intro: `<p>Cinco coisas. Aqui está cada uma, e o que ela faz por você.</p>`,
s3_metrics_h: "📊 Suas métricas",
s3_metrics_p: `<p>Como seus grupos estão indo, em um só lugar — atualizado semanalmente, visível para você primeiro. Chega de adivinhar onde você está ou esperar por uma reunião para descobrir.</p>`,
img_metrics: "Sua página de métricas — seus próprios números, atualizados toda semana.",
s3_watch_h: "👥 Sua lista de acompanhamento de alunos",
s3_watch_p: `<p>Os <strong>nomes</strong> dos alunos dos seus grupos que precisam de atenção extra nesta semana, e <em>por que</em> cada um está na lista. Esta é a parte que, segundo os tutores nos dizem, mais muda as coisas: uma lista de nomes é algo sobre o qual você pode agir na sua próxima aula. Uma porcentagem não.</p>`,
s3_watch_aside: `<p><strong>💡 Todos os nomes são clicáveis</strong> e redirecionam para o perfil do aluno no Backoffice.</p>`,
img_watch: "A lista de acompanhamento de alunos com nomes e status.",
s3_train_h: "🎓 Treinamentos e o DST",
s3_train_p: `<p>Treinamentos curtos e específicos — não cursos genéricos. Quando algo nos seus dados precisa de atenção, você recebe o treinamento específico que ajuda com <em>isso</em>, além de um <strong>Teste Diagnóstico de Habilidades (DST)</strong> para verificar se ficou claro. Ambos são feitos para caber em uma única sessão.</p>`,
img_train: "Uma página de treinamento + o DST.",
s3_coach_h: "🤝 Sessões de coaching 1:1",
s3_coach_p: `<p>Reserve um horário com seu mentor regional em dois cliques — escolha um horário, diga sobre o que quer conversar, pronto. Uma conversa real sobre seus grupos reais, não uma revisão genérica.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Você pode solicitar uma quando quiser; não precisa esperar ser sinalizado.</p>`,
img_coach: "O fluxo de agendamento de coaching.",
s3_new_h: "🚀 Novos cursos para ensinar",
s3_new_p: `<p>Treinamentos e testes para <strong>contratação interna</strong>. Quer ensinar algo novo? Os materiais estão lá e a porta está aberta — crescer aqui deixa de depender de alguém perceber que você está pronto.</p>`,
img_new: "A área de contratação interna / cursos disponíveis.",
s3_slack: `<p><strong>💬 E você não precisa se lembrar de fazer login.</strong> Tudo chega até você pelo <strong>Slack</strong>, no seu próprio idioma — a lista de acompanhamento semanal, um treinamento atribuído, uma confirmação de coaching. A plataforma é para onde você vai para se aprofundar.</p>`,

s4_h: "🙋 4 · A primeira métrica: Frequência",
s4_p1: `<p>Agora a parte que mais importa, porque é a que entra no ar primeiro.</p>`,
s4_p2: `<p><strong>Começamos deliberadamente com uma única métrica, feita corretamente.</strong> E essa métrica agora responde a duas perguntas em vez de uma — porque um aluno pode estar ausente da aula, ou presente mas desligado, e esses são problemas completamente diferentes.</p>`,

s4_absence_h: "🟡🔴 Como a Frequência do Back Office é registrada: dois tipos de ausência",
s4_absence_p: `<p>Extraímos dados sobre ausências e tipos de ausência a partir do que você registra manualmente.</p>`,
s4_yellow: `<p><strong>🟡 Amarelo — a família avisou você.</strong> Alguém te informou. Uma família lidando com uma situação, um aluno com uma prova, um laptop quebrado. Você seleciona amarelo <strong>e escolhe o motivo que te passaram</strong>. Essas doze opções não são burocracia. São a única forma de descobrirmos <strong>quais ausências poderíamos ter evitado do nosso lado.</strong> Escolha a mais próxima com honestidade. Cinco segundos da sua parte, e um padrão sobre o qual realmente podemos agir.</p><p>Motivos amarelos disponíveis:</p>`,
s4_red: `<p><strong>🔴 Vermelho — ninguém te disse nada.</strong> O aluno simplesmente não apareceu, e ninguém disse por quê. Selecione vermelho <strong>apenas</strong> nesse caso. Vermelho não é um rótulo mais duro para a mesma coisa — <strong>significa que não sabemos o que aconteceu.</strong> É isso que o torna o estado mais perigoso de toda a página: uma ausência com motivo é uma situação sendo gerenciada, enquanto uma ausência sem motivo é um aluno que talvez já tenha ido embora, e ninguém pode ajudar alguém cujo problema é invisível.</p>`,
s4_red_aside: `<p><strong>💡 Vermelho não é um veredito — é "ainda não sabemos".</strong></p>
<p>Se você marcar um aluno de vermelho e a família explicar depois, <strong>mude para amarelo e adicione o motivo</strong>. Isso não é corrigir um erro; é o processo funcionando: você entrou em contato, obteve uma resposta, e o registro agora reflete a realidade.</p>
<p>Isso também é a coisa mais rápida que você pode fazer pelos seus próprios números. Uma ausência sem explicação que permanece sem explicação conta contra sua frequência. A mesma ausência, depois que você falou com a família e registrou o motivo, não conta.</p>`,

s4_presence_h: "🧮 Como a Presença em Sala é calculada",
s4_presence_p: `<p>Sem caixa preta. Três passos.</p>`,
presence_why: `<p><strong>Por que medimos isso.</strong> Mostra quanto da aula o aluno realmente acompanha &mdash; e isso está fortemente ligado à retenção. Um aluno que entra e vai se afastando está a caminho de sair muito antes de isso aparecer na frequência.</p>`,
step1: `<p><strong>1 &middot; Em cada aula somamos todo o tempo em que o aluno esteve conectado.</strong></p>`,
step1b: `<p>A Presença em Sala é a <strong>soma de todos os trechos entre a conexão e a desconexão do aluno</strong>. Se a conexão cai e ele volta, os trechos são somados &mdash; a reconexão em si não custa nada.</p>`,
step2: `<p><strong>2 &middot; Dividimos esse total pela duração programada da aula.</strong></p>`,
step2b: `<p>Dois exemplos resolvidos:</p>`,
presence_examples: [
 "<strong>Aula 19:00 &ndash; 20:00.</strong> O aluno conecta às 19:00 e desconecta às 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Aula 19:00 &ndash; 20:00.</strong> O aluno conecta às 19:00 e desconecta às 19:20; depois de resolver um problema de PC ou de conexão, reconecta às 19:40 e fica mais 20 minutos. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; A Presença em Sala dele é a média disso nas aulas dos últimos 30 dias</strong> &mdash; calculada <strong>por grupo e por curso</strong>, então um aluno que está com você em dois cursos é medido separadamente em cada um. A janela é móvel e os números são atualizados <strong>toda segunda-feira</strong>.</p>`,
exclude_intro: `<p>O que é excluído, e por quê:</p>`,
presence_note: `<p><strong>👀 Vale saber:</strong> a Presença em Sala mede o <strong>tempo na sala</strong> — nada mais. Não se trata da sua câmera, do seu chat, ou de quem fala mais. Esses sinais pertencem a uma métrica diferente que chega mais adiante neste trimestre, e vamos explicá-la com a mesma transparência.</p>`,

presence_reliability: `<p><strong>🔧 Se um número parecer errado, nos avise.</strong> Publique no canal <strong>#lms-feedback-tts</strong> com um print e uma breve descrição do problema, e marque seu mentor regional.</p>`,
s4_risk_h: "🚦 Seus dois sinais",
risk_p1: `<p>Cada aluno tem <strong>duas categorias</strong> &mdash; uma da Presença em Sala e outra da frequência no Back Office. Suas listas mostram <strong>a pior das duas</strong>, para que ninguém escape quando as duas discordam.</p>`,
alert_warning: `<p><strong>⚠️ Uma palavra, dois significados &mdash; leia o rótulo junto com o sinal.</strong> <strong>ALERT</strong> no lado da Presença em Sala significa presença abaixo de 50%. <strong>Alert</strong> no lado do Back Office significa 2&ndash;3 ausências explicadas. São sinais diferentes com gravidades diferentes &mdash; então nomeie sempre o sinal: <em>ALERT (presença)</em>, <em>Alert (ausências)</em>. Recomendamos o mesmo ao falar de um aluno com seu mentor. Os nomes dos grupos aparecem em inglês no LMS, e por isso também os mantemos em inglês aqui.</p>`,
risk_p2: `<p>Leia-as como <strong>alternativas, não como condições</strong>: o aluno é classificado <em>ou</em> pelas ausências <em>ou</em> pela presença &mdash; o que for pior. Um aluno sem nenhuma ausência pode cair em 🟠 RISK só pela presença se estiver na sala apenas 60% da aula, e um aluno com presença perfeita pode cair em 🔴 Critical por uma única ausência sem explicação.</p>`,
risk_p3: `<p>Para cada aluno sinalizado você também vê o <strong>motivo</strong> por trás de cada ausência amarela &mdash; um dos doze listados acima &mdash; para não precisar adivinhar.</p>`,
s4_hpr_h: "📈 HPR e LPR — os dois números no seu cartão",
hpr_intro: `<p>Eles são medidos com base na <strong>Presença em Sala</strong>:</p>`,
bar_p: `<p>O padrão que mantemos em todas as regiões: <strong>LPR igual ou abaixo de 25,5%</strong> · <strong>HPR igual ou acima de 49,5%</strong>.</p>`,
target_aside: `<p><strong>📌 Estas são as metas globais para o trimestre de lançamento.</strong> As metas regionais estão sendo confirmadas com cada Head of Teaching, e seu cartão no LMS sempre mostra a que se aplica a você — então confie no cartão acima de qualquer número escrito em outro lugar.</p>`,
goal_aside: `<p><strong>🎯 Na Presença em Sala, a meta é numérica:</strong> subir o HPR, baixar o LPR.</p>
<p><strong>Na Frequência do Back Office, a meta são dois resultados — sem taxa:</strong></p>
<ul>
<li>🔴 <strong>Eliminar as ausências não justificadas.</strong> Uma ausência vermelha significa que um aluno desapareceu e ninguém fez o acompanhamento. Isso deveria deixar de ser possível.</li>
<li>🟡 <strong>Eliminar a evasão que começa na segunda ausência justificada.</strong> Duas amarelas é o ponto em que um aluno começa a se afastar e ainda pode ser recuperado. Depois disso, as chances caem rápido.</li>
</ul>
<p><strong>Nenhum aluno deveria desaparecer em silêncio, e nenhum deveria ser perdido por duas ausências às quais ninguém respondeu.</strong></p>`,

s4_payoff_h: "🧭 E aqui está a utilidade prática",
payoff_p1: `<p>As duas medidas apontam para problemas diferentes, com soluções diferentes. É por isso que as separamos:</p>`,
payoff_p2: `<p>A mesma porcentagem única que você tinha antes, com dois planos de ação completamente diferentes escondidos dentro dela.</p>`,

maria_h: "🧑‍🏫 Caso 1 · Maria — um problema de Presença em Sala",
maria_p1: `<p>Maria ensina <strong>3 grupos</strong>, <strong>21 alunos</strong> no total. Aqui estão seus últimos 30 dias.</p>`,
maria_p2: `<p>Então seus dois números são:</p>`,
maria_aside: `<p><strong>💡 Maria é sinalizada pelo HPR, não pelo LPR — e este é o caso mais comum.</strong></p>
<p>Ninguém desapareceu. Todos os alunos dela <em>vêm</em>. Mas nove deles saem na metade, então são poucos demais os alunos dela que ficam genuinamente presentes durante toda a aula. No número único antigo, isso era invisível: esses nove alunos contavam como "presentes".</p>`,

monday_h: "📅 Segunda-feira de manhã — o que realmente acontece",
monday_step1: `<p><strong>1 · Chega uma DM no Slack.</strong> Do Desenvolvimento de Tutores, no idioma da Maria. Fica assim:</p>`,
monday_after_quote: `<p>Maria não precisa fazer login para descobrir. <strong>A plataforma vai até ela.</strong></p>`,
monday_step2: `<p><strong>2 · Ela abre o LMS para ver os detalhes.</strong> Em tutors.kodland.org ela encontra suas duas medidas, seu HPR e LPR em relação às metas, e a mesma lista de acompanhamento — mas com o grupo de cada aluno, sua porcentagem de presença, e um link direto para o perfil no Back Office. É para lá que ela vai quando quer saber <em>em qual grupo</em> está o problema.</p>`,
monday_step3: `<p><strong>3 · Ela percebe algo que a mensagem do Slack não pode contar.</strong> Sete dos nove alunos que saem cedo estão no mesmo grupo — a turma de sábado às 18h. Isso não é um problema de ensino geral, é uma sala, em um horário, com uma dinâmica. Agora ela sabe onde focar.</p>`,
monday_step4: `<p><strong>4 · Ela faz o treinamento.</strong> Está no LMS, atribuído a ela, curto. Ela o completa junto com o DST dentro dos quatro dias e recebe uma mensagem no Slack confirmando que passou.</p>`,
monday_step5: `<p><strong>5 · Ela muda duas coisas nas próximas aulas.</strong> Do treinamento e das dicas semanais: ela começa a abrir com uma pergunta que cada aluno tem que responder pelo nome, e para de deixar os últimos cinco minutos se perderem — o resumo e a frase "o que vem na próxima aula" são o que mantêm os alunos na sala até o final.</p>`,
monday_step6: `<p><strong>6 · Duas semanas depois seu HPR está em 51%.</strong> Ela recebe uma mensagem no Slack dizendo que não está mais sinalizada. Ninguém teve uma conversa difícil com ela em nenhum momento.</p>`,
maria_ifnot: `<p><strong>🤝 E se não tivesse melhorado?</strong> Depois do treinamento, se a métrica continuar abaixo da meta, Maria é convidada a reservar uma sessão <strong>1:1 com seu mentor regional</strong> — dois cliques, escolha um horário. Essa conversa é sobre os grupos reais dela, provavelmente aquela turma de sábado às 18h. Ainda assim, ninguém decidindo nada sobre ela a partir de um número.</p>`,

cases_h: "🧭 Dois casos, um mesmo processo",
cases_intro: `<p>Uma mensagem chega até você quando uma de três coisas acontece. Sua <strong>Presença em Sala</strong> está fora da meta — HPR abaixo, ou LPR acima. Suas <strong>ausências no Back Office</strong> parecem problemáticas — dois ou mais alunos com duas ou mais ausências que ninguém explicou, ou, quando você já tem 10 ou mais alunos, mais da metade da sua lista com uma. Ou dispara um <strong>caso urgente</strong>: um aluno com três ou mais ausências sem explicação, ou dois alunos com quatro ou mais explicadas — independentemente do que digam suas taxas.</p><p>Maria tem o primeiro problema, Marco o segundo. O que acontece depois é igual em todos os casos:</p>`,
cases_list: ["<strong>Uma mensagem</strong> — com dicas práticas <em>e</em> as regulamentações aplicáveis, anexadas, para você nunca precisar ir procurar uma norma.","<strong>Um treinamento curto no LMS</strong> — atribuído a você, mais o DST, quatro dias para concluir.","<strong>Um 1:1 com seu mentor regional</strong> — se depois disso o número ainda não se mexeu."],
cases_aside: `<p><strong>🤝 Nada aqui é decidido por um número.</strong> A plataforma decide onde olhamos primeiro — depois uma pessoa conversa com você. Se algo nos dados parecer errado, dizer isso é útil, não constrangedor.</p>`,
marco_flag: `<p>É isso que dispara a mensagem dele. A frequência no Back Office não sinaliza por média — sinaliza pelo estado dos registros: <strong>dois ou mais alunos com duas ou mais ausências que ninguém explicou</strong>, ou, quando você já tem 10 ou mais alunos, <strong>mais da metade da sua lista com uma</strong>. Os dois alunos de Marco, com duas ausências sem explicação cada, são exatamente isso. Uma ausência com motivo é uma situação sendo gerenciada. Uma vermelha é um aluno que talvez já tenha ido embora.</p>`,
marco_week_h: "📅 A segunda-feira dele — o que realmente acontece",
marco_s0: `<p><strong>1 · A mesma DM no Slack — com as normas anexadas.</strong> Marco não precisa procurar nem lembrar de nenhuma norma. Fica assim:</p>`,
marco_quote: [
 "Oi Marco 👋",
 "Somos do Departamento de Desenvolvimento de Tutores e estamos entrando em contato sobre os registros de frequência nos seus grupos. <strong>Dois dos seus alunos têm, cada um, duas ausências marcadas como 🔴 vermelhas</strong> — registradas sem motivo.",
 "Alunos para acompanhar:<br>🔴 Lukas Meyer — 2 aulas, sem motivo registrado<br>🔴 Ana Silva — 2 aulas, sem motivo registrado",
 "Atribuímos um treinamento curto para ajudar: <em>Lidando com Ausências</em> — [link]. Conclua junto com o DST nos próximos 4 dias.",
 "As normas para ausências vermelhas e amarelas estão anexadas a esta mensagem — o que fazer, em que ordem, e o que registrar.",
 "Seu mentor regional está sempre disponível para ajudar.",
],
marco_s1: `<p><strong>2 · Ele abre o LMS para ver quem e onde.</strong> A mesma lista de acompanhamento que Maria vê, mas a dele mostra os dois alunos, seus grupos, e um link direto para cada perfil no Back Office.</p>`,
marco_s2: `<p><strong>3 · Ele escreve para as duas famílias no mesmo dia.</strong> A gravação, um resumo curto do que foi perdido, e uma pergunta: o que aconteceu? Uma ausência que ninguém reconhece tem muito mais chance de se tornar a segunda.</p>`,
marco_s3: `<p><strong>4 · Ele registra o que a família contou.</strong> O 🔴 vermelho passa a 🟡 amarelo com o motivo anexado — uma era semana de provas, a outra um laptop quebrado. Uma ausência vermelha nunca deveria ficar sem explicação por mais de 48 horas.</p>`,
marco_s4: `<p><strong>5 · Ele pergunta antes de prometer qualquer extra.</strong> Um dos dois ficou para trás, então Marco leva isso ao TL — uma aula extra ou motivacional é decisão dele, nunca algo a oferecer diretamente a uma família. "Deixa eu verificar" é uma resposta completa nesse meio-tempo.</p>`,
marco_s5: `<p><strong>6 · Os registros dele estão limpos na semana seguinte</strong>, e uma mensagem no Slack diz que ele não está mais sinalizado. Como com Maria, ninguém teve uma conversa difícil com ele em nenhum momento.</p>`,
marco_ifnot: `<p><strong>🤝 E se as ausências continuassem?</strong> Exatamente como com Maria: se o quadro não melhorou depois do treinamento, Marco é convidado a reservar um <strong>1:1 com seu mentor regional</strong> — dois cliques, escolha um horário. Mesmo processo, assunto diferente: o dela é sobre conduzir a aula, o dele sobre o que acontece entre as aulas.</p>`,
marco_h: "🔄 Caso 2 · Marco — um problema de Frequência no Back Office",
marco_p1: `<p>Marco também ensina 3 grupos. Os alunos que aparecem estão totalmente presentes — o HPR dele é 61%, confortavelmente acima da meta, então nada na Presença em Sala dele está sinalizado. O problema dele é a outra medida: <strong>dois dos seus alunos não vieram às duas últimas aulas e nunca avisaram.</strong> Ambos constam no registro como 🔴 vermelho — ninguém sabe por quê.</p>`,
marco_aside: `<p><strong>🎯 Mesma métrica, dois problemas opostos.</strong> O trabalho da Maria é <em>dentro</em> da aula. O de Marco é <em>fora</em> dela. É exatamente por isso que dividimos a frequência em duas medidas — para que a ajuda que você recebe corresponda ao problema que você realmente tem.</p>`,

s5_h: "📅 5 · Como é uma semana normal",
s5_p1: `<p>Agora você já sabe o que é a plataforma e o que os números significam. Aqui está todo o fluxo em um só lugar.</p>`,
s5_flow_h: "🧭 O fluxo, em resumo",
s5_when_h: "❓ Quando exatamente serei sinalizado, e por quê?",
s5_when_p: `<p>Três situações, e mais nada:</p>`,
s5_when_aside: `<p><strong>🙋 E o que eu preciso fazer?</strong> Três coisas, sempre.</p>
<ol class="list">
<li>Leia a mensagem. Ela nomeia a métrica, os alunos e o prazo.</li>
<li>Complete o treinamento e o DST em até 4 dias. Eles são curtos por design.</li>
<li>Dê a esses alunos uma forma de participar nas suas próximas aulas. O treinamento e as dicas dizem como — essa é a parte que realmente move o número.</li>
</ol>`,

s5_arrive_h: "📨 E é assim que isso chega até você",
s5_three_aside: `<p><strong>🙌 Três coisas que pedimos a você</strong></p>
<ol class="list">
<li>Leia a mensagem quando ela chegar.</li>
<li>Faça algo a respeito — se um treinamento for atribuído, complete-o com o DST em até 4 dias.</li>
<li>Pergunte se algo não estiver claro. É exatamente para isso que seu mentor regional existe.</li>
</ol>`,

s5_msg_h: "📲 Acabou de chegar uma mensagem. O que eu faço?",
s5_msg_p: `<p>Tudo chega até você como uma <strong>DM no Slack do Desenvolvimento de Tutores</strong>. Existem apenas cinco tipos, e nenhum deles precisa de uma resposta longa.</p>`,
s5_msg_aside: `<p><strong>🤖 Essas DMs são enviadas automaticamente</strong>, então a sua resposta não chega a ninguém. Se quiser dizer algo, mande mensagem diretamente ao seu <strong>mentor regional</strong> — ou publique no canal abaixo, o que costuma ser mais rápido.</p>`,

s5_feedback_h: "🛠 Algo parece errado? Existe um único lugar para dizer isso",
feedback_aside: `<p><strong>📣 Publique em #lms-feedback-tts.</strong></p>
<p>Não uma DM para quem você conhece, e não enterrado no seu canal de tutores. Um único canal significa que vemos cada relato, corrigimos as coisas uma vez em vez de nove, e você pode ver que alguém percebeu.</p>
<p>Vale a pena publicar:</p>
<ul>
<li>🔢 Um número que parece errado — um aluno marcado como ausente que claramente estava na sala, uma porcentagem que não corresponde ao que você viu</li>
<li>🔗 Um link quebrado, ou um treinamento que não corresponde ao problema descrito na mensagem</li>
<li>🌐 Uma mensagem no idioma errado, ou que nomeia um aluno que não é seu</li>
<li>🔑 Credenciais que você não consegue encontrar no Bitwarden depois que as mensagens começaram</li>
<li>😵 Qualquer coisa confusa, quebrada ou lenta — e qualquer coisa que você gostaria que fizesse e não faz</li>
</ul>
<p><strong>Isso não é reclamar e não conta contra você.</strong> Nas primeiras semanas especialmente, vocês são os únicos que podem ver se isso realmente funciona. Um relato que poupa o próximo tutor da mesma confusão vale muito mais para nós do que um silêncio educado.</p>`,

s5_mentor_h: "🌍 Seu mentor regional",
mentor_p: `<p>Essa é a pessoa nomeada em toda mensagem que você recebe de nós — e o ser humano com quem você realmente vai conversar. Você não precisa esperar ser sinalizado para entrar em contato.</p>`,

s6_h: "🙅 6 · O que isso não é",
s6_p1: `<p>Antes de fazer login pela primeira vez, vamos ser diretos sobre o que preocupa as pessoas.</p>`,
s6_aside: `<p><strong>⚖️</strong> E quando os dados estiverem genuinamente errados — um aluno marcado como ausente que claramente estava na sala, uma falha da plataforma — <strong>nos avise em #lms-feedback-tts</strong>. Esses casos também são visíveis para nós, e sinalizá-los protege tanto você quanto o aluno.</p>`,

s7_h: "🔮 7 · O que vem a seguir",
s7_p1: `<p>Frequência é a primeira métrica, não a última.</p>`,
s7_aside: `<p><strong>🛠 Esta é a versão um</strong>, e pretendemos continuar construindo com você. Se algo estiver confuso, faltando ou errado, diga — esse feedback é como a próxima versão é escrita.</p>`,

s8_h: "🔐 8 · Obtendo acesso",
s8_aside: `<p><strong>🔑 Suas credenciais estão indo para o Bitwarden</strong> — e estarão lá dentro de alguns dias.</p>
<p>O LMS contém <strong>dados pessoais</strong> sobre você e sobre seus alunos, então o acesso é nomeado e individual: sem login compartilhado, sem conta de demonstração, sem exceções.</p>
<p><strong>Como você vai entrar:</strong> estamos adicionando suas credenciais do LMS ao <strong>Bitwarden</strong>, o mesmo lugar onde você já guarda seus outros logins de trabalho. Não há nada para solicitar nem ninguém para cobrar — elas simplesmente vão aparecer lá.</p>
<p><strong>O timing foi pensado de propósito.</strong> As credenciais entram no Bitwarden nos próximos dias, e esse também é o momento em que ativamos as mensagens automáticas. Assim, quando a primeira mensagem do Slack chegar até você, você já poderá abrir <strong>tutors.kodland.org</strong> e ver os detalhes por trás dela.</p>
<p>Se as mensagens já começaram e você ainda não consegue encontrar as credenciais do LMS no seu Bitwarden — publique em <strong>#lms-feedback-tts</strong> e resolveremos ainda no mesmo dia.</p>`,

s9_h: "❓ 9 · Perguntas frequentes",
faq1_q: `<p><strong><em>"Tenho muitos grupos. Preciso fazer tudo isso em todos eles?"</em></strong></p>`,
faq1_a: `<p>Não. Construa <strong>uma</strong> rotina de abertura e uma de fechamento que funcionem em todos os grupos, e use-as de forma idêntica. Se a carga de trabalho em si for o problema, diga — essa é uma conversa sobre horários com o Teaching Ops, não algo para resolver com mais esforço.</p>`,
faq2_q: `<p><strong><em>"Meus alunos simplesmente não ligam a câmera. Isso conta na minha pontuação?"</em></strong></p>`,
faq2_a: `<p>Não — a Presença em Sala é sobre <strong>tempo na sala</strong>, não câmeras. Câmeras, chat e participação pertencem a uma métrica diferente que chega mais adiante neste trimestre, e mesmo lá, a câmera é apenas um dos vários sinais.</p>`,
faq3_q: `<p><strong><em>"Um aluno tem problemas de conexão e fica caindo. Isso conta contra mim?"</em></strong></p>`,
faq3_a: `<p>Reconexões repetidas e falhas da plataforma são visíveis nos dados e não são interpretadas como culpa sua. Reporte de qualquer forma — isso protege você e ajuda o aluno.</p>`,
faq4_q: `<p><strong><em>"Um dos meus grupos é muito mais difícil do que os outros."</em></strong></p>`,
faq4_a: `<p>Seus números são calculados por grupo e por curso, então um grupo difícil não se esconde atrás de uma média — e também não arrasta tudo o resto para baixo. A pergunta útil geralmente é <em>por que uma sala específica se comporta de forma diferente das outras</em>, e isso é uma boa coisa para levar a uma sessão de coaching.</p>`,
faq5_q: `<p><strong><em>"Qual é a única coisa mais rápida que posso mudar?"</em></strong></p>`,
faq5_body: `<p>Duas coisas, e não custam nada para preparar:</p>
<ul>
<li>Estar na sala antes dos seus alunos — mesmo que seja um minuto antes.</li>
<li>Abrir com uma pergunta que cada aluno tem que responder pelo nome, sem resposta errada. "Uma palavra: o que você construiu na semana passada?" Passe por toda a sala antes de compartilhar sua tela.</li>
</ul>
<p>Essas duas coisas movem mais do que qualquer outra coisa nesta página.</p>`,
faq6_q: `<p><strong><em>"Um aluno faltou a duas aulas seguidas. O que eu faço?"</em></strong></p>`,
faq6_a: `<p><strong>Avise alguém — não espere a terceira.</strong> Esse é o ponto em que um aluno que está se afastando ainda pode ser recuperado, e geralmente você é a única pessoa que percebe isso a tempo.</p>`,
faq7_q: `<p><strong><em>"A quem eu pergunto se algo não estiver claro?"</em></strong></p>`,
faq7_a: `<p>Seu mentor regional.</p>`,
faq_aside: `<p><strong>💬 Algo que esta página não respondeu?</strong> Pergunte no seu canal de tutores ou mande mensagem ao seu mentor regional. Se uma pergunta surgir mais de duas vezes, ela pertence a esta página — então perguntar ajuda a todos.</p>`,

closing_aside: `<p><strong>🎓 Em uma linha</strong></p><p>O LMS existe para que, quando algo começar a dar errado em um dos seus grupos, <strong>você fique sabendo na semana dois em vez do mês três — e receba ajuda enquanto ainda pode ser resolvido.</strong></p>`,

T.pl = {
launch_note: `<p><strong>📆 Tylko w tym tygodniu: startujemy w środę 02.09.2026.</strong></p><p>Od następnego tygodnia obowiązuje zwykły rytm — wszystko jest przeliczane w <strong>poniedziałek</strong>, a wiadomości wychodzą na początku tygodnia. W tym pierwszym tygodniu uruchamiamy to w <strong>środę</strong> celowo, żeby dać ci kilka dni na rozejrzenie się, zapoznanie z własnymi liczbami i powiedzenie nam, co wygląda źle.</p><p>Jeśli coś wymaga korekty, te dwa dni są dokładnie na to: zgłoś to na <strong>#lms-feedback-tts</strong>, a naprawimy to przed rozpoczęciem normalnego cyklu tygodniowego.</p>`,
brandLabel: "LMS Kodland",
footerNote: "Ta strona odtwarza przewodnik po LMS Kodland z Notion do celów tłumaczenia. Ramki z symbolem zastępczym pokazują, gdzie należy wstawić oryginalne obrazy z Notion.",

title: "LMS Kodland: twój przewodnik",
intro1: `<p><strong>🚀 Jest gotowe. A prosiliście o to od dawna.</strong></p>
<p><em>"Jak naprawdę radzą sobie moje grupy?" · "Który z moich uczniów jest bliski rezygnacji?" · "Czy mogę dostać szkolenie z tego, z czym naprawdę mam problem?" · "Czy mogę po prostu porozmawiać z kimś, kto zna moje grupy?"</em></p>
<p>To uzasadnione pytania. Po prostu nie mieliśmy narzędzi ani procesów, żeby na nie odpowiedzieć. <strong>Teraz mamy.</strong></p>
<p><strong>Zostało zbudowane wokół twojego nauczania, nie wokół raportowania — i to dopiero początek.</strong></p>`,
intro2: `<p><strong>🗺 Jak czytać tę stronę.</strong> Pójdziemy po kolei: czym to jest → co zawiera → pierwsza metryka i jak czytać swoje własne liczby → jak wygląda normalny tydzień → co dalej. Około ośmiu minut. FAQ na dole zostaw sobie na później.</p>`,

s1_h: "🧭 1 · Najpierw, czym to jest?",
s1_p1: `<p><strong>LMS (Learning Management System)</strong> to platforma zbudowana przez zespół Tutor Development, dla tutorów. Masz już platformę dla operacyjnej strony swojej pracy. Ta jest dla strony dydaktycznej.</p>`,
backoffice: `<p><strong>🏢 Back Office — platforma operacyjna</strong></p><p>Harmonogramy, grupy, płatności, administracja. Obsługuje <em>biznes</em> nauczania.</p>`,
lms: `<p><strong>🎓 LMS — platforma dydaktyczna</strong></p><p>Twoje <em>nauczanie</em>. Jak naprawdę radzą sobie twoje grupy i co pomaga je ulepszyć.</p>`,
s1_p2: `<p>Żadna nie zastępuje drugiej. Back Office odpowiada na pytanie <em>"co jest zaplanowane?"</em> — LMS odpowiada na pytanie <em>"jak idzie moje nauczanie i co z tym zrobić?"</em></p>`,
login: `<p><strong>🔗 Ekran logowania i pierwsza rzecz, którą widzisz po zalogowaniu.</strong></p><p>https://tutors.kodland.org/</p><p>Dodaj do zakładek. Otrzymasz od nas własne dane logowania — jak działa dostęp, opisano w sekcji 8 poniżej.</p>`,

s2_h: "💡 2 · Dlaczego to zbudowaliśmy",
s2_p1: `<p><strong>Bo o to prosiliście. Wielokrotnie, na spotkaniach tutorów, przez lata.</strong></p>`,
s2_p2: `<p>Do tej pory, gdy jedna z twoich grup zaczynała się rozjeżdżać — uczeń stawał się cichy, inny opuszczał lekcje — w dużej mierze tylko od ciebie zależało, czy ktoś to zauważy. A gdy pojawiało się wsparcie, często minęły już tygodnie. Nie dlatego, że nikogo to nie obchodziło: informacje były rozproszone w miejscach, których nikt nie mógł czytać razem, i nie było procesu, by zamienić je w pomoc.</p>
<p>Zanim rodzina zrezygnuje, powód zwykle jest już widoczny na lekcjach <strong>od tygodni</strong>. Teraz jest widoczny również dla nas — i dla ciebie w pierwszej kolejności.</p>`,
s2_idea: `<p><strong>🎯 Cały pomysł w jednym zdaniu:</strong> dowiadujesz się w ciągu tygodnia zamiast miesiąca — i otrzymujesz pomoc, gdy problem wciąż da się rozwiązać.</p>`,

s3_h: "🧰 3 · Co więc jest w środku?",
s3_intro: `<p>Pięć rzeczy. Oto każda z nich i co robi dla ciebie.</p>`,
s3_metrics_h: "📊 Twoje metryki",
s3_metrics_p: `<p>Jak radzą sobie twoje grupy, w jednym miejscu — aktualizowane co tydzień, widoczne dla ciebie w pierwszej kolejności. Koniec ze zgadywaniem, jak sobie radzisz, albo czekaniem na spotkanie, by się dowiedzieć.</p>`,
img_metrics: "Twoja strona metryk — twoje własne liczby, aktualizowane co tydzień.",
s3_watch_h: "👥 Twoja lista obserwowanych uczniów",
s3_watch_p: `<p><strong>Imiona i nazwiska</strong> uczniów w twoich grupach, którzy potrzebują dodatkowej uwagi w tym tygodniu, i <em>dlaczego</em> każdy z nich znalazł się na liście. To ta część, która zdaniem tutorów zmienia najwięcej: lista nazwisk to coś, na czym możesz oprzeć działanie na następnej lekcji. Procent — nie.</p>`,
s3_watch_aside: `<p><strong>💡 Wszystkie nazwiska są klikalne</strong> i przekierowują do profilu ucznia w Backoffice.</p>`,
img_watch: "Lista obserwowanych uczniów z imionami i statusami.",
s3_train_h: "🎓 Szkolenia i DST",
s3_train_p: `<p>Krótkie, ukierunkowane szkolenia — nie ogólne kursy. Gdy coś w twoich danych wymaga uwagi, otrzymujesz konkretne szkolenie, które pomaga <em>z tym właśnie</em>, plus <strong>Diagnostyczny Test Umiejętności (DST)</strong>, by sprawdzić, czy się przyjęło. Oba są zaprojektowane tak, by zmieścić się w jednym podejściu.</p>`,
img_train: "Strona szkolenia + DST.",
s3_coach_h: "🤝 Sesje coachingu 1:1",
s3_coach_p: `<p>Zarezerwuj czas ze swoim mentorem regionalnym w dwóch kliknięciach — wybierz termin, powiedz o czym chcesz porozmawiać, gotowe. Prawdziwa rozmowa o twoich rzeczywistych grupach, nie ogólny przegląd.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Możesz poprosić o sesję kiedy tylko chcesz; nie musisz czekać na oznaczenie.</p>`,
img_coach: "Proces rezerwacji coachingu.",
s3_new_h: "🚀 Nowe kursy do nauczania",
s3_new_p: `<p>Szkolenia i testy dla <strong>rekrutacji wewnętrznej</strong>. Chcesz uczyć czegoś nowego? Materiały są dostępne, a drzwi otwarte — rozwój tutaj przestaje zależeć od tego, czy ktoś zauważy, że jesteś gotowy.</p>`,
img_new: "Obszar rekrutacji wewnętrznej / dostępnych kursów.",
s3_slack: `<p><strong>💬 I nie musisz pamiętać, żeby się zalogować.</strong> Wszystko dociera do ciebie przez <strong>Slack</strong>, w twoim własnym języku — cotygodniowa lista obserwowanych, przypisane szkolenie, potwierdzenie coachingu. Platforma to miejsce, do którego idziesz, by zagłębić się w szczegóły.</p>`,

s4_h: "🙋 4 · Pierwsza metryka: Frekwencja",
s4_p1: `<p>Teraz część, która ma największe znaczenie, bo to ta, która wystartuje jako pierwsza.</p>`,
s4_p2: `<p><strong>Celowo zaczynamy od jednej metryki, zrobionej porządnie.</strong> A ta metryka odpowiada teraz na dwa pytania zamiast jednego — bo uczeń może być nieobecny na lekcji, albo obecny, ale wyłączony myślami, a to zupełnie różne problemy.</p>`,

s4_absence_h: "🟡🔴 Jak rejestrowana jest Frekwencja w Backoffice: dwa rodzaje nieobecności",
s4_absence_p: `<p>Pobieramy dane o nieobecnościach i ich typach z tego, co wpisujesz ręcznie.</p>`,
s4_yellow: `<p><strong>🟡 Żółty — rodzina cię poinformowała.</strong> Ktoś dał ci znać. Rodzina radząca sobie z sytuacją, uczeń mający egzamin, zepsuty laptop. Wybierasz żółty <strong>i zaznaczasz podany powód</strong>. Te dwanaście opcji to nie biurokracja. To jedyny sposób, w jaki dowiadujemy się, <strong>którym nieobecnościom mogliśmy zapobiec z naszej strony.</strong> Wybierz najbliższą opcję uczciwie. Pięć sekund z twojej strony, a wzorzec, na którym naprawdę możemy działać.</p><p>Dostępne powody żółte:</p>`,
s4_red: `<p><strong>🔴 Czerwony — nikt ci nic nie powiedział.</strong> Uczeń po prostu się nie pojawił i nikt nie powiedział dlaczego. Wybierz czerwony <strong>tylko</strong> w takim przypadku. Czerwony nie jest surowszą etykietą dla tego samego — <strong>oznacza, że nie wiemy, co się stało.</strong> To właśnie czyni go najbardziej niebezpiecznym stanem na całej stronie: nieobecność z powodem to sytuacja będąca pod kontrolą, podczas gdy nieobecność bez powodu to uczeń, który być może już odszedł, a nikt nie może pomóc komuś, czyj problem jest niewidoczny.</p>`,
s4_red_aside: `<p><strong>💡 Czerwony to nie wyrok — to "jeszcze nie wiadomo".</strong></p>
<p>Jeśli oznaczysz ucznia na czerwono, a rodzina później to wyjaśni, <strong>zmień na żółty i dodaj powód</strong>. To nie jest poprawianie błędu; to proces działający tak, jak powinien: kontaktujesz się, dostajesz odpowiedź, a zapis odzwierciedla teraz rzeczywistość.</p>
<p>To też najszybsza rzecz, jaką możesz zrobić dla swoich własnych liczb. Niewyjaśniona nieobecność, która pozostaje niewyjaśniona, liczy się na niekorzyść twojej frekwencji. Ta sama nieobecność, gdy porozmawiasz z rodziną i zapiszesz powód, już się nie liczy.</p>`,

s4_presence_h: "🧮 Jak obliczana jest Obecność w Klasie",
s4_presence_p: `<p>Żadnej czarnej skrzynki. Trzy kroki.</p>`,
presence_why: `<p><strong>Dlaczego to mierzymy.</strong> Pokazuje, jaką część lekcji uczeń naprawdę jest obecny &mdash; a to jest silnie powiązane z retencją. Uczeń, który się loguje i odpływa, jest na drodze do odejścia na długo przed tym, nim zobaczymy to w obecnościach.</p>`,
step1: `<p><strong>1 &middot; Dla każdej lekcji sumujemy cały czas, w którym uczeń był połączony.</strong></p>`,
step1b: `<p>Obecność w Klasie to <strong>suma wszystkich odcinków między połączeniem i rozłączeniem ucznia</strong>. Jeśli połączenie zerwie się i uczeń wróci, odcinki są sumowane &mdash; samo ponowne połączenie nic nie kosztuje.</p>`,
step2: `<p><strong>2 &middot; Dzielimy tę sumę przez zaplanowaną długość lekcji.</strong></p>`,
step2b: `<p>Dwa rozwiązane przykłady:</p>`,
presence_examples: [
 "<strong>Lekcja 19:00 &ndash; 20:00.</strong> Uczeń łączy się o 19:00 i rozłącza o 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Lekcja 19:00 &ndash; 20:00.</strong> Uczeń łączy się o 19:00 i rozłącza o 19:20; po naprawieniu problemu z komputerem lub połączeniem wraca o 19:40 i zostaje jeszcze 20 minut. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; Jego Obecność w Klasie to średnia z tego dla lekcji z ostatnich 30 dni</strong> &mdash; liczona <strong>osobno dla grupy i dla kursu</strong>, więc uczeń, który jest z tobą na dwóch kursach, jest mierzony osobno na każdym. Okno jest przesuwne, a liczby odświeżają się <strong>w każdy poniedziałek</strong>.</p>`,
exclude_intro: `<p>Co jest pomijane i dlaczego:</p>`,
presence_note: `<p><strong>👀 Warto wiedzieć:</strong> Obecność w Klasie mierzy <strong>czas w sali</strong> — nic więcej. Nie chodzi o twoją kamerę, twój czat, ani o to, kto mówi najwięcej. Te sygnały należą do innej metryki, która pojawi się później w tym kwartale, i wyjaśnimy ją równie otwarcie.</p>`,

presence_reliability: `<p><strong>🔧 Jeśli jakaś liczba wygląda źle, powiedz nam.</strong> Napisz na kanale <strong>#lms-feedback-tts</strong>, dołącz zrzut ekranu i krótki opis problemu, i oznacz swojego mentora regionalnego.</p>`,
s4_risk_h: "🚦 Twoje dwa sygnały",
risk_p1: `<p>Każdy uczeń ma <strong>dwie kategorie</strong> &mdash; jedną z Obecności w Klasie, drugą z obecności w Back Office. Twoje listy pokazują <strong>gorszą z dwóch</strong>, żeby nikt nie umknął, gdy oba się nie zgadzają.</p>`,
alert_warning: `<p><strong>⚠️ Jedno słowo, dwa znaczenia &mdash; czytaj etykietę razem z jej sygnałem.</strong> <strong>ALERT</strong> po stronie Obecności w Klasie oznacza obecność poniżej 50%. <strong>Alert</strong> po stronie Back Office oznacza 2&ndash;3 wyjaśnione nieobecności. To różne sygnały o różnej wadze &mdash; więc zawsze nazywaj sygnał: <em>ALERT (obecność)</em>, <em>Alert (nieobecności)</em>. To samo polecamy w rozmowie o uczniu z mentorem. Nazwy grup pojawiają się w LMS po angielsku i dlatego również tutaj zostawiamy je po angielsku.</p>`,
risk_p2: `<p>Czytaj je jako <strong>alternatywy, nie warunki</strong>: ucznia przypisują <em>albo</em> nieobecności, <em>albo</em> obecność &mdash; cokolwiek jest gorsze. Uczeń bez żadnych nieobecności może trafić do 🟠 RISK samą obecnością, jeśli jest w sali tylko przez 60% lekcji, a uczeń z idealną obecnością może trafić do 🔴 Critical z powodu jednej niewyjaśnionej nieobecności.</p>`,
risk_p3: `<p>Dla każdego oznaczonego ucznia widzisz też <strong>powód</strong> każdej żółtej nieobecności &mdash; jeden z dwunastu wymienionych wyżej &mdash; więc nie musisz zgadywać.</p>`,
s4_hpr_h: "📈 HPR i LPR — dwie liczby na twojej karcie",
hpr_intro: `<p>Są mierzone na podstawie <strong>Obecności w Klasie</strong>:</p>`,
bar_p: `<p>Poprzeczka, którą utrzymujemy we wszystkich regionach: <strong>LPR na poziomie lub poniżej 25,5%</strong> · <strong>HPR na poziomie lub powyżej 49,5%</strong>.</p>`,
target_aside: `<p><strong>📌 To globalne cele na kwartał startu.</strong> Cele regionalne są ustalane z każdym Head of Teaching, a twoja karta w LMS zawsze pokazuje ten, który cię dotyczy — więc ufaj karcie bardziej niż jakiejkolwiek liczbie zapisanej gdzie indziej.</p>`,
goal_aside: `<p><strong>🎯 W przypadku Obecności w Klasie cel jest liczbowy:</strong> podnieść HPR, obniżyć LPR.</p>
<p><strong>W przypadku Frekwencji Back Office cel to dwa rezultaty — bez wskaźnika:</strong></p>
<ul>
<li>🔴 <strong>Wyeliminować nieusprawiedliwione nieobecności.</strong> Czerwona nieobecność oznacza, że uczeń zniknął i nikt tego nie sprawdził. To powinno przestać być możliwe.</li>
<li>🟡 <strong>Wyeliminować odpływ, który zaczyna się od drugiej usprawiedliwionej nieobecności.</strong> Dwie żółte to moment, w którym uczeń zaczyna się oddalać i wciąż można go odzyskać. Później szanse spadają szybko.</li>
</ul>
<p><strong>Żaden uczeń nie powinien cicho zniknąć, i żaden nie powinien zostać stracony przez dwie nieobecności, na które nikt nie odpowiedział.</strong></p>`,

s4_payoff_h: "🧭 A oto praktyczna korzyść",
payoff_p1: `<p>Obie miary wskazują na różne problemy, z różnymi rozwiązaniami. Dlatego je rozdzieliliśmy:</p>`,
payoff_p2: `<p>Ten sam pojedynczy procent, który miałeś wcześniej, kryje w sobie dwa zupełnie różne plany działania.</p>`,

maria_h: "🧑‍🏫 Przypadek 1 · Maria — problem z Obecnością w Klasie",
maria_p1: `<p>Maria uczy <strong>3 grupy</strong>, łącznie <strong>21 uczniów</strong>. Oto jej ostatnie 30 dni.</p>`,
maria_p2: `<p>Więc jej dwie liczby to:</p>`,
maria_aside: `<p><strong>💡 Maria jest oznaczona przez HPR, nie LPR — i to najczęstszy przypadek.</strong></p>
<p>Nikt nie zniknął. Wszyscy jej uczniowie <em>przychodzą</em>. Ale dziewięcioro z nich wychodzi w połowie, więc zbyt mało jej uczniów jest naprawdę obecnych przez całą lekcję. Przy starej pojedynczej liczbie było to niewidoczne: tych dziewięcioro uczniów liczyło się jako "obecni".</p>`,

monday_h: "📅 Poniedziałek rano — co się naprawdę dzieje",
monday_step1: `<p><strong>1 · Przychodzi wiadomość DM na Slacku.</strong> Od Tutor Development, w języku Marii. Wygląda tak:</p>`,
monday_after_quote: `<p>Maria nie musi się logować, by się dowiedzieć. <strong>Platforma sama do niej przychodzi.</strong></p>`,
monday_step2: `<p><strong>2 · Otwiera LMS, by zobaczyć szczegóły.</strong> Na tutors.kodland.org znajduje swoje dwie miary, swój HPR i LPR w odniesieniu do celów, i tę samą listę obserwowanych — ale z grupą każdego ucznia, jego procentem obecności i linkiem prosto do profilu w Back Office. Tam właśnie idzie, gdy chce się dowiedzieć, <em>w której grupie</em> tkwi problem.</p>`,
monday_step3: `<p><strong>3 · Zauważa coś, czego wiadomość na Slacku nie może jej powiedzieć.</strong> Siedmioro z dziewięciorga jej uczniów, którzy wychodzą wcześnie, jest w tej samej grupie — jej sobotnia grupa o 18:00. To nie problem z nauczaniem we wszystkich grupach — to jedna sala, w jednym czasie, z jedną dynamiką. Teraz wie, gdzie skierować uwagę.</p>`,
monday_step4: `<p><strong>4 · Przechodzi szkolenie.</strong> Jest w LMS, przypisane do niej, krótkie. Kończy je razem z DST w ciągu czterech dni i dostaje wiadomość na Slacku potwierdzającą, że zdała.</p>`,
monday_step5: `<p><strong>5 · Zmienia dwie rzeczy na kolejnych lekcjach.</strong> Ze szkolenia i cotygodniowych wskazówek: zaczyna otwierać lekcję pytaniem, na które każdy uczeń musi odpowiedzieć po imieniu, i przestaje pozwalać, by ostatnie pięć minut przepadało — podsumowanie i zdanie "co czeka nas na następnej lekcji" to to, co trzyma uczniów w sali do końca.</p>`,
monday_step6: `<p><strong>6 · Dwa tygodnie później jej HPR wynosi 51%.</strong> Dostaje wiadomość na Slacku informującą, że nie jest już oznaczona. Nikt w żadnym momencie nie musiał z nią przeprowadzać trudnej rozmowy.</p>`,
maria_ifnot: `<p><strong>🤝 A gdyby się nie poprawiło?</strong> Po szkoleniu, jeśli wskaźnik nadal jest poniżej celu, Maria zostaje poproszona o zarezerwowanie sesji <strong>1:1 ze swoim mentorem regionalnym</strong> — dwa kliknięcia, wybierz termin. Ta rozmowa dotyczy jej prawdziwych grup, najprawdopodobniej tej sobotniej grupy o 18:00. Nadal nikt nie decyduje o niej na podstawie liczby.</p>`,

cases_h: "🧭 Dwa przypadki, jeden proces",
cases_intro: `<p>Wiadomość dociera do ciebie, gdy zdarzy się jedna z trzech rzeczy. Twoja <strong>Obecność w Klasie</strong> jest poza celem — HPR poniżej albo LPR powyżej. Twoje <strong>nieobecności w Back Office</strong> wyglądają problematycznie — dwóch lub więcej uczniów z dwiema lub więcej nieobecnościami, których nikt nie wyjaśnił, albo, gdy masz już 10 lub więcej uczniów, więcej niż połowa twojej listy z jedną. Albo uruchamia się <strong>przypadek pilny</strong>: jeden uczeń z trzema lub więcej niewyjaśnionymi nieobecnościami, albo dwóch uczniów z czterema lub więcej wyjaśnionymi — niezależnie od tego, co mówią twoje wskaźniki.</p><p>Maria ma pierwszy problem, Marco drugi. To, co dzieje się dalej, jest takie samo w każdym przypadku:</p>`,
cases_list: ["<strong>Wiadomość</strong> — z praktycznymi wskazówkami <em>i</em> obowiązującymi regulacjami w załączniku, żeby nie trzeba było szukać przepisu.","<strong>Krótkie szkolenie w LMS</strong> — przypisane do ciebie, plus DST, cztery dni na ukończenie.","<strong>Sesja 1:1 z twoim mentorem regionalnym</strong> — jeśli po tym liczba nadal się nie ruszyła."],
cases_aside: `<p><strong>🤝 Nic tutaj nie jest decydowane przez liczbę.</strong> Platforma decyduje, gdzie patrzymy najpierw — potem rozmawia z tobą człowiek. Jeśli coś w danych wygląda źle, powiedzenie tego jest przydatne, a nie niezręczne.</p>`,
marco_flag: `<p>To właśnie uruchamia jego wiadomość. Frekwencja w Back Office nie uruchamia oznaczenia na podstawie średniej — decyduje o nim stan zapisów: <strong>dwóch lub więcej uczniów z dwiema lub więcej nieobecnościami, których nikt nie wyjaśnił</strong>, albo, gdy masz już 10 lub więcej uczniów, <strong>więcej niż połowa twojej listy z jedną</strong>. Dwóch uczniów Marca, każdy z dwiema niewyjaśnionymi nieobecnościami, to dokładnie ten przypadek. Nieobecność z powodem to sytuacja pod kontrolą. Czerwona to uczeń, który może już odszedł.</p>`,
marco_week_h: "📅 Jego poniedziałkowy poranek — co się naprawdę dzieje",
marco_s0: `<p><strong>1 · Ta sama wiadomość na Slacku — z załączonymi przepisami.</strong> Marco nie musi niczego szukać ani pamiętać. Wygląda tak:</p>`,
marco_quote: [
 "Cześć Marco 👋",
 "Piszemy z działu Tutor Development w sprawie zapisów frekwencji w twoich grupach. <strong>Dwoje twoich uczniów ma po dwie nieobecności oznaczone jako 🔴 czerwone</strong> — zapisane bez podanego powodu.",
 "Uczniowie do kontaktu:<br>🔴 Lukas Meyer — 2 lekcje, brak zapisanego powodu<br>🔴 Ana Silva — 2 lekcje, brak zapisanego powodu",
 "Przypisaliśmy krótkie szkolenie, które pomoże: <em>Postępowanie z Nieobecnościami</em> — [link]. Ukończ je razem z DST w ciągu najbliższych 4 dni.",
 "Przepisy dotyczące czerwonych i żółtych nieobecności są załączone do tej wiadomości — co robić, w jakiej kolejności i co zapisać.",
 "Twój mentor regionalny jest zawsze dostępny, by pomóc.",
],
marco_s1: `<p><strong>2 · Otwiera LMS, żeby zobaczyć kogo i gdzie.</strong> Ta sama lista obserwowanych, którą widzi Maria, ale jego pokazuje dwóch uczniów, ich grupy i link wprost do profilu każdego w Back Office.</p>`,
marco_s2: `<p><strong>3 · Tego samego dnia pisze do obu rodzin.</strong> Nagranie, krótkie podsumowanie tego, co zostało pominięte, i jedno pytanie: co się stało? Nieobecność, na którą nikt nie zareagował, znacznie częściej zamienia się w drugą.</p>`,
marco_s3: `<p><strong>4 · Zapisuje to, co mu powiedziano.</strong> 🔴 czerwony staje się 🟡 żółty z dołączonym powodem — w jednym przypadku tydzień egzaminów, w drugim zepsuty laptop. Czerwona nieobecność nigdy nie powinna zostać niewyjaśniona dłużej niż 48 godzin.</p>`,
marco_s4: `<p><strong>5 · Pyta, zanim cokolwiek obieca.</strong> Jeden z dwóch uczniów ma zaległości, więc Marco zgłasza to swojemu TL — dodatkowa lub motywacyjna lekcja to ich decyzja, nigdy coś, co proponuje się rodzinie bezpośrednio. "Sprawdzę to" jest w tym czasie pełną odpowiedzią.</p>`,
marco_s5: `<p><strong>6 · W kolejnym tygodniu jego zapisy są czyste</strong>, a wiadomość na Slacku informuje go, że nie jest już oznaczony. Tak jak u Marii, nikt w żadnym momencie nie odbył z nim trudnej rozmowy.</p>`,
marco_ifnot: `<p><strong>🤝 A gdyby nieobecności się powtarzały?</strong> Dokładnie tak jak u Marii: jeśli obraz nie poprawił się po szkoleniu, Marco zostaje poproszony o zarezerwowanie <strong>sesji 1:1 ze swoim mentorem regionalnym</strong> — dwa kliknięcia, wybierz termin. Ten sam proces, inny temat: u niej chodzi o prowadzenie lekcji, u niego o to, co dzieje się między lekcjami.</p>`,
marco_h: "🔄 Przypadek 2 · Marco — problem z Frekwencją w Back Office",
marco_p1: `<p>Marco też uczy 3 grupy. Uczniowie, którzy przychodzą, są w pełni obecni — jego HPR to 61%, spokojnie powyżej celu, więc nic w jego Obecności w Klasie nie jest oznaczone. Jego problem to druga miara: <strong>dwoje jego uczniów nie przyszło na ostatnie dwie lekcje i nigdy go nie poinformowało.</strong> Oba przypadki są w rejestrze jako 🔴 czerwone — nikt nie wie dlaczego.</p>`,
marco_aside: `<p><strong>🎯 Ta sama metryka, dwa przeciwstawne problemy.</strong> Praca Marii jest <em>wewnątrz</em> lekcji. Praca Marco jest <em>poza</em> nią. Dokładnie dlatego podzieliliśmy frekwencję na dwie miary — żeby pomoc, którą otrzymujesz, pasowała do problemu, który naprawdę masz.</p>`,

s5_h: "📅 5 · Jak wygląda normalny tydzień",
s5_p1: `<p>Wiesz już, czym jest platforma i co oznaczają liczby. Oto cały przebieg w jednym miejscu.</p>`,
s5_flow_h: "🧭 Przebieg, w skrócie",
s5_when_h: "❓ Kiedy dokładnie dostanę oznaczenie i dlaczego?",
s5_when_p: `<p>Trzy sytuacje, i nic więcej:</p>`,
s5_when_aside: `<p><strong>🙋 A co muszę zrobić?</strong> Trzy rzeczy, zawsze.</p>
<ol class="list">
<li>Przeczytaj wiadomość. Wymienia metrykę, uczniów i termin.</li>
<li>Ukończ szkolenie i DST w ciągu 4 dni. Są krótkie z założenia.</li>
<li>Daj tym uczniom sposób na zaangażowanie się na kolejnych lekcjach. Szkolenie i wskazówki mówią jak — to jest ta część, która naprawdę zmienia liczbę.</li>
</ol>`,

s5_arrive_h: "📨 A oto, jak to do ciebie dociera",
s5_three_aside: `<p><strong>🙌 Trzy rzeczy, o które prosimy</strong></p>
<ol class="list">
<li>Przeczytaj wiadomość, gdy przyjdzie.</li>
<li>Zadziałaj na nią — jeśli przypisano szkolenie, ukończ je z DST w ciągu 4 dni.</li>
<li>Pytaj, jeśli coś jest niejasne. Dokładnie po to jest twój mentor regionalny.</li>
</ol>`,

s5_msg_h: "📲 Właśnie przyszła wiadomość. Co robię?",
s5_msg_p: `<p>Wszystko dociera do ciebie jako <strong>wiadomość DM na Slacku od Tutor Development</strong>. Istnieje tylko pięć rodzajów, i żaden nie wymaga długiej odpowiedzi.</p>`,
s5_msg_aside: `<p><strong>🤖 Te wiadomości DM są wysyłane automatycznie</strong>, więc odpowiedź na wiadomość nie dociera do żadnej osoby. Jeśli chcesz coś powiedzieć, napisz bezpośrednio do swojego <strong>mentora regionalnego</strong> — albo napisz na kanale poniżej, co zwykle jest szybsze.</p>`,

s5_feedback_h: "🛠 Coś wygląda źle? Jest jedno miejsce, by to zgłosić",
feedback_aside: `<p><strong>📣 Napisz na #lms-feedback-tts.</strong></p>
<p>Nie DM do kogoś, kogo znasz, i nie zakopane w kanale tutorów. Jeden kanał oznacza, że widzimy każde zgłoszenie, naprawiamy rzeczy raz zamiast dziewięć razy, i możesz zobaczyć, że ktoś to zauważył.</p>
<p>Warto zgłaszać:</p>
<ul>
<li>🔢 Liczbę, która wygląda źle — ucznia oznaczonego jako nieobecny, który wyraźnie był w sali, procent, który nie zgadza się z tym, co widzisz</li>
<li>🔗 Zepsuty link, albo szkolenie, które nie pasuje do problemu opisanego w wiadomości</li>
<li>🌐 Wiadomość w złym języku, albo taką, która wymienia ucznia, który nie jest twój</li>
<li>🔑 Dane logowania, których nie możesz znaleźć w Bitwarden, gdy wiadomości już się zaczęły</li>
<li>😵 Wszystko, co jest mylące, zepsute lub wolne — i wszystko, co chciałbyś, żeby robiło, a nie robi</li>
</ul>
<p><strong>To nie jest narzekanie i nie liczy się na twoją niekorzyść.</strong> Zwłaszcza w pierwszych tygodniach jesteście jedynymi osobami, które mogą zobaczyć, czy to naprawdę działa. Zgłoszenie, które oszczędza kolejnemu tutorowi tego samego zamieszania, jest dla nas warte znacznie więcej niż grzeczne milczenie.</p>`,

s5_mentor_h: "🌍 Twój mentor regionalny",
mentor_p: `<p>To osoba wymieniona w każdej wiadomości, którą od nas otrzymujesz — i człowiek, z którym naprawdę porozmawiasz. Nie musisz czekać na oznaczenie, żeby się z nim skontaktować.</p>`,

s6_h: "🙅 6 · Czym to nie jest",
s6_p1: `<p>Zanim zalogujesz się po raz pierwszy, bądźmy szczerzy w sprawie tego, co ludzi martwi.</p>`,
s6_aside: `<p><strong>⚖️</strong> A gdy dane są rzeczywiście błędne — uczeń oznaczony jako nieobecny, który wyraźnie był w sali, awaria platformy — <strong>powiedz nam na #lms-feedback-tts</strong>. Takie przypadki są widoczne również dla nas, a ich zgłoszenie chroni zarówno ciebie, jak i ucznia.</p>`,

s7_h: "🔮 7 · Co dalej",
s7_p1: `<p>Frekwencja to pierwsza metryka, nie ostatnia.</p>`,
s7_aside: `<p><strong>🛠 To wersja pierwsza</strong>, i zamierzamy dalej ją budować razem z tobą. Jeśli coś jest niejasne, czegoś brakuje lub coś jest błędne, powiedz o tym — takie informacje zwrotne piszą kolejną wersję.</p>`,

s8_h: "🔐 8 · Uzyskiwanie dostępu",
s8_aside: `<p><strong>🔑 Twoje dane logowania trafiają do Bitwarden</strong> — i będą tam w ciągu kilku dni.</p>
<p>LMS zawiera <strong>dane osobowe</strong> o tobie i twoich uczniach, więc dostęp jest imienny i indywidualny: bez wspólnego logowania, bez konta demonstracyjnego, bez wyjątków.</p>
<p><strong>Jak się zalogujesz:</strong> dodajemy twoje dane logowania do LMS do <strong>Bitwarden</strong>, tego samego miejsca, gdzie trzymasz już inne dane logowania do pracy. Nie ma nic do zgłaszania i nikogo do poganiania — po prostu się tam pojawią.</p>
<p><strong>Termin jest celowo dopasowany.</strong> Dane logowania trafiają do Bitwarden w ciągu najbliższych kilku dni, i to jest też moment, w którym włączamy automatyczne wiadomości. Więc zanim dotrze do ciebie pierwsza wiadomość na Slacku, będziesz mógł otworzyć <strong>tutors.kodland.org</strong> i zobaczyć szczegóły, które za nią stoją.</p>
<p>Jeśli wiadomości już się zaczęły, a ty nadal nie możesz znaleźć danych logowania do LMS w swoim Bitwarden — napisz na <strong>#lms-feedback-tts</strong>, a rozwiążemy to jeszcze tego samego dnia.</p>`,

s9_h: "❓ 9 · FAQ",
faq1_q: `<p><strong><em>"Mam dużo grup. Czy mam robić to wszystko wszędzie?"</em></strong></p>`,
faq1_a: `<p>Nie. Zbuduj <strong>jedną</strong> rutynę otwarcia i jedną zamknięcia, które działają w każdej grupie, i używaj ich identycznie. Jeśli sam nakład pracy jest problemem, powiedz o tym — to rozmowa o harmonogramie z Teaching Ops, nie coś do rozwiązania dodatkowym wysiłkiem.</p>`,
faq2_q: `<p><strong><em>"Moi uczniowie po prostu nie włączają kamer. Czy to wpływa na mój wynik?"</em></strong></p>`,
faq2_a: `<p>Nie — Obecność w Klasie dotyczy <strong>czasu w sali</strong>, nie kamer. Kamery, czat i uczestnictwo należą do innej metryki, która pojawi się później w tym kwartale, i nawet tam kamera to tylko jeden z kilku sygnałów.</p>`,
faq3_q: `<p><strong><em>"Uczeń ma problemy z połączeniem i ciągle się rozłącza. Czy to liczy się na moją niekorzyść?"</em></strong></p>`,
faq3_a: `<p>Powtarzające się ponowne połączenia i awarie platformy są widoczne w danych i nie są traktowane jako twoja wina. Zgłoś je mimo to — to chroni ciebie i pomaga uczniowi.</p>`,
faq4_q: `<p><strong><em>"Jedna z moich grup jest dużo trudniejsza od pozostałych."</em></strong></p>`,
faq4_a: `<p>Twoje liczby są obliczane na grupę i na kurs, więc trudna grupa nie chowa się za średnią — i też nie ciągnie wszystkiego innego w dół. Użytecznym pytaniem jest zwykle <em>dlaczego jedna konkretna sala zachowuje się inaczej niż pozostałe</em>, i to dobra rzecz, by przynieść na sesję coachingową.</p>`,
faq5_q: `<p><strong><em>"Jaka jest jedna najszybsza rzecz, którą mogę zmienić?"</em></strong></p>`,
faq5_body: `<p>Dwie rzeczy, i nie wymagają żadnych przygotowań:</p>
<ul>
<li>Bądź w sali przed swoimi uczniami — nawet minutę wcześniej.</li>
<li>Otwórz pytaniem, na które każdy uczeń musi odpowiedzieć po imieniu, bez złej odpowiedzi. "Jedno słowo: co udało ci się zbudować w zeszłym tygodniu?" Obejdź całą salę, zanim udostępnisz ekran.</li>
</ul>
<p>Te dwie rzeczy zmieniają więcej niż cokolwiek innego na tej stronie.</p>`,
faq6_q: `<p><strong><em>"Uczeń opuścił dwie lekcje z rzędu. Co robię?"</em></strong></p>`,
faq6_a: `<p><strong>Powiedz komuś — nie czekaj na trzecią.</strong> To moment, w którym oddalający się uczeń wciąż może zostać odzyskany, a zwykle tylko ty widzisz to wystarczająco wcześnie.</p>`,
faq7_q: `<p><strong><em>"Kogo pytam, jeśli coś jest niejasne?"</em></strong></p>`,
faq7_a: `<p>Twojego mentora regionalnego.</p>`,
faq_aside: `<p><strong>💬 Coś, na co ta strona nie odpowiedziała?</strong> Zapytaj na kanale tutorów albo napisz do swojego mentora regionalnego. Jeśli pytanie pojawia się więcej niż dwa razy, powinno się znaleźć na tej stronie — więc pytanie pomaga wszystkim.</p>`,

closing_aside: `<p><strong>🎓 W jednym zdaniu</strong></p><p>LMS istnieje po to, by gdy coś zacznie się psuć w jednej z twoich grup, <strong>dowiedzieć się o tym w drugim tygodniu zamiast w trzecim miesiącu — i otrzymać pomoc, gdy wciąż da się to naprawić.</strong></p>`,
