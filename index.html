<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Kodland LMS — Your Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Kodland palette */
    --ink:#141310;
    --ink-2:#2A2723;
    --muted:#6E6B63;
    --muted-2:#9C9890;
    --paper:#FAFBF6;
    --cream:#E6E9DC;
    --cream-2:#F2F3EC;
    --lime:#D7FF6B;
    --lime-2:#C8E063;
    --magenta:#B02A66;
    --pink:#EF5DA8;
    --pink-pale:#FDEDF5;
    --green:#3F8F53;
    --line:#E6E9DC;

    --sans: 'Inter', 'Noto Sans Arabic', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --maxw: 820px;
    --nav-w: 292px;
    --bar-h: 62px;
    --r: 14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink-2);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .skip{
    position:absolute; inset-inline-start:-9999px; top:0; z-index:200;
    background:var(--lime); color:var(--ink); padding:10px 16px;
    font-weight:800; border-radius:0 0 8px 0;
  }
  .skip:focus{ inset-inline-start:0; }

  /* ===================== TOP BAR ===================== */
  .topbar{
    position:sticky; top:0; z-index:60;
    background:var(--ink);
    color:#fff;
  }
  .topbar-inner{
    display:flex; align-items:center; gap:14px;
    padding:0 22px;
    height:var(--bar-h);
  }
  .nav-toggle{
    display:none;
    appearance:none; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18); color:#fff;
    width:38px; height:38px; border-radius:10px;
    font-size:17px; cursor:pointer; flex:none; line-height:1;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:16px;
    letter-spacing:-.2px; flex:none; color:#fff;
  }
  .brand-mark{
    width:29px;height:29px;border-radius:9px;
    background:var(--lime);
    display:flex;align-items:center;justify-content:center;
    font-size:14px; color:var(--ink); font-weight:900; flex:none;
  }
  .topbar-tools{
    margin-inline-start:auto;
    display:flex; align-items:center; gap:10px; min-width:0;
  }

  .search-wrap{ position:relative; }
  .search-input{
    appearance:none;
    width:236px; max-width:38vw;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    border-radius:999px;
    padding:8px 14px 8px 34px;
    font-family:var(--sans); font-size:13px; font-weight:500;
    transition:background .15s, border-color .15s;
  }
  body[dir="rtl"] .search-input{ padding:8px 34px 8px 14px; }
  .search-input::placeholder{ color:#9C9890; }
  .search-input:focus{
    outline:none; background:rgba(255,255,255,.13); border-color:var(--lime);
  }
  .search-icon{
    position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%);
    font-size:12px; color:var(--muted-2); pointer-events:none;
  }
  .results{
    position:absolute; top:calc(100% + 8px); inset-inline-end:0;
    width:min(460px, 86vw);
    background:#fff; color:var(--ink-2);
    border:1px solid var(--cream); border-radius:var(--r);
    box-shadow:0 16px 44px rgba(20,19,16,.18);
    max-height:min(62vh, 470px); overflow:auto;
    padding:7px; z-index:80;
  }
  .results[hidden]{ display:none; }
  .res-item{
    display:block; width:100%; text-align:start;
    background:none; border:0; border-radius:9px;
    padding:9px 11px; cursor:pointer;
    font-family:var(--sans); font-size:13px; line-height:1.45;
    color:var(--ink-2);
  }
  .res-item:hover, .res-item:focus{ background:var(--cream-2); outline:none; }
  .res-crumb{
    display:block; font-size:10.5px; font-weight:800; color:var(--magenta);
    text-transform:uppercase; letter-spacing:.6px; margin-bottom:3px;
  }
  .res-snip{ color:var(--muted); }
  .res-snip mark{ background:var(--lime); color:var(--ink); padding:0 2px; border-radius:3px; }
  .res-empty{ padding:14px 12px; font-size:13px; color:var(--muted); }

  .lang-select{
    appearance:none;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#fff; border-radius:999px;
    padding:8px 30px 8px 14px;
    font-family:var(--sans); font-size:13px; font-weight:700;
    cursor:pointer; flex:none;
    background-image:linear-gradient(45deg,transparent 50%,#9C9890 50%),linear-gradient(135deg,#9C9890 50%,transparent 50%);
    background-position:calc(100% - 15px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
    background-size:4px 4px, 4px 4px;
    background-repeat:no-repeat;
  }
  body[dir="rtl"] .lang-select{ padding:8px 14px 8px 30px; background-position:15px calc(50% - 2px), 19px calc(50% - 2px); }
  .lang-select:focus{ outline:none; border-color:var(--lime); }
  .lang-select option{ color:var(--ink-2); background:#fff; }

  .progress-track{ height:3px; background:rgba(255,255,255,.14); }
  .progress-fill{ height:100%; width:0%; background:var(--lime); transition:width .3s ease; }

  /* ===================== SHELL ===================== */
  .shell{
    display:grid;
    grid-template-columns:var(--nav-w) minmax(0,1fr);
    align-items:start;
  }

  .sidenav{
    position:sticky; top:calc(var(--bar-h) + 3px);
    height:calc(100vh - var(--bar-h) - 3px);
    overflow-y:auto;
    border-inline-end:1px solid var(--cream);
    background:var(--cream-2);
    padding:24px 14px 40px;
  }
  .nav-head{
    font-size:10.5px; font-weight:800; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--magenta);
    padding:0 10px 12px;
  }
  .nav-item{
    display:flex; align-items:flex-start; gap:9px;
    width:100%; text-align:start;
    background:none; border:0; border-radius:10px;
    padding:9px 11px; margin-bottom:2px;
    font-family:var(--sans); font-size:13.5px; font-weight:600; line-height:1.4;
    color:var(--ink-2); cursor:pointer;
    transition:background .12s, color .12s;
  }
  .nav-item:hover{ background:var(--cream); }
  .nav-item.active{ background:var(--ink); color:#fff; font-weight:700; }
  .nav-item.active .nav-tick{ color:var(--lime); }
  .nav-tick{
    flex:none; width:15px; font-size:11px; color:var(--green);
    padding-top:3px; text-align:center; font-weight:800;
  }
  .nav-sub{ padding:3px 0 9px; }
  .nav-sub-item{
    display:block; width:100%; text-align:start;
    background:none; border:0; border-radius:8px;
    padding:6px 10px 6px 35px;
    font-family:var(--sans); font-size:12.5px; font-weight:500; line-height:1.4;
    color:var(--muted); cursor:pointer;
  }
  body[dir="rtl"] .nav-sub-item{ padding:6px 35px 6px 10px; }
  .nav-sub-item:hover{ background:var(--cream); color:var(--ink); }
  .nav-sub-item.l3{ font-size:12px; padding-inline-start:48px; }

  main{
    max-width:calc(var(--maxw) + 48px);
    margin:0 auto;
    padding:42px 24px 96px;
    width:100%;
  }

  /* ===================== SECTIONS ===================== */
  .sec{ display:none; }
  .sec.is-active{ display:block; animation:fade .22s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .sec-kicker{
    font-size:11px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--magenta);
    margin-bottom:10px;
  }
  .doc-title{
    font-weight:900; font-size:44px; line-height:1.05;
    letter-spacing:-1.4px;
    margin:0 0 24px; color:var(--ink);
  }
  .sec-title{
    font-weight:800; font-size:32px; line-height:1.12;
    letter-spacing:-.9px;
    margin:0 0 22px; color:var(--ink);
    padding-bottom:0; border:0;
  }
  .sec-intro{ margin-top:4px; }
  .sec-tools{
    display:flex; justify-content:flex-end; gap:8px;
    margin:30px 0 12px;
  }
  .tool-btn{
    appearance:none; background:#fff; border:1px solid var(--cream);
    color:var(--ink); border-radius:999px;
    padding:6px 15px; font-family:var(--sans); font-size:11.5px; font-weight:800;
    letter-spacing:.2px; cursor:pointer;
    transition:background .13s, border-color .13s;
  }
  .tool-btn:hover{ background:var(--lime); border-color:var(--lime); }

  /* Collapsible subsections */
  details.sub{
    background:#fff;
    border:1px solid var(--cream);
    border-radius:var(--r);
    margin:10px 0;
    overflow:hidden;
  }
  details.sub[open]{ box-shadow:0 2px 12px rgba(20,19,16,.05); }
  details.sub > summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    padding:15px 19px;
    font-weight:800; font-size:17px; letter-spacing:-.3px;
    color:var(--ink);
    transition:background .12s;
  }
  details.sub > summary::-webkit-details-marker{ display:none; }
  details.sub > summary:hover{ background:var(--paper); }
  details.sub > summary:focus-visible{ outline:2px solid var(--pink); outline-offset:-2px; }
  .chev{
    flex:none; width:22px; height:22px; border-radius:7px;
    background:var(--lime); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900;
    transition:transform .18s ease;
  }
  body[dir="rtl"] .chev{ transform:scaleX(-1); }
  details.sub[open] > summary .chev{ transform:rotate(90deg); }
  body[dir="rtl"] details.sub[open] > summary .chev{ transform:rotate(90deg) scaleX(-1); }
  .sub-body{ padding:2px 21px 22px; }
  .sub-body > *:first-child{ margin-top:0; }

  details.sub.l3{
    border-radius:12px; margin:14px 0;
    background:var(--paper); border-color:var(--cream);
  }
  details.sub.l3 > summary{
    font-size:14.5px; font-weight:800; letter-spacing:-.1px;
    padding:12px 16px; color:var(--ink);
  }
  details.sub.l3 .chev{ width:20px; height:20px; border-radius:6px; background:var(--pink-pale); color:var(--magenta); }
  details.sub.l3 .sub-body{ padding:0 17px 17px; }

  details.sub.faq > summary{
    font-size:14.5px; font-weight:700; letter-spacing:0;
    padding:14px 17px; color:var(--ink); line-height:1.45;
    align-items:flex-start;
  }
  details.sub.faq .chev{ margin-top:1px; }
  details.sub.faq .sub-body{ padding:0 18px 17px 51px; }
  body[dir="rtl"] details.sub.faq .sub-body{ padding:0 51px 17px 18px; }

  .sec-outro{ margin-top:28px; }

  /* Opening overview grid */
  .sec-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(212px,1fr));
    gap:10px; margin:30px 0 4px;
  }
  .grid-card{
    position:relative; text-align:start;
    background:#fff; border:1px solid var(--cream); border-radius:12px;
    padding:15px 16px 17px; cursor:pointer;
    font-family:var(--sans); color:var(--ink);
    transition:border-color .14s, box-shadow .14s, transform .14s;
  }
  .grid-card:hover{
    border-color:var(--ink); box-shadow:0 5px 16px rgba(20,19,16,.08);
    transform:translateY(-1px);
  }
  .grid-lbl{ display:block; font-size:13.8px; font-weight:700; line-height:1.35; letter-spacing:-.1px; padding-inline-end:20px; }
  .grid-arrow{
    position:absolute; inset-inline-end:14px; bottom:13px;
    font-size:13px; color:var(--magenta); font-weight:800;
    opacity:0; transition:opacity .14s;
  }
  body[dir="rtl"] .grid-arrow{ transform:scaleX(-1); }
  .grid-card:hover .grid-arrow{ opacity:1; }

  /* ===================== CONTENT TYPOGRAPHY ===================== */
  p{ margin:0 0 15px; color:var(--ink-2); }
  strong{ color:var(--ink); font-weight:700; }
  em{ color:inherit; }
  .h3{
    font-weight:800; font-size:15px; letter-spacing:-.1px;
    color:var(--ink); margin:26px 0 9px;
  }

  /* Aside — cream card with the Kodland lime bar */
  .aside{
    background:var(--cream-2);
    border-inline-start:4px solid var(--lime);
    border-radius:10px; padding:16px 18px; margin:18px 0;
  }
  .aside p{ margin:0 0 9px; }
  .aside p:last-child{ margin-bottom:0; }
  .aside ul{ margin:7px 0 0; padding-inline-start:20px; }

  /* Time-sensitive notice — the signature lime block */
  .aside.hot{
    background:var(--lime);
    border:0; border-radius:var(--r);
    padding:18px 21px; color:var(--ink);
  }
  .aside.hot p{ color:var(--ink); }
  .aside.hot strong{ color:var(--ink); }

  /* Quote — a message mock, in the pink family */
  .quote{
    background:var(--pink-pale);
    border:1px solid var(--pink);
    border-radius:var(--r); padding:17px 20px; margin:18px 0;
    color:var(--ink-2); font-style:normal;
  }
  .quote p{ margin:0 0 10px; }
  .quote p:last-child{ margin-bottom:0; }

  ul.list{ margin:9px 0 17px; padding-inline-start:22px; }
  ul.list li{ margin-bottom:7px; }
  ol.list{ margin:9px 0 17px; padding-inline-start:22px; }
  ol.list li{ margin-bottom:8px; }
  ul.list li::marker, ol.list li::marker{ color:var(--magenta); font-weight:700; }

  /* Missing screenshot — the deck's dashed "to fill in" box */
  .img-placeholder{
    background:var(--pink-pale); border:1.5px dashed var(--pink);
    border-radius:12px; padding:16px 18px; margin:18px 0;
  }
  .img-cap{
    font-weight:800; margin-bottom:5px; color:var(--magenta);
    font-size:11.5px; letter-spacing:.8px; text-transform:uppercase;
  }
  .img-box{ font-size:13px; font-style:italic; color:var(--muted); }

  .img-figure{ margin:18px 0; padding:0; }
  .img-figure img{
    width:100%; height:auto; display:block;
    border-radius:12px; border:1px solid var(--cream);
    cursor:zoom-in;
  }
  .img-figure figcaption{
    font-size:11.5px; font-weight:800; color:var(--magenta);
    letter-spacing:.6px; text-transform:uppercase; margin-top:9px;
  }

  .table-scroll{
    overflow-x:auto; margin:18px 0;
    border:1px solid var(--cream); border-radius:12px;
    background:#fff;
  }
  table{ width:100%; border-collapse:collapse; font-size:14px; min-width:460px; }
  thead th{
    background:var(--ink); color:#fff; text-align:start;
    padding:11px 14px; font-weight:700; font-size:11.5px;
    letter-spacing:.7px; text-transform:uppercase;
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--cream); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr:nth-child(even){ background:var(--paper); }

  /* Flow — the signature lime block */
  .flow{
    background:var(--lime); border-radius:var(--r);
    padding:20px 22px; margin:18px 0; text-align:center;
    color:var(--ink);
  }
  .flow p{ margin:5px 0; color:var(--ink); font-weight:500; }
  .flow strong{ color:var(--ink); }
  .flow .arrow{ color:var(--magenta); font-weight:800; }

  mark.hit{ background:var(--lime); color:var(--ink); border-radius:3px; }

  /* ===================== PAGER / FOOTER ===================== */
  .pager{
    display:flex; gap:12px; margin-top:48px;
    padding-top:24px; border-top:1px solid var(--cream);
  }
  .pager-btn{
    flex:1 1 0; min-width:0;
    background:#fff; border:1px solid var(--cream); border-radius:12px;
    padding:14px 17px; cursor:pointer; text-align:start;
    font-family:var(--sans); color:var(--ink);
    transition:background .13s, border-color .13s;
  }
  .pager-btn:hover{ border-color:var(--ink); background:var(--lime); }
  .pager-btn[disabled]{ visibility:hidden; }
  .pager-dir{
    display:block; font-size:10.5px; font-weight:800; letter-spacing:1px;
    text-transform:uppercase; color:var(--magenta); margin-bottom:4px;
  }
  .pager-btn:hover .pager-dir{ color:var(--ink); }
  .pager-lbl{ display:block; font-size:13.5px; font-weight:700; line-height:1.35; }
  .pager-btn.next{ text-align:end; }

  footer{
    margin-top:36px; color:var(--muted-2); font-size:12px;
  }

  .scrim{
    display:none; position:fixed; inset:0; z-index:55;
    background:rgba(20,19,16,.45);
  }

  /* ===================== LIGHTBOX ===================== */
  .lightbox{
    position:fixed; inset:0; z-index:120;
    background:rgba(20,19,16,.92);
    display:flex; align-items:center; justify-content:center;
    padding:28px; cursor:zoom-out;
  }
  .lightbox[hidden]{ display:none; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:980px){
    .shell{ grid-template-columns:1fr; }
    .nav-toggle{ display:flex; align-items:center; justify-content:center; }
    .sidenav{
      position:fixed; z-index:58;
      inset-block:var(--bar-h) 0; inset-inline-start:0;
      width:min(320px, 86vw); height:auto;
      transform:translateX(-102%);
      transition:transform .22s ease;
      box-shadow:0 0 44px rgba(20,19,16,.22);
    }
    body[dir="rtl"] .sidenav{ transform:translateX(102%); }
    body.nav-open .sidenav{ transform:none; }
    body.nav-open .scrim{ display:block; }
    .search-input{ width:150px; }
  }
  @media (max-width:640px){
    .topbar-inner{ padding:0 13px; gap:8px; }
    .brand span:not(.brand-mark){ display:none; }
    .search-input{ width:118px; }
    main{ padding:28px 16px 72px; }
    .doc-title{ font-size:31px; letter-spacing:-1px; }
    .sec-title{ font-size:24px; letter-spacing:-.6px; }
    details.sub > summary{ font-size:15.5px; padding:13px 15px; }
    .sub-body{ padding:2px 16px 18px; }
    details.sub.faq .sub-body{ padding:0 16px 16px 46px; }
    .pager{ flex-direction:column; }
    table{ font-size:13px; }
    thead th, tbody td{ padding:9px 11px; }
  }

  @media print{
    .topbar, .sidenav, .sec-tools, .pager, .scrim, .skip{ display:none !important; }
    .shell{ display:block; }
    .sec{ display:block !important; page-break-before:always; }
    .sec:first-of-type{ page-break-before:avoid; }
    details.sub{ border:0; box-shadow:none; page-break-inside:avoid; }
    .chev{ display:none; }
    main{ max-width:none; padding:0; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="topbar">
  <div class="topbar-inner">
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">☰</button>
    <div class="brand"><span class="brand-mark">K</span><span id="brandLabel">Kodland LMS</span></div>
    <div class="topbar-tools">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" class="search-input" id="search" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <select class="lang-select" id="langSelect" aria-label="Language"></select>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="shell">
  <aside class="sidenav" id="sidenav">
    <div class="nav-head" id="navHead">Contents</div>
    <nav id="toc"></nav>
  </aside>
  <main id="main">
    <div id="content"></div>
    <nav class="pager" id="pager"></nav>
    <footer id="footerNote"></footer>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

launch_note: `<p><strong>📆 This week only: we start on Wednesday 02.09.2026.</strong></p><p>From next week the usual rhythm applies — everything is recalculated on <strong>Monday</strong> and the messages go out at the start of the week. This first week we are launching on <strong>Wednesday</strong> on purpose, so you have a couple of days to look around, get familiar with your own numbers and tell us what looks wrong.</p><p>If something needs adjusting, these two days are exactly what they are for: report it in <strong>#lms-feedback-tts</strong> and we will fix it before the normal weekly cycle begins.</p>`,
brandLabel: "Kodland LMS",
footerNote: "This page recreates the Kodland LMS Notion guide for translation purposes. Screenshot placeholders mark where the original Notion images should be inserted.",

title: "The Kodland LMS: your guide",
intro1: `<p><strong>🚀 It's here. And you've been asking for it for a long time.</strong></p>
<p><em>"How are my groups actually doing?" · "Which of my students is about to drop?" · "Can I get training on the thing I actually struggle with?" · "Can I just talk to someone who knows my groups?"</em></p>
<p>These are fair questions. We simply didn't have the tools or the processes to answer them. <strong>Now we do.</strong></p>
<p><strong>It's built around your teaching, not around reporting — and it's only the beginning.</strong></p>`,
intro2: `<p><strong>🗺 How to read this page.</strong> We'll go in order: what this thing is → what's inside it → the first metric and how to read your own numbers → what a normal week looks like → what's coming next. About eight minutes. The FAQ at the bottom is there for later.</p>`,

s1_h: "🧭 1 · First, what is it?",
s1_p1: `<p>The <strong>LMS (Learning Management System)</strong> is a platform built by the Tutor Development team, for tutors. You already have a platform for the operational side of your work. This one is for the teaching side.</p>`,
backoffice: `<p><strong>🏢 Back Office — the operational platform</strong></p><p>Schedules, groups, payments, admin. It runs the <em>business</em> of teaching.</p>`,
lms: `<p><strong>🎓 LMS — the pedagogical platform</strong></p><p>Your <em>teaching</em>. How your groups are really doing, and what helps you make them better.</p>`,
s1_p2: `<p>Neither replaces the other. Back Office answers <em>"what is scheduled?"</em> — the LMS answers <em>"how is my teaching going, and what do I do about it?"</em></p>`,
login: `<p><strong>🔗 The login screen and the first thing you see after signing in.</strong></p><p>https://tutors.kodland.org/</p><p>Bookmark it. You'll get your own login credentials from us — see section 8 below for how access works.</p>`,

s2_h: "💡 2 · Why we built it",
s2_p1: `<p><strong>Because you asked. Repeatedly, in tutor meetings, for years.</strong></p>`,
s2_p2: `<p>Until now, when one of your groups started to drift — a student going quiet, another one skipping lessons — you were mostly on your own to notice it. And when support did arrive, weeks had often already passed. Not because nobody cared: because the information was scattered across places nobody could read together, and there was no process to turn it into help.</p>
<p>By the time a family cancels, the reason has usually been visible in the classroom <strong>for weeks</strong>. Now it's visible to us too — and to you first.</p>`,
s2_idea: `<p><strong>🎯 The whole idea in one line:</strong> you find out in week two instead of month three — and you get help while the problem is still fixable.</p>`,

s3_h: "🧰 3 · So what's actually inside?",
s3_intro: `<p>Five things. Here's each one, and what it does for you.</p>`,
s3_metrics_h: "📊 Your metrics",
s3_metrics_p: `<p>How your groups are doing, in one place — updated weekly, visible to you first. No more guessing where you stand or waiting for a meeting to find out.</p>`,
img_metrics: "Your metrics page — your own numbers, updated every week.",
s3_watch_h: "👥 Your student watchlist",
s3_watch_p: `<p>The <strong>names</strong> of the students in your groups who need extra attention this week, and <em>why</em> each one is on the list. This is the part tutors tell us changes the most: a list of names is something you can act on in your next lesson. A percentage isn't.</p>`,
s3_watch_aside: `<p><strong>💡 All the names are clickable</strong> and redirect you to the student's profile in Back Office.</p>`,
img_watch: "The student watchlist with names and statuses.",
s3_train_h: "🎓 Trainings and the DST",
s3_train_p: `<p>Short, targeted trainings — not generic courses. When something in your data needs attention, you get the specific training that helps with <em>that</em>, plus a <strong>Diagnostic Skill Test (DST)</strong> to check that it landed. Both are designed to fit in one sitting.</p>`,
img_train: "A training page + the DST.",
s3_coach_h: "🤝 1:1 coaching sessions",
s3_coach_p: `<p>Book time with your regional mentor in two clicks — pick a slot, say what you want to talk about, done. A real conversation about your actual groups, not a generic review.</p>`,
s3_coach_aside: `<p><strong>💡</strong> You can request one whenever you want; you don't have to wait to be flagged.</p>`,
img_coach: "The coaching booking flow.",
s3_new_h: "🚀 New courses to teach",
s3_new_p: `<p>Trainings and tests for <strong>internal hiring</strong>. Want to teach something new? The materials are there and the door is open — growing here stops depending on someone noticing you're ready.</p>`,
img_new: "The internal hiring / available courses area.",
s3_slack: `<p><strong>💬 And you don't have to remember to log in.</strong> Everything reaches you in <strong>Slack</strong>, in your own language — the weekly watchlist, an assigned training, a coaching confirmation. The platform is where you go to look deeper.</p>`,

s4_h: "🙋 4 · The first metric: Attendance",
s4_p1: `<p>Now the part that matters most, because it's the one going live first.</p>`,
s4_p2: `<p><strong>We're deliberately starting with one metric, done properly.</strong> And that metric now answers two questions instead of one — because a student can be <em>missing from the lesson</em>, or <em>present but checked out</em>, and those are completely different problems.</p>`,

s4_absence_h: "🟡🔴 How Back Office Attendance is recorded: two kinds of absence",
s4_absence_p: `<p>Absences and their reasons come from the data you fill in manually.</p>`,
s4_yellow: `<p><strong>🟡 Yellow — the family told you.</strong> Someone let you know. A family managing a situation, a student with an exam, a broken laptop. You select yellow <strong>and pick the reason you were given</strong>. Those twelve options aren't paperwork. They're the only way we find out <strong>which absences we could prevent from our side.</strong> Pick the closest one honestly. Five seconds from you, and a pattern we can actually act on.</p><p>Yellow reasons available:</p>`,
s4_red: `<p><strong>🔴 Red — nobody told you anything.</strong> The student simply didn't appear, and nobody said why. Select red <strong>only</strong> in that case. Red isn't a harsher label for the same thing — <strong>it means we don't know what happened.</strong> That's what makes it the most dangerous state on the whole page: an absence with a reason is a situation being managed, while an absence without one is a student who might already be gone, and nobody can help someone whose problem is invisible.</p>`,
s4_red_aside: `<p><strong>💡 Red is not a verdict — it's "not yet known".</strong></p>
<p>If you mark a student red and the family later explains, <strong>change it to yellow and add the reason</strong>. That's not correcting a mistake; that's the process working: you reached out, you got an answer, and the record now reflects reality.</p>
<p>This is also one of the fastest things you can do for your own numbers. An unexplained absence that stays unexplained counts against your attendance. The same absence, once you've spoken to the family and recorded why, doesn't.</p>`,

s4_presence_h: "🧮 How Classroom Presence is calculated",
s4_presence_p: `<p>No black box. Three steps.</p>`,
presence_why: `<p><strong>Why we measure it.</strong> It shows how much of the lesson a student is actually there for &mdash; and that is closely connected with retention. A student who logs in and drifts away is on the way out long before it shows up in attendance.</p>`,
step1: `<p><strong>1 &middot; For every lesson, we add up all the time the student was connected.</strong></p>`,
step1b: `<p>Classroom Presence is the <strong>sum of all the segments between a student's connection and disconnection</strong>. If the connection drops and they come back, the segments are added together &mdash; the reconnection itself costs nothing.</p>`,
step2: `<p><strong>2 &middot; We divide that total by the scheduled length of the lesson.</strong></p>`,
step2b: `<p>Two worked examples:</p>`,
presence_examples: [
 "<strong>Lesson 19:00 &ndash; 20:00.</strong> The student connects at 19:00 and disconnects at 19:50. &rarr; 50 / 60 = <strong>83.33%</strong>",
 "<strong>Lesson 19:00 &ndash; 20:00.</strong> The student connects at 19:00 and disconnects at 19:20; after fixing a PC or connection problem, reconnects at 19:40 and stays 20 more minutes. &rarr; (20 + 20) / 60 = <strong>66.66%</strong>",
],
step3: `<p><strong>3 &middot; Their Classroom Presence is the average of that across their lessons in the last 30 days</strong> &mdash; calculated <strong>per group and per course</strong>, so a student who is with you in two courses is measured separately in each. The window rolls, and the numbers refresh <strong>every Monday</strong>.</p>`,
exclude_intro: `<p>What's left out, and why:</p>`,
presence_note: `<p><strong>👀 Worth knowing:</strong> Classroom Presence measures <strong>time in the room</strong> — nothing else. It is not about your camera, your chat, or who talks the most. Those signals belong to a different metric arriving later this quarter, and we'll explain that one just as openly.</p>`,

presence_reliability: `<p><strong>🔧 If a number looks wrong, tell us.</strong> Post it in the <strong>#lms-feedback-tts</strong> channel with a screenshot and a brief description of the problem, and tag your regional mentor.</p>`,
s4_risk_h: "🚦 Your two signals",
risk_p1: `<p>Every student has <strong>two categories</strong> &mdash; one from Classroom Presence, one from Back Office attendance. Your lists show <strong>the worse of the two</strong>, so nobody slips through when the two disagree.</p>`,
alert_warning: `<p><strong>⚠️ One word, two meanings &mdash; read the label with its signal.</strong> <strong>ALERT</strong> on the Classroom Presence side means presence below 50%. <strong>Alert</strong> on the Back Office side means 2&ndash;3 explained absences. Different signals at different severities &mdash; so always name the signal: <em>ALERT (presence)</em>, <em>Alert (absences)</em>. We recommend the same when you discuss a student with your mentor. The group names appear in English in the LMS, which is why we keep them in English here too.</p>`,
risk_p2: `<p>Read them as <strong>alternatives, not conditions</strong>: a student is placed by <em>either</em> the absences <em>or</em> the presence &mdash; whichever is worse. A student with no absences at all can land in 🟠 RISK on presence alone if they are only in the room for 60% of the lesson, and a student with perfect presence can land in 🔴 Critical on a single unexplained absence.</p>`,
risk_p3: `<p>For every flagged student you also see the <strong>reason</strong> behind each yellow absence &mdash; one of the twelve listed above &mdash; so you're not guessing.</p>`,
s4_hpr_h: "📈 HPR and LPR — the two numbers on your card",
hpr_intro: `<p>These are measured on <strong>Classroom Presence</strong>:</p>`,
bar_p: `<p>The bar we hold across all regions: <strong>LPR at or below 25.5%</strong> · <strong>HPR at or above 49.5%</strong>.</p>`,
target_aside: `<p><strong>📌 These are the global targets for the launch quarter.</strong> Regional targets are being confirmed with each Head of Teaching, and your card in the LMS always shows the one that applies to you — so trust the card over any number written down anywhere else.</p>`,
goal_aside: `<p><strong>🎯 On Classroom Presence, the goal is numeric:</strong> push HPR up, pull LPR down.</p>
<p><strong>On Back Office Attendance, the goal is two outcomes — no rate:</strong></p>
<ul>
<li>🔴 <strong>Eliminate unexcused absences.</strong> A red absence means a student vanished and nobody followed up. That should stop being possible.</li>
<li>🟡 <strong>Eliminate the drop-off that begins at the second excused absence.</strong> Two yellows is the point where a student starts to drift <em>and</em> can still be brought back. After that, the odds fall fast.</li>
</ul>
<p><strong>No student should quietly disappear, and none should be lost to two absences nobody answered.</strong></p>`,

s4_payoff_h: "🧭 And here's the practical payoff",
payoff_p1: `<p>The two measures point at different problems, with different fixes. That's the reason we split them:</p>`,
payoff_p2: `<p>Same single percentage you had before, two completely different action plans hiding inside it.</p>`,

maria_h: "🧑‍🏫 Case 1 · Maria — a Classroom Presence problem",
maria_p1: `<p>Maria teaches <strong>3 groups</strong>, <strong>21 students</strong> in total. Here's her last 30 days.</p>`,
maria_p2: `<p>So her two numbers are:</p>`,
maria_aside: `<p><strong>💡 Maria gets flagged on HPR, not LPR — and this is the most common case.</strong></p>
<p>Nobody has disappeared. Her students all <em>come</em>. But nine of them are leaving halfway through, so too few of her students are genuinely present for the whole lesson. On the old single number this was invisible: those nine students counted as "attended".</p>`,

monday_h: "📅 Monday morning — what actually happens",
monday_step1: `<p><strong>1 · A Slack DM arrives.</strong> From Tutor Development, in Maria's own language. It looks like this:</p>`,
monday_after_quote: `<p>Maria doesn't have to log in to find out. <strong>The platform comes to her.</strong></p>`,
monday_step2: `<p><strong>2 · She opens the LMS to see the detail.</strong> At tutors.kodland.org she finds her two measures, her HPR and LPR against the targets, and the same watchlist — but with every student's group, their presence percentage, and a link straight to their Back Office profile. That's where she goes when she wants to know <em>which group</em> the problem sits in.</p>`,
monday_step3: `<p><strong>3 · She notices something the Slack message can't tell her.</strong> Seven of her nine early-leavers are in the same group — her Saturday 6pm class. That's not a teaching problem across the board, it's one room, at one time, with one dynamic. Now she knows where to aim.</p>`,
monday_step4: `<p><strong>4 · She does the training.</strong> It's in the LMS, assigned to her, short. She completes it plus the DST inside the four days and gets a Slack message confirming she passed.</p>`,
monday_step5: `<p><strong>5 · She changes two things in her next lessons.</strong> From the training and the weekly tips: she starts opening with a question every single student has to answer by name, and she stops letting the last five minutes get eaten — the recap and the "what's coming next lesson" line are what keep students in the room to the end.</p>`,
monday_step6: `<p><strong>6 · Two weeks later her HPR is 51%.</strong> She gets a Slack message telling her she's no longer flagged. Nobody had a difficult conversation with her at any point.</p>`,
maria_ifnot: `<p><strong>🤝 And if she hadn't improved?</strong> After the training, if the metric is still below target, Maria is asked to book a <strong>1:1 session with her regional mentor</strong> — two clicks, pick a slot. That conversation is about her real groups, most likely that Saturday 6pm class. Still nobody deciding anything about her from a number.</p>`,

cases_h: "🧭 Two cases, one process",
cases_intro: `<p>A message reaches you when one of three things happens. Your <strong>Classroom Presence</strong> is off target — HPR below target, or LPR above it. Your <strong>Back Office absences</strong> look problematic — two or more students carrying two or more absences nobody explained, or, once you have 10 or more students, more than half your roster carrying one. Or an <strong>urgent case</strong> fires: one student with three or more unexplained absences, or two students with four or more explained ones — whatever your rates say.</p><p>Maria has the first problem, Marco has the second. What happens next is the same in every case:</p>`,
cases_list: ["<strong>A message</strong> — carrying practical tips <em>and</em> the regulations that apply, attached to the message, so you never have to go looking for a policy.","<strong>A short training in the LMS</strong> — assigned to you, plus the DST, four days to complete it.","<strong>A 1:1 with your regional mentor</strong> — if nothing has improved after that."],
cases_aside: `<p><strong>🤝 Nothing here is decided by a number.</strong> The platform decides where we look first — then a person talks to you. If something in the data looks wrong, saying so is useful, not awkward.</p>`,
marco_flag: `<p>That's what triggers his message. Back Office Attendance doesn't flag on an average — it flags on the state of the records: <strong>two or more students carrying two or more absences nobody explained</strong>, or, once you have 10 or more students, <strong>more than half your roster carrying one</strong>. Marco's two students, with two unexplained absences each, are exactly that. An absence with a reason is a situation being managed. A red one is a student who might already be gone.</p>`,
marco_week_h: "📅 His Monday morning — what actually happens",
marco_s0: `<p><strong>1 · The same Slack DM — with the rules attached.</strong> Marco doesn't have to look up a policy or remember one. It looks like this:</p>`,
marco_quote: [
 "Hi Marco 👋",
 "We're reaching out from the Tutor Development Department about the attendance records in your groups. <strong>Two of your students each have two absences marked 🔴 red</strong> — recorded with no reason given.",
 "Students to follow up on:<br>🔴 Lukas Meyer — 2 lessons, no reason recorded<br>🔴 Ana Silva — 2 lessons, no reason recorded",
 "We've assigned a short training to help: <em>Handling Absences</em> — [link]. Please complete it along with the DST within the next 4 days.",
 "The rules for red and yellow absences are attached to this message — what to do, in what order, and what to record.",
 "Your regional mentor is always available to help.",
],
marco_s1: `<p><strong>2 · He opens the LMS to see who and where.</strong> The same watchlist Maria sees, but his shows the two students, their groups, and a link straight to each Back Office profile.</p>`,
marco_s2: `<p><strong>3 · He messages both families the same day.</strong> He sends the recording, a short recap of what was missed, and one question: what happened? An absence nobody acknowledges is far more likely to become a second one.</p>`,
marco_s3: `<p><strong>4 · He records what he was told.</strong> 🔴 red becomes 🟡 yellow with the reason attached — one was an exam week, the other a broken laptop. A red absence should never sit unexplained for more than 48 hours.</p>`,
marco_s4: `<p><strong>5 · He asks before promising anything extra.</strong> One of the two has fallen behind, so Marco raises it with his TL (team leader) — an extra or motivational class is their call, never something to offer a family directly. "Let me check on that" is a complete answer in the meantime.</p>`,
marco_s5: `<p><strong>6 · His records are clean the following week</strong>, and a Slack message tells him he's no longer flagged. As with Maria, nobody had a difficult conversation with him at any point.</p>`,
marco_ifnot: `<p><strong>🤝 And if the absences kept coming?</strong> Exactly as with Maria: if the picture hasn't improved after the training, Marco is asked to book a <strong>1:1 with his regional mentor</strong> — two clicks, pick a slot. Same process, different subject: hers is about running the lesson, his is about what happens between lessons.</p>`,
marco_h: "🔄 Case 2 · Marco — a Back Office Attendance problem",
marco_p1: `<p>Marco also teaches 3 groups. The students who show up are fully present — his HPR is 61%, comfortably above target, so nothing in his Classroom Presence is flagged. His problem is the other measure: <strong>two of his students didn't come to the last two lessons and never told him.</strong> Both sit in the record as 🔴 red — nobody knows why.</p>`,
marco_aside: `<p><strong>🎯 Same metric, two opposite problems.</strong> Maria's work is <em>inside</em> the lesson. Marco's work is <em>outside</em> it. That's exactly why we split attendance into two measures — so the help you get matches the problem you actually have.</p>`,

s5_h: "📅 5 · What a normal week looks like",
s5_p1: `<p>You now know what the platform is and what the numbers mean. Here's the whole flow in one place.</p>`,
s5_flow_h: "🧭 The flow, in brief",
s5_when_h: "❓ When exactly will I be flagged, and why?",
s5_when_p: `<p>Three situations, and nothing else:</p>`,
s5_when_aside: `<p><strong>🙋 And what do I need to do?</strong> Three things, every time.</p>
<ol class="list">
<li>Read the message. It names the metric, the students and the deadline.</li>
<li>Complete the training and the DST within 4 days. They're short by design.</li>
<li>Give those students a way in during your next lessons. The training and the tips tell you how — that's the part that actually moves the number.</li>
</ol>`,

s5_arrive_h: "📨 And here's how it reaches you",
s5_three_aside: `<p><strong>🙌 Three things we ask of you</strong></p>
<ol class="list">
<li>Read the message when it arrives.</li>
<li>Act on it — if a training is assigned, complete it with the DST within 4 days.</li>
<li>Ask if anything is unclear. That's exactly what your regional mentor is for.</li>
</ol>`,

s5_msg_h: "📲 A message just arrived. What do I do?",
s5_msg_p: `<p>Everything reaches you as a <strong>Slack DM from Tutor Development</strong>. There are only five kinds, and none of them needs a long reply.</p>`,
s5_msg_aside: `<p><strong>🤖 These DMs are sent automatically</strong>, so replying to the message doesn't reach a person. If you want to say something, message your <strong>regional mentor</strong> directly — or post it in the channel below, which is usually faster.</p>`,

s5_feedback_h: "🛠 Something looks wrong? There's one place to say so",
feedback_aside: `<p><strong>📣 Post it in #lms-feedback-tts.</strong></p>
<p>Not a DM to whoever you happen to know, and not buried in your tutor channel. One channel means we see every report, we fix things once instead of nine times, and you can see that someone picked it up.</p>
<p>Worth posting:</p>
<ul>
<li>🔢 A number that looks wrong — a student marked absent who was clearly in the room, a percentage that doesn't match what you saw</li>
<li>🔗 A broken link, or a training that doesn't match the problem the message described</li>
<li>🌐 A message in the wrong language, or one naming a student who isn't yours</li>
<li>🔑 Credentials you can't find in Bitwarden once the messages have started</li>
<li>😵 Anything confusing, broken or slow — and anything you wish it did and it doesn't</li>
</ul>
<p><strong>This isn't complaining and it doesn't count against you.</strong> In the first weeks especially, you are the only people who can see whether this actually works. A report that saves the next tutor the same confusion is worth far more to us than a polite silence.</p>`,

s5_mentor_h: "🌍 Your regional mentor",
mentor_p: `<p>This is the person named in every message you receive from us — and the human you'll actually talk to. You don't have to wait to be flagged to reach out.</p>`,

s6_h: "🙅 6 · What this is not",
s6_p1: `<p>Before you log in for the first time, let's be direct about the things people worry about.</p>`,
s6_aside: `<p><strong>⚖️</strong> And where the data is genuinely wrong — a student marked absent who was clearly in the room, a platform failure — <strong>tell us in #lms-feedback-tts</strong>. Those cases are visible to us too, and flagging them protects both you and the student.</p>`,

s7_h: "🔮 7 · What's coming next",
s7_p1: `<p>Attendance is the first metric, not the last.</p>`,
s7_aside: `<p><strong>🛠 This is version one</strong>, and we intend to keep building it with you. If something is confusing, missing or wrong, say so — that feedback is how the next version gets written.</p>`,

s8_h: "🔐 8 · Getting access",
s8_aside: `<p><strong>🔑 Your credentials are going into Bitwarden</strong> — and they will be there within a couple of days.</p>
<p>The LMS holds <strong>personal data</strong> about you and about your students, so access is named and individual: no shared login, no preview account, no exceptions.</p>
<p><strong>How you'll get in:</strong> we are adding your LMS credentials to <strong>Bitwarden</strong>, the same place you already keep your other work logins. There is nothing to request and nobody to chase — they will simply appear there.</p>
<p><strong>The timing lines up on purpose.</strong> The credentials go into Bitwarden in the next couple of days, and that is also when we switch on the automated messages. So by the time the first Slack message reaches you, you will be able to open <strong>tutors.kodland.org</strong> and see the detail behind it.</p>
<p>If the messages have started and you still cannot find the LMS credentials in your Bitwarden — post it in <strong>#lms-feedback-tts</strong> and we will sort it out the same day.</p>`,

s9_h: "❓ 9 · FAQ",
faq1_q: `<p><strong><em>"I have a lot of groups. Am I supposed to do all of this everywhere?"</em></strong></p>`,
faq1_a: `<p>No. Build <strong>one</strong> opening and one closing routine that work in every group, and use them identically. If the workload itself is the problem, say so — that's a scheduling conversation with Teaching Ops, not something to solve with extra effort.</p>`,
faq2_q: `<p><strong><em>"My students just won't turn their cameras on. Is that my score?"</em></strong></p>`,
faq2_a: `<p>No — Classroom Presence is about <strong>time in the room</strong>, not cameras. Cameras, chat and participation belong to a different metric arriving later this quarter, and even there camera is only one of several signals.</p>`,
faq3_q: `<p><strong><em>"A student has connection problems and keeps dropping out. Does that count against me?"</em></strong></p>`,
faq3_a: `<p>Repeated reconnects and platform failures are visible in the data and are not read as your doing. Report them anyway — it protects you and gets the student help.</p>`,
faq4_q: `<p><strong><em>"One of my groups is much harder than the others."</em></strong></p>`,
faq4_a: `<p>Your numbers are calculated per group and per course, so a difficult group doesn't hide behind an average — and it doesn't drag everything else down either. The useful question is usually <em>why one specific room behaves differently from your others</em>, and that's a good thing to bring to a coaching session.</p>`,
faq5_q: `<p><strong><em>"What's the single fastest thing I can change?"</em></strong></p>`,
faq5_body: `<p>Two things, and they cost nothing to prepare:</p>
<ul>
<li>Be in the room before your students — even by one minute.</li>
<li>Open with a question every single student has to answer by name, with no wrong answer. "One word: what did you build last week?" Round the whole room before you share your screen.</li>
</ul>
<p>Those two move more than anything else on this page.</p>`,
faq6_q: `<p><strong><em>"A student missed two lessons in a row. What do I do?"</em></strong></p>`,
faq6_a: `<p><strong>Tell someone — don't wait for the third.</strong> That's the point where a drifting student can still be brought back, and you are usually the only person who sees it early.</p>`,
faq7_q: `<p><strong><em>"Who do I ask if something's unclear?"</em></strong></p>`,
faq7_a: `<p>Your regional mentor.</p>`,
faq_aside: `<p><strong>💬 Anything this page didn't answer?</strong> Ask in your tutor channel or message your regional mentor. If a question comes up more than twice, it belongs on this page — so asking helps everyone.</p>`,

closing_aside: `<p><strong>🎓 In one line</strong></p><p>The LMS exists so that when something starts going wrong in one of your groups, <strong>you find out in week two instead of month three — and you get help while it's still fixable.</strong></p>`,

T.es = {
launch_note: `<p><strong>📆 Solo esta semana: empezamos el miércoles 02.09.2026.</strong></p><p>A partir de la próxima semana se aplica el ritmo habitual — todo se recalcula el <strong>lunes</strong> y los mensajes salen al inicio de la semana. Esta primera semana lanzamos el <strong>miércoles</strong> a propósito, para que tengas un par de días para mirar todo, familiarizarte con tus propios números y decirnos qué se ve mal.</p><p>Si algo necesita ajustarse, estos dos días son exactamente para eso: repórtalo en <strong>#lms-feedback-tts</strong> y lo arreglaremos antes de que empiece el ciclo semanal normal.</p>`,

title: "El LMS de Kodland: tu guía",
intro1: `<p><strong>🚀 Ya está aquí. Y llevas mucho tiempo pidiéndolo.</strong></p>
<p><em>"¿Cómo van realmente mis grupos?" · "¿Cuál de mis estudiantes está a punto de abandonar?" · "¿Puedo recibir capacitación sobre lo que realmente me cuesta?" · "¿Puedo simplemente hablar con alguien que conozca mis grupos?"</em></p>
<p>Son preguntas justas. Simplemente no teníamos las herramientas ni los procesos para responderlas. <strong>Ahora sí.</strong></p>
<p><strong>Está construido en torno a tu enseñanza, no en torno a los reportes — y esto es solo el comienzo.</strong></p>`,
intro2: `<p><strong>🗺 Cómo leer esta página.</strong> Iremos en orden: qué es esto → qué contiene → la primera métrica y cómo leer tus propios números → cómo es una semana normal → qué viene después. Unos ocho minutos. Las preguntas frecuentes al final quedan para más adelante.</p>`,

s1_h: "🧭 1 · Primero, ¿qué es?",
s1_p1: `<p>El <strong>LMS (Learning Management System)</strong> es una plataforma creada por el equipo de Desarrollo de Tutores, para los tutores. Ya cuentas con una plataforma para el lado operativo de tu trabajo. Esta es para el lado pedagógico.</p>`,
backoffice: `<p><strong>🏢 Back Office — la plataforma operativa</strong></p><p>Horarios, grupos, pagos, administración. Gestiona el <em>negocio</em> de la enseñanza.</p>`,
lms: `<p><strong>🎓 LMS — la plataforma pedagógica</strong></p><p>Tu <em>enseñanza</em>. Cómo van realmente tus grupos, y qué te ayuda a mejorarlos.</p>`,
s1_p2: `<p>Ninguna reemplaza a la otra. El Back Office responde <em>"¿qué está programado?"</em> — el LMS responde <em>"¿cómo va mi enseñanza, y qué hago al respecto?"</em></p>`,
login: `<p><strong>🔗 La pantalla de inicio de sesión y lo primero que verás al entrar.</strong></p><p>https://tutors.kodland.org/</p><p>Guárdala en marcadores. Nosotros te daremos tus propias credenciales de acceso — consulta la sección 8 más abajo para saber cómo funciona el acceso.</p>`,

s2_h: "💡 2 · Por qué lo construimos",
s2_p1: `<p><strong>Porque lo pediste. Repetidamente, en las reuniones de tutores, durante años.</strong></p>`,
s2_p2: `<p>Hasta ahora, cuando uno de tus grupos comenzaba a desviarse — un estudiante que se quedaba callado, otro que faltaba a las lecciones — en gran medida te tocaba notarlo por tu cuenta. Y cuando llegaba el apoyo, a menudo ya habían pasado semanas. No porque a nadie le importara: porque la información estaba dispersa en lugares que nadie podía leer en conjunto, y no había un proceso para convertirla en ayuda.</p>
<p>Para cuando una familia cancela, la razón normalmente ha sido visible en el aula <strong>durante semanas</strong>. Ahora también es visible para nosotros — y para ti primero.</p>`,
s2_idea: `<p><strong>🎯 La idea completa en una línea:</strong> te enteras en una semana en lugar de un mes — y recibes ayuda mientras el problema todavía se puede resolver.</p>`,

s3_h: "🧰 3 · Entonces, ¿qué hay realmente dentro?",
s3_intro: `<p>Cinco cosas. Aquí está cada una, y qué hace por ti.</p>`,
s3_metrics_h: "📊 Tus métricas",
s3_metrics_p: `<p>Cómo van tus grupos, en un solo lugar — actualizado semanalmente, visible para ti primero. Se acabó adivinar dónde estás parado o esperar a una reunión para descubrirlo.</p>`,
img_metrics: "Tu página de métricas — tus propios números, actualizados cada semana.",
s3_watch_h: "👥 Tu lista de seguimiento de estudiantes",
s3_watch_p: `<p>Los <strong>nombres</strong> de los estudiantes de tus grupos que necesitan atención extra esta semana, y <em>por qué</em> cada uno está en la lista. Esta es la parte que, según nos dicen los tutores, más cambia las cosas: una lista de nombres es algo sobre lo que puedes actuar en tu próxima lección. Un porcentaje no.</p>`,
s3_watch_aside: `<p><strong>💡 Todos los nombres son clicables</strong> y te redirigen al perfil del estudiante en Backoffice.</p>`,
img_watch: "La lista de seguimiento de estudiantes con nombres y estados.",
s3_train_h: "🎓 Capacitaciones y el DST",
s3_train_p: `<p>Capacitaciones breves y específicas — no cursos genéricos. Cuando algo en tus datos necesita atención, recibes la capacitación específica que ayuda con eso, más una <strong>Prueba de Diagnóstico de Habilidades (DST)</strong> para verificar que quedó claro. Ambas están diseñadas para completarse de una sola vez.</p>`,

s3_coach_p: `<p>Reserva tiempo con tu mentor regional en dos clics — elige un horario, di de qué quieres hablar, listo. Una conversación real sobre tus grupos reales, no una revisión genérica.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Puedes solicitar una cuando quieras; no tienes que esperar a que te marquen.</p>`,

s3_new_h: "🚀 Nuevos cursos para enseñar",
s3_new_p: `<p>Capacitaciones y pruebas para <strong>contratación interna</strong>. ¿Quieres enseñar algo nuevo? Los materiales están ahí y la puerta está abierta — crecer aquí deja de depender de que alguien note que estás listo.</p>`,

s3_slack: `<p><strong>💬 Y no tienes que acordarte de iniciar sesión.</strong> Todo te llega por <strong>Slack</strong>, en tu propio idioma — la lista de seguimiento semanal, una capacitación asignada, una confirmación de coaching. La plataforma es a donde vas para profundizar.</p>`,

s4_h: "🙋 4 · La primera métrica: Asistencia",
s4_p1: `<p>Ahora la parte que más importa, porque es la que se lanza primero.</p>`,
s4_p2: `<p><strong>Deliberadamente empezamos con una sola métrica, hecha bien.</strong> Y esa métrica ahora responde a dos preguntas en lugar de una — porque un estudiante puede <em>faltar a la lección</em>, o <em>estar presente pero sin estar realmente ahí</em>, y esos son problemas completamente distintos.</p>`,

s4_absence_h: "🟡🔴 Cómo se registra la Asistencia en Backoffice: dos tipos de ausencia",
s4_absence_p: `<p>Extraemos datos sobre ausencias y tipos de ausencia de lo que registras manualmente.</p>`,
s4_yellow: `<p><strong>🟡 Amarillo — la familia te avisó.</strong> Alguien te lo hizo saber. Una familia manejando una situación, un estudiante con un examen, una laptop rota. Seleccionas amarillo <strong>y eliges el motivo que te dieron</strong>. Esas doce opciones no son papeleo. Son la única forma en que descubrimos <strong>qué ausencias podríamos haber evitado desde nuestro lado.</strong> Elige la más cercana con honestidad. Cinco segundos de tu parte, y un patrón sobre el que realmente podemos actuar.</p><p>Motivos amarillos disponibles:</p>`,
s4_red: `<p><strong>🔴 Rojo — nadie te dijo nada.</strong> El estudiante simplemente no apareció, y nadie dijo por qué. Selecciona rojo <strong>solo</strong> en ese caso. Rojo no es una etiqueta más dura para lo mismo — <strong>significa que no sabemos qué pasó.</strong> Eso es lo que lo convierte en el estado más peligroso de toda la página: una ausencia con motivo es una situación que se está gestionando, mientras que una ausencia sin motivo es un estudiante que podría haberse ido ya, y nadie puede ayudar a alguien cuyo problema es invisible.</p>`,
s4_red_aside: `<p><strong>💡 Rojo no es un veredicto — es "aún no se sabe".</strong></p>
<p>Si marcas a un estudiante en rojo y la familia luego explica, <strong>cambia a amarillo y agrega el motivo</strong>. Eso no es corregir un error; es el proceso funcionando: te contactaste, obtuviste una respuesta, y el registro ahora refleja la realidad.</p>
<p>Esto también es lo más rápido que puedes hacer por tus propios números. Una ausencia sin explicar que sigue sin explicarse cuenta en contra de tu asistencia. La misma ausencia, una vez que hablaste con la familia y registraste el motivo, ya no.</p>`,

s4_presence_h: "🧮 Cómo se calcula la Presencia en el Aula",
s4_presence_p: `<p>Sin caja negra. Tres pasos.</p>`,
presence_why: `<p><strong>Por qué la medimos.</strong> Muestra cuánto tiempo el estudiante está realmente en la lección &mdash; y eso está estrechamente relacionado con la retención. Un estudiante que se conecta y se va desconectando va camino de irse mucho antes de que se vea en la asistencia.</p>`,
step1: `<p><strong>1 &middot; En cada lección sumamos todo el tiempo que el estudiante estuvo conectado.</strong></p>`,
step1b: `<p>La Presencia en el Aula es la <strong>suma de todos los tramos entre la conexión y la desconexión del estudiante</strong>. Si se cae la conexión y vuelve, los tramos se suman &mdash; la reconexión en sí no cuesta nada.</p>`,
step2: `<p><strong>2 &middot; Dividimos ese total por la duración programada de la lección.</strong></p>`,
step2b: `<p>Dos ejemplos resueltos:</p>`,
presence_examples: [
 "<strong>Lección 19:00 &ndash; 20:00.</strong> El estudiante se conecta a las 19:00 y se desconecta a las 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Lección 19:00 &ndash; 20:00.</strong> El estudiante se conecta a las 19:00 y se desconecta a las 19:20; tras resolver un problema de PC o de conexión, se reconecta a las 19:40 y se queda 20 minutos más. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; Su Presencia en el Aula es el promedio de eso en sus lecciones de los últimos 30 días</strong> &mdash; calculado <strong>por grupo y por curso</strong>, así que un estudiante que está contigo en dos cursos se mide por separado en cada uno. La ventana es móvil y los números se actualizan <strong>cada lunes</strong>.</p>`,
exclude_intro: `<p>Qué se excluye, y por qué:</p>`,
presence_note: `<p><strong>👀 Vale la pena saberlo:</strong> la Presencia en el Aula mide el <strong>tiempo en la sala</strong> — nada más. No se trata de tu cámara, tu chat, o quién habla más. Esas señales pertenecen a una métrica diferente que llega más adelante este trimestre, y la explicaremos con la misma transparencia.</p>`,

presence_reliability: `<p><strong>🔧 Si un número parece incorrecto, dínoslo.</strong> Publícalo en el canal <strong>#lms-feedback-tts</strong> con una captura de pantalla y una breve descripción del problema, y menciona a tu mentor regional.</p>`,
s4_risk_h: "🚦 Tus dos señales",
risk_p1: `<p>Cada estudiante tiene <strong>dos categorías</strong> &mdash; una de la Presencia en el Aula y otra de la asistencia en Back Office. Tus listas muestran <strong>la peor de las dos</strong>, para que nadie se escape cuando las dos no coinciden.</p>`,
alert_warning: `<p><strong>⚠️ Una palabra, dos significados &mdash; lee la etiqueta junto a su señal.</strong> <strong>ALERT</strong> en el lado de la Presencia en el Aula significa presencia por debajo del 50%. <strong>Alert</strong> en el lado de Back Office significa 2&ndash;3 ausencias explicadas. Son señales distintas con gravedades distintas &mdash; así que nombra siempre la señal: <em>ALERT (presencia)</em>, <em>Alert (ausencias)</em>. Te recomendamos hacer lo mismo al hablar de un estudiante con tu mentor. Los nombres de los grupos aparecen en inglés en el LMS, y por eso también los mantenemos en inglés aquí.</p>`,
risk_p2: `<p>Léelas como <strong>alternativas, no como condiciones</strong>: al estudiante lo coloca <em>o</em> las ausencias <em>o</em> la presencia &mdash; lo que esté peor. Un estudiante sin ninguna ausencia puede caer en 🟠 RISK solo por la presencia si está en la sala apenas el 60% de la lección, y un estudiante con presencia perfecta puede caer en 🔴 Critical por una sola ausencia sin explicar.</p>`,
risk_p3: `<p>Para cada estudiante marcado también ves el <strong>motivo</strong> detrás de cada ausencia amarilla &mdash; uno de los doce indicados arriba &mdash; para que no tengas que adivinar.</p>`,
s4_hpr_h: "📈 HPR y LPR — los dos números en tu tarjeta",
hpr_intro: `<p>Estos se miden sobre la <strong>Presencia en el Aula</strong>:</p>`,
bar_p: `<p>El estándar que mantenemos en todas las regiones: <strong>LPR igual o por debajo de 25,5%</strong> · <strong>HPR igual o por encima de 49,5%</strong>.</p>`,
target_aside: `<p><strong>📌 Estos son los objetivos globales para el trimestre de lanzamiento.</strong> Los objetivos regionales se están confirmando con cada Jefe de Enseñanza, y tu tarjeta en el LMS siempre muestra el que te corresponde — así que confía en la tarjeta por encima de cualquier número escrito en otro lugar.</p>`,
goal_aside: `<p><strong>🎯 En la Presencia en el Aula, el objetivo es numérico:</strong> subir el HPR, bajar el LPR.</p>
<p><strong>En la Asistencia de Back Office, el objetivo son dos resultados — sin tasa:</strong></p>
<ul>
<li>🔴 <strong>Eliminar las ausencias sin justificar.</strong> Una ausencia roja significa que un estudiante desapareció y nadie hizo seguimiento. Eso debería dejar de ser posible.</li>
<li>🟡 <strong>Eliminar la deserción que comienza en la segunda ausencia justificada.</strong> Dos amarillas es el punto en el que un estudiante empieza a alejarse <em>y</em> todavía se lo puede recuperar. Después de eso, las probabilidades caen rápido.</li>
</ul>
<p><strong>Ningún estudiante debería desaparecer en silencio, y ninguno debería perderse por dos ausencias que nadie atendió.</strong></p>`,

s4_payoff_h: "🧭 Y aquí está la utilidad práctica",
payoff_p1: `<p>Las dos medidas apuntan a problemas diferentes, con soluciones diferentes. Por eso las separamos:</p>`,
payoff_p2: `<p>El mismo porcentaje único que tenías antes, con dos planes de acción completamente distintos escondidos dentro.</p>`,

maria_h: "🧑‍🏫 Caso 1 · Maria — un problema de Presencia en el Aula",
maria_p1: `<p>Maria enseña <strong>3 grupos</strong>, <strong>21 estudiantes</strong> en total. Estos son sus últimos 30 días.</p>`,
maria_p2: `<p>Así que sus dos números son:</p>`,
maria_aside: `<p><strong>💡 A Maria se le marca por HPR, no por LPR — y este es el caso más común.</strong></p>
<p>Nadie ha desaparecido. Todos sus estudiantes vienen. Pero nueve de ellos se van a la mitad, así que muy pocos de sus estudiantes están genuinamente presentes durante toda la lección. Con el número único anterior, esto era invisible: esos nueve estudiantes contaban como "asistieron".</p>`,

monday_h: "📅 Lunes por la mañana — qué pasa en realidad",
monday_step1: `<p><strong>1 · Llega un DM de Slack.</strong> De Desarrollo de Tutores, en el idioma de Maria. Se ve así:</p>`,
monday_after_quote: `<p>Maria no tiene que iniciar sesión para enterarse. <strong>La plataforma llega a ella.</strong></p>`,
monday_step2: `<p><strong>2 · Abre el LMS para ver el detalle.</strong> En tutors.kodland.org encuentra sus dos medidas, su HPR y LPR frente a los objetivos, y la misma lista de seguimiento — pero con el grupo de cada estudiante, su porcentaje de presencia, y un enlace directo a su perfil en Back Office. Ahí es donde va cuando quiere saber en qué grupo está el problema.</p>`,
monday_step3: `<p><strong>3 · Nota algo que el mensaje de Slack no puede decirle.</strong> Siete de sus nueve estudiantes que se van temprano están en el mismo grupo — su clase de los sábados a las 6pm. Eso no es un problema de enseñanza generalizado, es una sola sala, en un solo horario, con una sola dinámica. Ahora sabe dónde apuntar.</p>`,
monday_step4: `<p><strong>4 · Hace la capacitación.</strong> Está en el LMS, asignada a ella, breve. La completa junto con el DST dentro de los cuatro días y recibe un mensaje de Slack confirmando que aprobó.</p>`,
monday_step5: `<p><strong>5 · Cambia dos cosas en sus próximas lecciones.</strong> De la capacitación y los consejos semanales: empieza a abrir con una pregunta que cada estudiante tiene que responder cuando lo llamas por su nombre, y deja de permitir que se pierdan los últimos cinco minutos — el resumen y la frase de "qué viene en la próxima lección" son lo que mantiene a los estudiantes en la sala hasta el final.</p>`,
monday_step6: `<p><strong>6 · Dos semanas después su HPR es 51%.</strong> Recibe un mensaje de Slack diciéndole que ya no está marcada. Nadie tuvo una conversación difícil con ella en ningún momento.</p>`,
maria_ifnot: `<p><strong>🤝 ¿Y si no hubiera mejorado?</strong> Después de la capacitación, si la métrica sigue por debajo del objetivo, se le pide a Maria reservar una sesión <strong>1:1 con su mentor regional</strong> — dos clics, elige un horario. Esa conversación trata sobre sus grupos reales, muy probablemente esa clase del sábado a las 6pm. Y sigue sin haber nadie que decida nada sobre ella a partir de un número.</p>`,

cases_h: "🧭 Dos casos, un mismo proceso",
cases_intro: `<p>Un mensaje te llega cuando pasa una de tres cosas. Tu <strong>Presencia en el Aula</strong> está fuera del objetivo — HPR por debajo, o LPR por encima. Tus <strong>ausencias en Back Office</strong> se ven problemáticas — dos o más estudiantes con dos o más ausencias que nadie explicó, o, cuando ya tienes 10 o más estudiantes, más de la mitad de tu lista con una. O se dispara un <strong>caso urgente</strong>: un estudiante con tres o más ausencias sin explicar, o dos estudiantes con cuatro o más explicadas — sin importar lo que digan tus porcentajes.</p><p>Maria tiene el primer problema, Marco el segundo. Lo que pasa después es igual en todos los casos:</p>`,
cases_list: ["<strong>Un mensaje</strong> — con consejos prácticos <em>y</em> las normas que corresponden, adjuntas, para que nunca tengas que ir a buscar una norma.","<strong>Una capacitación corta en el LMS</strong> — asignada a ti, más el DST, cuatro días para completarla.","<strong>Un 1:1 con tu mentor regional</strong> — si después de eso el número sigue sin moverse."],
cases_aside: `<p><strong>🤝 Nada de esto lo decide un número.</strong> La plataforma decide dónde miramos primero — después una persona habla contigo. Si algo en los datos parece equivocado, decirlo es útil, no incómodo.</p>`,
marco_flag: `<p>Eso es lo que dispara su mensaje. La asistencia en Back Office no se marca por un promedio — se marca por el estado de los registros: <strong>dos o más estudiantes con dos o más ausencias que nadie explicó</strong>, o, cuando ya tienes 10 o más estudiantes, <strong>más de la mitad de tu lista con una</strong>. Los dos estudiantes de Marco, con dos ausencias sin explicar cada uno, son exactamente eso. Una ausencia con motivo es una situación que se está gestionando. Una roja es un estudiante que podría haberse ido ya.</p>`,
marco_week_h: "📅 Su lunes por la mañana — qué pasa en realidad",
marco_s0: `<p><strong>1 · El mismo DM de Slack — con las normas adjuntas.</strong> Marco no tiene que buscar ninguna norma ni recordarla. Se ve así:</p>`,
marco_quote: [
 "Hola Marco 👋",
 "Te escribimos desde el Departamento de Desarrollo de Tutores sobre los registros de asistencia en tus grupos. <strong>Dos de tus estudiantes tienen dos ausencias cada uno marcadas como 🔴 rojas</strong> — registradas sin motivo.",
 "Estudiantes a seguir:<br>🔴 Lukas Meyer — 2 lecciones, sin motivo registrado<br>🔴 Ana Silva — 2 lecciones, sin motivo registrado",
 "Te asignamos una capacitación corta para ayudarte: <em>Gestión de Ausencias</em> — [enlace]. Complétala junto con el DST en los próximos 4 días.",
 "Las normas para ausencias rojas y amarillas están adjuntas a este mensaje — qué hacer, en qué orden, y qué registrar.",
 "Tu mentor regional está siempre disponible para ayudarte.",
],
marco_s1: `<p><strong>2 · Abre el LMS para ver a quién y dónde.</strong> La misma lista de seguimiento que ve Maria, pero la suya muestra los dos estudiantes, sus grupos, y un enlace directo a cada perfil en Back Office.</p>`,
marco_s2: `<p><strong>3 · Escribe a ambas familias el mismo día.</strong> La grabación, un breve resumen de lo que se perdieron, y una pregunta: ¿qué pasó? Una ausencia que nadie reconoce tiene mucha más probabilidad de convertirse en una segunda.</p>`,
marco_s3: `<p><strong>4 · Registra lo que le dijeron.</strong> El 🔴 rojo pasa a 🟡 amarillo con el motivo adjunto — una era una semana de exámenes, la otra una laptop rota. Una ausencia roja nunca debería quedar sin explicar más de 48 horas.</p>`,
marco_s4: `<p><strong>5 · Pregunta antes de prometer algo extra.</strong> Uno de los dos se ha atrasado, así que Marco se lo plantea a su TL — una clase extra o motivacional es decisión del TL, nunca algo que ofrecer directamente a una familia. "Déjame consultarlo" es una respuesta completa mientras tanto.</p>`,
marco_s5: `<p><strong>6 · Sus registros están limpios la semana siguiente</strong>, y un mensaje de Slack le dice que ya no está marcado. Como con Maria, nadie tuvo una conversación difícil con él en ningún momento.</p>`,
marco_ifnot: `<p><strong>🤝 ¿Y si las ausencias siguieran?</strong> Exactamente como con Maria: si el panorama no ha mejorado después de la capacitación, se le pide a Marco reservar un <strong>1:1 con su mentor regional</strong> — dos clics, elige un horario. Mismo proceso, tema distinto: el de ella es sobre dar la lección, el de él sobre lo que pasa entre lecciones.</p>`,
marco_h: "🔄 Caso 2 · Marco — un problema de Asistencia en Back Office",
marco_p1: `<p>Marco también enseña 3 grupos. Los estudiantes que asisten están totalmente presentes — su HPR es 61%, cómodamente por encima del objetivo, así que nada en su Presencia en el Aula está marcado. Su problema es la otra medida: <strong>dos de sus estudiantes no vinieron a las últimas dos lecciones y nunca le avisaron.</strong> Ambos figuran en el registro como 🔴 rojo — nadie sabe por qué.</p>`,
marco_aside: `<p><strong>🎯 Misma métrica, dos problemas opuestos.</strong> El trabajo de Maria es <em>dentro</em> de la lección. El de Marco es <em>fuera</em> de ella. Por eso exactamente dividimos la asistencia en dos medidas — para que la ayuda que recibas coincida con el problema que realmente tienes.</p>`,

s5_h: "📅 5 · Cómo es una semana normal",
s5_p1: `<p>Ya sabes qué es la plataforma y qué significan los números. Aquí está todo el flujo en un solo lugar.</p>`,
s5_flow_h: "🧭 El flujo, en resumen",
s5_when_h: "❓ ¿Cuándo exactamente me marcarán, y por qué?",
s5_when_p: `<p>Tres situaciones, y nada más:</p>`,
s5_when_aside: `<p><strong>🙋 ¿Y qué necesito hacer?</strong> Tres cosas, siempre.</p>
<ol class="list">
<li>Lee el mensaje. Ahí están la métrica, los estudiantes y el plazo.</li>
<li>Completa la capacitación y el DST dentro de 4 días. Son breves a propósito.</li>
<li>Dale a esos estudiantes una forma de participar en tus próximas lecciones. La capacitación y los consejos te dicen cómo — esa es la parte que realmente mueve el número.</li>
</ol>`,

s5_arrive_h: "📨 Y así es como te llega",
s5_three_aside: `<p><strong>🙌 Tres cosas que te pedimos</strong></p>
<ol class="list">
<li>Lee el mensaje cuando llegue.</li>
<li>Actúa en consecuencia — si te asignan una capacitación, complétala con el DST dentro de 4 días.</li>
<li>Pregunta si algo no está claro. Para eso está exactamente tu mentor regional.</li>
</ol>`,

s5_msg_h: "📲 Acaba de llegar un mensaje. ¿Qué hago?",
s5_msg_p: `<p>Todo te llega como un <strong>DM de Slack de Desarrollo de Tutores</strong>. Solo hay cinco tipos, y ninguno necesita una respuesta larga.</p>`,
s5_msg_aside: `<p><strong>🤖 Estos DM se envían automáticamente</strong>, así que si respondes al mensaje, tu respuesta no le llega a nadie. Si quieres decir algo, escribe directamente a tu <strong>mentor regional</strong> — o publícalo en el canal de abajo, que suele ser más rápido.</p>`,

s5_feedback_h: "🛠 ¿Algo se ve mal? Hay un solo lugar para decirlo",
feedback_aside: `<p><strong>📣 Publícalo en #lms-feedback-tts.</strong></p>
<p>No un DM a quien sea que conozcas, y no enterrado en tu canal de tutores. Un solo canal significa que vemos cada reporte, arreglamos las cosas una vez en lugar de nueve, y puedes ver que alguien lo tomó en cuenta.</p>
<p>Vale la pena publicar:</p>
<ul>
<li>🔢 Un número que se ve mal — un estudiante marcado como ausente que claramente estaba en la sala, un porcentaje que no coincide con lo que viste</li>
<li>🔗 Un enlace roto, o una capacitación que no coincide con el problema que describía el mensaje</li>
<li>🌐 Un mensaje en el idioma equivocado, o que nombra a un estudiante que no es tuyo</li>
<li>🔑 Credenciales que no encuentras en Bitwarden una vez que los mensajes ya empezaron</li>
<li>😵 Cualquier cosa confusa, rota o lenta — y cualquier cosa que desearías que hiciera y no hace</li>
</ul>
<p><strong>Esto no es quejarse y no cuenta en tu contra.</strong> En las primeras semanas especialmente, ustedes son los únicos que pueden ver si esto realmente funciona. Un reporte que le ahorra al próximo tutor la misma confusión vale mucho más para nosotros que un silencio educado.</p>`,

s5_mentor_h: "🌍 Tu mentor regional",
mentor_p: `<p>Esta es la persona nombrada en cada mensaje que recibes de nosotros — y el ser humano con quien realmente hablarás. No tienes que esperar a que te marquen para contactarlo.</p>`,

s6_h: "🙅 6 · Lo que esto no es",
s6_p1: `<p>Antes de que inicies sesión por primera vez, seamos directos sobre lo que a la gente le preocupa.</p>`,
s6_aside: `<p><strong>⚖️</strong> Y donde los datos están genuinamente equivocados — un estudiante marcado como ausente que claramente estaba en la sala, una falla de la plataforma — <strong>dínoslo en #lms-feedback-tts</strong>. Esos casos también son visibles para nosotros, y señalarlos te protege tanto a ti como al estudiante.</p>`,

s7_h: "🔮 7 · Qué viene después",
s7_p1: `<p>La asistencia es la primera métrica, no la última.</p>`,
s7_aside: `<p><strong>🛠 Esta es la versión uno</strong>, y tenemos la intención de seguir construyéndola contigo. Si algo es confuso, falta o está mal, dilo — con ese feedback escribimos la próxima versión.</p>`,

s8_h: "🔐 8 · Cómo obtener acceso",
s8_aside: `<p><strong>🔑 Tus credenciales van a Bitwarden</strong> — y estarán ahí en un par de días.</p>
<p>El LMS contiene <strong>datos personales</strong> sobre ti y sobre tus estudiantes, así que el acceso es nominal e individual: sin inicio de sesión compartido, sin cuenta de prueba, sin excepciones.</p>
<p><strong>Cómo entrarás:</strong> estamos agregando tus credenciales del LMS a <strong>Bitwarden</strong>, el mismo lugar donde ya guardas tus otros accesos de trabajo. No hay nada que solicitar ni nadie a quien perseguir — simplemente aparecerán ahí.</p>
<p><strong>El momento está alineado a propósito.</strong> Las credenciales entran a Bitwarden en los próximos días, y ese es también el momento en que activamos los mensajes automáticos. Así que para cuando te llegue el primer mensaje de Slack, podrás abrir <strong>tutors.kodland.org</strong> y ver el detalle detrás de él.</p>
<p>Si los mensajes ya empezaron y aún no encuentras las credenciales del LMS en tu Bitwarden — publícalo en <strong>#lms-feedback-tts</strong> y lo resolveremos ese mismo día.</p>`,

s9_h: "❓ 9 · Preguntas frecuentes",
faq1_q: `<p><strong><em>"Tengo muchos grupos. ¿Se supone que haga todo esto en todos lados?"</em></strong></p>`,
faq1_a: `<p>No. Construye <strong>una</strong> rutina de apertura y una de cierre que funcionen en todos los grupos, y úsalas de manera idéntica. Si la carga de trabajo en sí es el problema, dilo — esa es una conversación de horarios con Teaching Ops, no algo para resolver con más esfuerzo.</p>`,
faq2_q: `<p><strong><em>"Mis estudiantes simplemente no encienden la cámara. ¿Eso afecta mi puntaje?"</em></strong></p>`,
faq2_a: `<p>No — la Presencia en el Aula se trata del <strong>tiempo en la sala</strong>, no de las cámaras. Las cámaras, el chat y la participación pertenecen a una métrica diferente que llega más adelante este trimestre, y ahí también la cámara es solo una de varias señales.</p>`,
faq3_q: `<p><strong><em>"Un estudiante tiene problemas de conexión y se desconecta todo el tiempo. ¿Eso cuenta en mi contra?"</em></strong></p>`,
faq3_a: `<p>Las reconexiones repetidas y las fallas de la plataforma son visibles en los datos y no se interpretan como responsabilidad tuya. Repórtalas de todos modos — te protege y le consigue ayuda al estudiante.</p>`,
faq4_q: `<p><strong><em>"Uno de mis grupos es mucho más difícil que los demás."</em></strong></p>`,
faq4_a: `<p>Tus números se calculan por grupo y por curso, así que un grupo difícil no se esconde detrás de un promedio — y tampoco arrastra todo lo demás hacia abajo. La pregunta útil suele ser <em>por qué una sala en concreto se comporta distinto a las demás</em>, y eso es algo bueno para llevar a una sesión de coaching.</p>`,
faq5_q: `<p><strong><em>"¿Qué es lo más rápido que puedo cambiar?"</em></strong></p>`,
faq5_body: `<p>Dos cosas, y no cuestan nada prepararlas:</p>
<ul>
<li>Estar en la sala antes que tus estudiantes — aunque sea por un minuto.</li>
<li>Abrir con una pregunta que cada estudiante deba responder cuando lo llamas por su nombre, sin respuesta incorrecta. "Una palabra: ¿qué construiste la semana pasada?" Da la vuelta a toda la sala antes de compartir tu pantalla.</li>
</ul>
<p>Esas dos cosas mueven más que cualquier otra cosa en esta página.</p>`,
faq6_q: `<p><strong><em>"Un estudiante faltó a dos lecciones seguidas. ¿Qué hago?"</em></strong></p>`,
faq6_a: `<p><strong>Dile a alguien — no esperes a la tercera.</strong> Ese es el punto en el que un estudiante que se está alejando todavía puede recuperarse, y normalmente eres la única persona que lo ve a tiempo.</p>`,
faq7_q: `<p><strong><em>"¿A quién le pregunto si algo no está claro?"</em></strong></p>`,
faq7_a: `<p>Tu mentor regional.</p>`,
faq_aside: `<p><strong>💬 ¿Algo que esta página no respondió?</strong> Pregunta en tu canal de tutores o escribe a tu mentor regional. Si una pregunta surge más de dos veces, pertenece a esta página — así que preguntar ayuda a todos.</p>`,

closing_aside: `<p><strong>🎓 En una línea</strong></p><p>El LMS existe para que, cuando algo empiece a ir mal en uno de tus grupos, <strong>te enteres en la semana dos en lugar del mes tres — y recibas ayuda mientras todavía se puede resolver.</strong></p>`,
