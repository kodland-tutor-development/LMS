intro1: `<p><strong>🚀 لقد وصل أخيرًا. وأنتم تطلبونه منذ وقت طويل.</strong></p>
<p><em>"كيف تسير مجموعاتي فعليًا؟" · "أي طلابي على وشك الانسحاب؟" · "هل يمكنني الحصول على تدريب حول ما أواجه فيه صعوبة فعلًا؟" · "هل يمكنني ببساطة التحدث مع شخص يعرف مجموعاتي؟"</em></p>
<p>هذه أسئلة مشروعة. ببساطة لم تكن لدينا الأدوات ولا العمليات للإجابة عنها. <strong>الآن أصبحت لدينا.</strong></p>
<p><strong>تم بناؤه حول تدريسك، وليس حول التقارير — وهذه مجرد البداية.</strong></p>`,
intro2: `<p><strong>🗺 كيفية قراءة هذه الصفحة.</strong> سنسير بالترتيب: ما هذا الشيء ← ما الذي يحتويه ← أول مقياس وكيفية قراءة أرقامك الخاصة ← كيف يبدو أسبوع عادي ← ما القادم. حوالي ثماني دقائق. الأسئلة الشائعة في الأسفل متروكة لوقت لاحق.</p>`,

s1_h: "🧭 1 · أولًا، ما هذا؟",
s1_p1: `<p><strong>نظام LMS (نظام إدارة التعلم)</strong> هو منصة بناها فريق تطوير المدرّسين، من أجل المدرّسين. لديك بالفعل منصة للجانب التشغيلي من عملك. هذه المنصة للجانب التعليمي.</p>`,
backoffice: `<p><strong>🏢 Back Office — المنصة التشغيلية</strong></p><p>الجداول، المجموعات، المدفوعات، الإدارة. تدير <em>عمل</em> التدريس.</p>`,
lms: `<p><strong>🎓 LMS — المنصة التعليمية</strong></p><p><em>تدريسك</em>. كيف تسير مجموعاتك فعليًا، وما الذي يساعدك على تحسينها.</p>`,
s1_p2: `<p>لا تحل إحداهما محل الأخرى. Back Office يجيب على سؤال <em>"ما المُجدوَل؟"</em> — أما LMS فيجيب على سؤال <em>"كيف يسير تدريسي، وماذا أفعل حيال ذلك؟"</em></p>`,
login: `<p><strong>🔗 شاشة تسجيل الدخول وأول ما تراه بعد الدخول.</strong></p><p>https://tutors.kodland.org/</p><p>احفظها في المفضلة. ستحصل على بيانات تسجيل الدخول الخاصة بك منّا — راجع القسم 8 أدناه لمعرفة كيفية عمل الوصول.</p>`,

s2_h: "💡 2 · لماذا بنيناه",
s2_p1: `<p><strong>لأنكم طلبتم ذلك. مرارًا، في اجتماعات المدرّسين، لسنوات.</strong></p>`,
s2_p2: `<p>حتى الآن، عندما كانت إحدى مجموعاتك تبدأ في الانحراف — طالب يصبح صامتًا، وآخر يتغيب عن الحصص — كنت في الغالب وحدك في ملاحظة ذلك. وعندما كان الدعم يصل، كانت الأسابيع قد مرت غالبًا. ليس لأن أحدًا لم يهتم: بل لأن المعلومات كانت متناثرة في أماكن لا يستطيع أحد قراءتها معًا، ولم تكن هناك عملية لتحويلها إلى مساعدة.</p>
<p>بحلول الوقت الذي تُلغي فيه إحدى العائلات، عادةً ما يكون السبب مرئيًا في الفصل <strong>منذ أسابيع</strong>. الآن أصبح مرئيًا لنا أيضًا — ولك أولًا.</p>`,
s2_idea: `<p><strong>🎯 الفكرة كلها في جملة واحدة:</strong> تكتشف الأمر خلال أسبوع بدلًا من شهر — وتحصل على المساعدة بينما لا تزال المشكلة قابلة للحل.</p>`,

s3_h: "🧰 3 · إذن، ما الذي يوجد فعليًا بالداخل؟",
s3_intro: `<p>خمسة أشياء. إليك كل واحد منها، وما يفعله من أجلك.</p>`,
s3_metrics_h: "📊 مقاييسك",
s3_metrics_p: `<p>كيف تسير مجموعاتك، في مكان واحد — تُحدَّث أسبوعيًا، ومرئية لك أولًا. لا مزيد من التخمين حول موقفك أو انتظار اجتماع لمعرفة ذلك.</p>`,
img_metrics: "صفحة مقاييسك — أرقامك الخاصة، تُحدَّث كل أسبوع.",
s3_watch_h: "👥 قائمة متابعة طلابك",
s3_watch_p: `<p><strong>أسماء</strong> الطلاب في مجموعاتك الذين يحتاجون إلى اهتمام إضافي هذا الأسبوع، و<em>سبب</em> وجود كل واحد منهم في القائمة. هذا هو الجزء الذي يخبرنا المدرّسون أنه يغيّر الأمور أكثر من غيره: قائمة الأسماء هي شيء يمكنك التصرف بناءً عليه في حصتك القادمة. النسبة المئوية لا تفعل ذلك.</p>`,
s3_watch_aside: `<p><strong>💡 جميع الأسماء قابلة للنقر</strong> وتُعيد توجيهك إلى ملف الطالب الشخصي في Back Office.</p>`,
img_watch: "قائمة متابعة الطلاب بالأسماء والحالات.",
s3_train_h: "🎓 التدريبات و DST",
s3_train_p: `<p>تدريبات قصيرة ومحددة الهدف — وليست دورات عامة. عندما يحتاج شيء ما في بياناتك إلى اهتمام، تحصل على التدريب المحدد الذي يساعد <em>في ذلك تحديدًا</em>، بالإضافة إلى <strong>اختبار تشخيصي للمهارات (DST)</strong> للتحقق من استيعابه. كلاهما مصمم للإنجاز في جلسة واحدة.</p>`,
img_train: "صفحة تدريب + اختبار DST.",
s3_coach_h: "🤝 جلسات التوجيه الفردي 1:1",
s3_coach_p: `<p>احجز وقتًا مع موجّهك الإقليمي بنقرتين — اختر موعدًا، حدد ما تريد التحدث عنه، وانتهى الأمر. محادثة حقيقية حول مجموعاتك الفعلية، وليست مراجعة عامة.</p>`,
s3_coach_aside: `<p><strong>💡</strong> يمكنك طلب واحدة متى شئت؛ لست بحاجة لانتظار أن يتم وضع علامة عليك.</p>`,
img_coach: "مسار حجز جلسة التوجيه.",
s3_new_h: "🚀 دورات جديدة للتدريس",
s3_new_p: `<p>تدريبات واختبارات <strong>للتوظيف الداخلي</strong>. تريد تدريس شيء جديد؟ المواد موجودة والباب مفتوح — النمو هنا لم يعد يعتمد على ملاحظة شخص ما أنك مستعد.</p>`,
img_new: "قسم التوظيف الداخلي / الدورات المتاحة.",
s3_slack: `<p><strong>💬 ولست بحاجة إلى تذكّر تسجيل الدخول.</strong> يصلك كل شيء عبر <strong>Slack</strong>، بلغتك الخاصة — قائمة المتابعة الأسبوعية، تدريب مُخصص، تأكيد جلسة توجيه. المنصة هي المكان الذي تذهب إليه للتعمق أكثر.</p>`,

s4_h: "🙋 4 · المقياس الأول: الحضور",
s4_p1: `<p>الآن الجزء الأكثر أهمية، لأنه أول ما يُطلق.</p>`,
s4_p2: `<p><strong>نبدأ عمدًا بمقياس واحد، مُنجز بشكل صحيح.</strong> وهذا المقياس يجيب الآن على سؤالين بدلًا من سؤال واحد — لأن الطالب قد يكون غائبًا عن الحصة، أو حاضرًا لكن غير منخرط، وهاتان مشكلتان مختلفتان تمامًا.</p>`,

s4_absence_h: "🟡🔴 كيف يُسجَّل الحضور في Back Office: نوعان من الغياب",
s4_absence_p: `<p>نستخرج البيانات حول الغياب وأنواعه مما تسجله يدويًا.</p>`,
s4_yellow: `<p><strong>🟡 أصفر — أخبرتك العائلة.</strong> شخص ما أعلمك. عائلة تتعامل مع موقف ما، طالب لديه اختبار، حاسوب محمول معطل. تختار اللون الأصفر <strong>وتحدد السبب الذي أُعطي لك</strong>. تلك الخيارات الاثنا عشر ليست إجراءً شكليًا. إنها الطريقة الوحيدة التي نكتشف بها <strong>الغيابات التي كان بإمكاننا منعها من جهتنا.</strong> اختر الأقرب بصدق. خمس ثوانٍ من وقتك، ونمط يمكننا فعلًا التصرف بناءً عليه.</p><p>الأسباب الصفراء المتاحة:</p>`,
s4_red: `<p><strong>🔴 أحمر — لم يخبرك أحد بشيء.</strong> ببساطة لم يظهر الطالب، ولم يقل أحد السبب. اختر اللون الأحمر <strong>فقط</strong> في هذه الحالة. الأحمر ليس تسمية أشد قسوة لنفس الشيء — <strong>بل يعني أننا لا نعرف ما حدث.</strong> هذا ما يجعله الحالة الأخطر في الصفحة بأكملها: الغياب المصحوب بسبب هو موقف تتم إدارته، بينما الغياب بدون سبب هو طالب قد يكون قد رحل بالفعل، ولا يمكن لأحد مساعدة شخص مشكلته غير مرئية.</p>`,
s4_red_aside: `<p><strong>💡 الأحمر ليس حكمًا نهائيًا — بل يعني "لم يُعرف بعد".</strong></p>
<p>إذا وضعت علامة حمراء على طالب ثم أوضحت العائلة السبب لاحقًا، <strong>غيّرها إلى أصفر وأضف السبب</strong>. هذا ليس تصحيحًا لخطأ؛ بل هو العملية وهي تعمل كما ينبغي: تواصلت، حصلت على إجابة، والسجل الآن يعكس الواقع.</p>
<p>هذا أيضًا أسرع شيء يمكنك فعله لأرقامك الخاصة. الغياب غير المُفسَّر الذي يظل بلا تفسير يُحتسب ضد حضورك. نفس الغياب، بعد أن تتحدث مع العائلة وتسجل السبب، لا يُحتسب.</p>`,

s4_presence_h: "🧮 كيف يُحسَب الحضور الصفي",
s4_presence_p: `<p>لا صندوق أسود. ثلاث خطوات.</p>`,
presence_why: `<p><strong>لماذا نقيسه.</strong> يوضح المدة التي يكون فيها الطالب حاضرًا فعليًا في الحصة &mdash; وهو مرتبط ارتباطًا وثيقًا ببقاء الطلاب معنا. الطالب الذي يتصل ثم يبتعد يكون في طريقه إلى المغادرة قبل أن يظهر ذلك في سجل الحضور بوقت طويل.</p>`,
step1: `<p><strong>1 &middot; في كل حصة نجمع كل الوقت الذي كان الطالب متصلًا فيه.</strong></p>`,
step1b: `<p>الحضور الصفي هو <strong>مجموع كل الفترات بين اتصال الطالب وانقطاعه</strong>. إذا انقطع الاتصال ثم عاد، تُجمع الفترات معًا &mdash; وإعادة الاتصال نفسها لا تُحسب ضده.</p>`,
step2: `<p><strong>2 &middot; نقسم هذا المجموع على المدة المجدولة للحصة.</strong></p>`,
step2b: `<p>مثالان محلولان:</p>`,
presence_examples: [
 "<strong>حصة 19:00 &ndash; 20:00.</strong> يتصل الطالب في 19:00 وينقطع في 19:50. &rarr; 50 / 60 = <strong>83.33%</strong>",
 "<strong>حصة 19:00 &ndash; 20:00.</strong> يتصل الطالب في 19:00 وينقطع في 19:20؛ وبعد حل مشكلة في الحاسوب أو الاتصال يعود في 19:40 ويبقى 20 دقيقة أخرى. &rarr; (20 + 20) / 60 = <strong>66.66%</strong>",
],
step3: `<p><strong>3 &middot; الحضور الصفي للطالب هو متوسط ذلك على حصصه في آخر 30 يومًا</strong> &mdash; ويُحسب <strong>لكل مجموعة ولكل دورة</strong>، لذا الطالب الموجود معك في دورتين يُقاس في كل واحدة على حدة. النافذة متحركة، والأرقام تُحدَّث <strong>كل يوم اثنين</strong>.</p>`,
exclude_intro: `<p>ما الذي يُستبعد، ولماذا:</p>`,
presence_note: `<p><strong>👀 جديرٌ بالانتباه:</strong> الحضور الصفي يقيس <strong>الوقت داخل الغرفة</strong> — لا شيء آخر. لا علاقة له بكاميرتك، ولا بمحادثتك، ولا بمن يتحدث أكثر. تلك الإشارات تنتمي إلى مقياس مختلف سيصل لاحقًا هذا الربع، وسنشرحه بنفس القدر من الشفافية.</p>`,

presence_reliability: `<p><strong>🔧 إذا بدا رقم ما خاطئًا، أخبرنا.</strong> اكتب عنه في قناة <strong>#lms-feedback-tts</strong> مع لقطة شاشة ووصف قصير للمشكلة، وأشِر إلى موجّهك الإقليمي.</p>`,
s4_risk_h: "🚦 إشارتاك",
risk_p1: `<p>لكل طالب <strong>فئتان</strong> &mdash; واحدة من الحضور الصفي، وواحدة من الحضور في Back Office. قوائمك تعرض <strong>الأسوأ من الاثنتين</strong>، حتى لا يفلت أحد عندما لا تتفق الإشارتان.</p>`,
alert_warning: `<p><strong>⚠️ كلمة واحدة بمعنيين &mdash; اقرأ التسمية مع إشارتها.</strong> <strong>ALERT</strong> في جانب الحضور الصفي تعني حضورًا أقل من 50%. و<strong>Alert</strong> في جانب Back Office تعني 2&ndash;3 غيابات مُفسَّرة. إشارتان مختلفتان بدرجتَي خطورة مختلفتين &mdash; لذا اذكر الإشارة دائمًا: <em>ALERT (الحضور الصفي)</em>، <em>Alert (الغياب)</em>. ونوصي بالمثل عند مناقشة طالب مع موجّهك. أسماء المجموعات تظهر بالإنجليزية في الـ LMS، ولهذا نُبقيها بالإنجليزية هنا أيضًا.</p>`,
risk_p2: `<p>اقرأهما كـ<strong>بديلين، وليس شرطين</strong>: يُصنَّف الطالب <em>إما</em> بسبب الغياب <em>أو</em> بسبب الحضور &mdash; أيهما أسوأ. قد يقع طالب بلا أي غياب في 🟠 RISK بسبب الحضور وحده إذا كان في الغرفة 60% من الحصة فقط، وقد يقع طالب بحضور مثالي في 🔴 Critical بسبب غياب واحد غير مُفسَّر.</p>`,
risk_p3: `<p>لكل طالب مُدرَج في القائمة، ترى أيضًا <strong>السبب</strong> وراء كل غياب أصفر &mdash; أحد الأسباب الاثني عشر المذكورة أعلاه &mdash; حتى لا تحتاج للتخمين.</p>`,
s4_hpr_h: "📈 HPR و LPR — الرقمان في بطاقتك",
hpr_intro: `<p>يُقاسان بناءً على <strong>الحضور الصفي</strong>:</p>`,
bar_p: `<p>المعيار الذي نحافظ عليه في جميع المناطق: <strong>LPR عند 25.5% أو أقل</strong> · <strong>HPR عند 49.5% أو أكثر</strong>.</p>`,
target_aside: `<p><strong>📌 هذه هي الأهداف العالمية لربع سنة الإطلاق.</strong> يجري تأكيد الأهداف الإقليمية مع كل رئيس تعليم، وبطاقتك في LMS تعرض دائمًا الهدف المطبق عليك — لذا ثق بالبطاقة أكثر من أي رقم مكتوب في مكان آخر.</p>`,
goal_aside: `<p><strong>🎯 في الحضور الصفي، الهدف رقمي:</strong> رفع HPR، وخفض LPR.</p>
<p><strong>في حضور Back Office، الهدف نتيجتان — وليس معدلًا:</strong></p>
<ul>
<li>🔴 <strong>القضاء على الغياب غير المبرر.</strong> الغياب الأحمر يعني أن طالبًا اختفى ولم يتابعه أحد. يجب أن يتوقف هذا عن أن يكون ممكنًا.</li>
<li>🟡 <strong>القضاء على التسرب الذي يبدأ عند الغياب المبرر الثاني.</strong> الغياب الأصفر مرتين هو النقطة التي يبدأ فيها الطالب بالانجراف <em>و</em> لا يزال بالإمكان استعادته. بعد ذلك، تنخفض الاحتمالات بسرعة.</li>
</ul>
<p><strong>لا ينبغي لأي طالب أن يختفي بصمت، ولا ينبغي أن يُفقد أي طالب بسبب غيابين لم يستجب لهما أحد.</strong></p>`,

s4_payoff_h: "🧭 وهنا الفائدة العملية",
payoff_p1: `<p>يشير المقياسان إلى مشكلتين مختلفتين، بحلول مختلفة. لهذا فصلناهما:</p>`,
payoff_p2: `<p>نفس النسبة المئوية الواحدة التي كانت لديك سابقًا، تخفي بداخلها خطتي عمل مختلفتين تمامًا.</p>`,

maria_h: "🧑‍🏫 الحالة 1 · ماريا — مشكلة في الحضور الصفي",
maria_p1: `<p>تُدرّس ماريا <strong>3 مجموعات</strong>، بإجمالي <strong>21 طالبًا</strong>. إليك آخر 30 يومًا لديها.</p>`,
maria_p2: `<p>إذن رقماها هما:</p>`,
maria_aside: `<p><strong>💡 يتم وضع علامة على ماريا بسبب HPR، وليس LPR — وهذه هي الحالة الأكثر شيوعًا.</strong></p>
<p>لم يختفِ أحد. جميع طلابها <em>يحضرون</em>. لكن تسعة منهم يغادرون في المنتصف، لذا عدد قليل جدًا من طلابها حاضرون فعليًا طوال الحصة. في الرقم الواحد القديم، كان هذا غير مرئي: كان أولئك الطلاب التسعة يُحتسبون كأنهم "حضروا".</p>`,

monday_h: "📅 صباح الاثنين — ما يحدث فعليًا",
monday_step1: `<p><strong>1 · تصل رسالة خاصة على Slack.</strong> من فريق تطوير المدرّسين، بلغة ماريا. تبدو هكذا:</p>`,
monday_after_quote: `<p>لا تحتاج ماريا لتسجيل الدخول لتعرف. <strong>المنصة تأتي إليها.</strong></p>`,
monday_step2: `<p><strong>2 · تفتح LMS لرؤية التفاصيل.</strong> على tutors.kodland.org تجد مقياسيها، HPR و LPR مقارنةً بالأهداف، ونفس قائمة المتابعة — ولكن مع مجموعة كل طالب، ونسبة حضوره، ورابط مباشر إلى ملفه في Back Office. هذا هو المكان الذي تذهب إليه عندما تريد معرفة <em>في أي مجموعة</em> تكمن المشكلة.</p>`,
monday_step3: `<p><strong>3 · تلاحظ شيئًا لا يمكن لرسالة Slack إخبارها به.</strong> سبعة من طلابها التسعة الذين يغادرون مبكرًا موجودون في نفس المجموعة — حصتها يوم السبت الساعة 6 مساءً. هذه ليست مشكلة تدريس عامة، بل غرفة واحدة، في وقت واحد، بديناميكية واحدة. الآن تعرف أين توجه اهتمامها.</p>`,
monday_step4: `<p><strong>4 · تُنجز التدريب.</strong> إنه في LMS، مُخصص لها، وقصير. تُنجزه مع اختبار DST خلال الأيام الأربعة وتتلقى رسالة على Slack تؤكد نجاحها.</p>`,
monday_step5: `<p><strong>5 · تُغيّر شيئين في حصصها القادمة.</strong> من التدريب والنصائح الأسبوعية: تبدأ بفتح الحصة بسؤال يجب على كل طالب الإجابة عنه باسمه، وتتوقف عن السماح بضياع الدقائق الخمس الأخيرة — الملخص وعبارة "ما القادم في الحصة التالية" هما ما يُبقي الطلاب في الغرفة حتى النهاية.</p>`,
monday_step6: `<p><strong>6 · بعد أسبوعين أصبح HPR لديها 51%.</strong> تتلقى رسالة على Slack تخبرها بأنها لم تعد مُعلَّمة. لم يُضطر أحد لإجراء محادثة صعبة معها في أي وقت.</p>`,
maria_ifnot: `<p><strong>🤝 وماذا لو لم تتحسن؟</strong> بعد التدريب، إذا ظل المقياس أقل من الهدف، يُطلب من ماريا حجز <strong>جلسة فردية مع موجّهها الإقليمي</strong> — نقرتان، واختيار موعد. تلك المحادثة تتعلق بمجموعاتها الحقيقية، وعلى الأرجح بحصة السبت في السادسة مساءً. ولا يزال لا أحد يتخذ قرارًا بشأنها انطلاقًا من رقم.</p>`,

cases_h: "🧭 حالتان، وعملية واحدة",
cases_intro: `<p>تصلك رسالة عندما يحدث أحد ثلاثة أمور. أن يكون <strong>حضورك الصفي</strong> خارج الهدف — HPR أقل من الهدف أو LPR أعلى منه. أو أن تبدو <strong>حالات الغياب في Back Office</strong> مُقلقة — طالبان أو أكثر لدى كلٍّ منهما غيابان أو أكثر لم يُفسِّرهما أحد، أو، عندما يكون لديك 10 طلاب أو أكثر، أن يحمل أكثر من نصف قائمتك غيابًا واحدًا. أو أن تُفعَّل <strong>حالة عاجلة</strong>: طالب واحد لديه ثلاثة أو أكثر من الغيابات غير المُفسَّرة، أو طالبان لدى كلٍّ منهما أربعة أو أكثر من الغيابات المُفسَّرة — أيًّا كان ما تقوله نسبك.</p><p>ماريا لديها المشكلة الأولى، وماركو لديه الثانية. وما يحدث بعد ذلك هو نفسه في كل الحالات:</p>`,
cases_list: ["<strong>رسالة</strong> — تحمل نصائح عملية <em>و</em> اللوائح المُطبَّقة مرفقةً بها، حتى لا تحتاج أبدًا إلى البحث عن قاعدة.","<strong>تدريب قصير في LMS</strong> — مُخصَّص لك، إضافةً إلى اختبار DST، وأربعة أيام لإكماله.","<strong>جلسة فردية مع موجّهك الإقليمي</strong> — إذا لم يتحرك الرقم بعد كل ذلك."],
cases_aside: `<p><strong>🤝 لا شيء هنا يُقرِّره رقم.</strong> المنصة تُحدِّد أين ننظر أولًا — ثم يتحدث إليك شخص. وإذا بدا شيء في البيانات خاطئًا، فقولُ ذلك مفيد وليس محرجًا.</p>`,
marco_flag: `<p>هذا ما يُطلق رسالته. لا تُرفع العلامة في حضور Back Office بناءً على متوسط، بل بناءً على حالة السجلات: <strong>طالبان أو أكثر لدى كلٍّ منهما غيابان أو أكثر لم يُفسِّرهما أحد</strong>، أو، عندما يكون لديك 10 طلاب أو أكثر، <strong>أن يحمل أكثر من نصف قائمتك غيابًا واحدًا</strong>. وطالبا ماركو، ولدى كلٍّ منهما غيابان غير مُفسَّرين، هما تحديدًا هذه الحالة. الغياب المصحوب بسبب هو موقف تتم إدارته. أمّا الأحمر فهو طالب قد يكون قد رحل بالفعل.</p>`,
marco_week_h: "📅 صباح الاثنين عنده — ما يحدث فعلًا",
marco_s0: `<p><strong>1 · نفس رسالة Slack — واللوائح مرفقة.</strong> ماركو ليس بحاجة إلى البحث عن قاعدة أو تذكّرها. تبدو الرسالة كالتالي:</p>`,
marco_quote: [
 "مرحبًا ماركو 👋",
 "نتواصل معك من قسم تطوير المدرّسين بشأن سجلات الحضور في مجموعاتك. <strong>لدى طالبين من طلابك غيابان لكلٍّ منهما مُعلَّمان باللون 🔴 الأحمر</strong> — مُسجَّلان دون ذكر سبب.",
 "طلاب للمتابعة:<br>🔴 لوكاس ماير — حصتان، لا سبب مُسجَّل<br>🔴 آنا سيلفا — حصتان، لا سبب مُسجَّل",
 "خصّصنا لك تدريبًا قصيرًا للمساعدة: <em>التعامل مع الغياب</em> — [رابط]. يُرجى إكماله مع اختبار DST خلال الأيام الأربعة القادمة.",
 "قواعد الغياب الأحمر والأصفر مرفقة بهذه الرسالة — ماذا تفعل، وبأي ترتيب، وماذا تُسجِّل.",
 "موجّهك الإقليمي متاح دائمًا للمساعدة.",
],
marco_s1: `<p><strong>2 · يفتح LMS ليعرف مَن وأين.</strong> نفس قائمة المتابعة التي تراها ماريا، لكن قائمته تُظهر الطالبين، ومجموعتيهما، ورابطًا مباشرًا إلى ملف كلٍّ منهما في Back Office.</p>`,
marco_s2: `<p><strong>3 · يُراسل العائلتين في اليوم نفسه.</strong> التسجيل، وملخّص قصير لما فاتهما، وسؤال واحد: ماذا حدث؟ الغياب الذي لا يلتفت إليه أحد أكثر عرضةً بكثير لأن يتحول إلى غياب ثانٍ.</p>`,
marco_s3: `<p><strong>4 · يُسجِّل ما قيل له.</strong> يتحول 🔴 الأحمر إلى 🟡 أصفر مع إضافة السبب — أحدهما كان أسبوع اختبارات، والآخر حاسوبًا معطلًا. لا ينبغي أن يبقى غياب أحمر دون تفسير أكثر من 48 ساعة.</p>`,
marco_s4: `<p><strong>5 · يسأل قبل أن يَعِد بأي شيء إضافي.</strong> أحد الطالبين تأخّر عن المستوى، فيطرح ماركو الأمر على TL الخاص به — الحصة الإضافية أو التحفيزية قراره هو، وليست شيئًا يُعرض على العائلة مباشرةً. وفي الأثناء، "دعني أتحقق من ذلك" جواب كامل.</p>`,
marco_s5: `<p><strong>6 · في الأسبوع التالي تصبح سجلاته نظيفة</strong>، وتُخبره رسالة على Slack أنه لم يعد مُعلَّمًا. وكما مع ماريا، لم يُجرِ معه أحد محادثة صعبة في أي لحظة.</p>`,
marco_ifnot: `<p><strong>🤝 وماذا لو استمر الغياب؟</strong> تمامًا كما مع ماريا: إذا لم تتحسن الصورة بعد التدريب، يُطلب من ماركو حجز <strong>جلسة فردية مع موجّهه الإقليمي</strong> — نقرتان، واختيار موعد. نفس العملية، وموضوع مختلف: موضوعها هو كيف تُدار الحصة، وموضوعه هو ما يحدث بين الحصص.</p>`,
marco_h: "🔄 الحالة 2 · ماركو — مشكلة في حضور Back Office",
marco_p1: `<p>ماركو يُدرِّس أيضًا 3 مجموعات. الطلاب الذين يحضرون موجودون بالكامل — نسبة HPR لديه 61%، أعلى من الهدف بفارق مريح، أي أن لا شيء في حضوره الصفي مُعلَّم. مشكلته في المقياس الآخر: <strong>طالبان من طلابه لم يحضرا الحصتين الأخيرتين ولم يُبلغاه أبدًا.</strong> كلا الغيابين مُسجَّل 🔴 أحمر — لا أحد يعرف السبب.</p>`,
marco_aside: `<p><strong>🎯 نفس المقياس، مشكلتان متعاكستان.</strong> عمل ماريا <em>داخل</em> الحصة. عمل ماركو <em>خارجها</em>. لهذا السبب بالضبط قسّمنا الحضور إلى مقياسين — حتى تتطابق المساعدة التي تحصل عليها مع المشكلة التي تواجهها فعليًا.</p>`,

s5_h: "📅 5 · كيف يبدو أسبوع عادي",
s5_p1: `<p>أنت الآن تعرف ما هي المنصة وماذا تعني الأرقام. إليك كامل التسلسل في مكان واحد.</p>`,
s5_flow_h: "🧭 التسلسل، باختصار",
s5_when_h: "❓ متى بالضبط سيتم وضع علامة عليّ، ولماذا؟",
s5_when_p: `<p>ثلاث حالات، لا غير:</p>`,
s5_when_aside: `<p><strong>🙋 وماذا أحتاج أن أفعل؟</strong> ثلاثة أشياء، في كل مرة.</p>
<ol class="list">
<li>اقرأ الرسالة؛ فهي تذكر المقياس والطلاب والموعد النهائي.</li>
<li>أكمل التدريب واختبار DST خلال 4 أيام. إنها قصيرة بقصدٍ منّا.</li>
<li>امنح أولئك الطلاب طريقة للمشاركة في حصصك القادمة. التدريب والنصائح تخبرك كيف — هذا هو الجزء الذي يُحرّك الرقم فعليًا.</li>
</ol>`,

s5_arrive_h: "📨 وهكذا يصلك",
s5_three_aside: `<p><strong>🙌 ثلاثة أشياء نطلبها منك</strong></p>
<ol class="list">
<li>اقرأ الرسالة عند وصولها.</li>
<li>تصرف بناءً عليها — إذا خُصص تدريب، أكمله مع DST خلال 4 أيام.</li>
<li>اسأل إذا كان هناك ما هو غير واضح. هذا بالضبط سبب وجود موجّهك الإقليمي.</li>
</ol>`,

s5_msg_h: "📲 وصلتني رسالة للتو. ماذا أفعل؟",
s5_msg_p: `<p>يصلك كل شيء كـ <strong>رسالة خاصة على Slack من فريق تطوير المدرّسين</strong>. هناك خمسة أنواع فقط، ولا يحتاج أي منها إلى رد طويل.</p>`,
s5_msg_aside: `<p><strong>🤖 تُرسَل هذه الرسائل تلقائيًا</strong>، لذا الرد على الرسالة لا يصل إلى شخص. إذا أردت قول شيء، راسل <strong>موجّهك الإقليمي</strong> مباشرة — أو انشره في القناة أدناه، وهو ما يكون عادةً أسرع.</p>`,

s5_feedback_h: "🛠 هل يبدو شيء ما خاطئًا؟ هناك مكان واحد لقول ذلك",
feedback_aside: `<p><strong>📣 انشره في #lms-feedback-tts.</strong></p>
<p>وليس رسالة خاصة لمن تعرفه، ولا مدفونة في قناة المدرّسين الخاصة بك. قناة واحدة تعني أننا نرى كل تقرير، ونصلح الأمور مرة واحدة بدلًا من تسع مرات، ويمكنك أن ترى أن أحدًا قد التقط الأمر.</p>
<p>يستحق النشر:</p>
<ul>
<li>🔢 رقم يبدو خاطئًا — طالب مُسجَّل كغائب بينما كان بوضوح في الغرفة، نسبة مئوية لا تتطابق مع ما رأيته</li>
<li>🔗 رابط معطل، أو تدريب لا يتطابق مع المشكلة الموصوفة في الرسالة</li>
<li>🌐 رسالة باللغة الخاطئة، أو تسمي طالبًا ليس من طلابك</li>
<li>🔑 بيانات اعتماد لا تجدها في Bitwarden بعد أن بدأت الرسائل</li>
<li>😵 أي شيء مربك أو معطل أو بطيء — وأي شيء تتمنى أن يفعله ولا يفعله</li>
</ul>
<p><strong>هذا ليس تذمرًا ولا يُحتسب ضدك.</strong> في الأسابيع الأولى خاصة، أنتم الوحيدون القادرون على رؤية ما إذا كان هذا يعمل فعلًا. تقرير يوفر على المدرّس التالي نفس الارتباك أثمن لنا بكثير من صمت مهذب.</p>`,

s5_mentor_h: "🌍 موجّهك الإقليمي",
mentor_p: `<p>هذا هو الشخص المذكور اسمه في كل رسالة تتلقاها منّا — والإنسان الذي ستتحدث معه فعليًا. لست بحاجة لانتظار وضع علامة عليك للتواصل معه.</p>`,

s6_h: "🙅 6 · ما ليس عليه هذا النظام",
s6_p1: `<p>قبل أن تسجل دخولك لأول مرة، دعونا نكون صريحين بشأن ما يقلق الناس.</p>`,
s6_aside: `<p><strong>⚖️</strong> وحيثما كانت البيانات خاطئة فعلًا — طالب مُسجَّل كغائب بينما كان بوضوح في الغرفة، عطل في المنصة — <strong>أخبرنا في #lms-feedback-tts</strong>. تلك الحالات مرئية لنا أيضًا، والإبلاغ عنها يحمي كلًا منك ومن الطالب.</p>`,

s7_h: "🔮 7 · ما القادم",
s7_p1: `<p>الحضور هو المقياس الأول، وليس الأخير.</p>`,
s7_aside: `<p><strong>🛠 هذه هي النسخة الأولى</strong>، ونعتزم مواصلة بنائها معك. إذا كان هناك شيء مربك أو ناقص أو خاطئ، قله — تلك الملاحظات هي كيفية كتابة النسخة القادمة.</p>`,

s8_h: "🔐 8 · الحصول على الوصول",
s8_aside: `<p><strong>🔑 بيانات اعتمادك في طريقها إلى Bitwarden</strong> — وستكون هناك خلال يومين تقريبًا.</p>
<p>يحتوي LMS على <strong>بيانات شخصية</strong> عنك وعن طلابك، لذا يكون الوصول فرديًا وباسم كل مستخدم: لا تسجيل دخول مشترك، لا حساب تجريبي، لا استثناءات.</p>
<p><strong>كيف ستدخل:</strong> نقوم بإضافة بيانات اعتماد LMS الخاصة بك إلى <strong>Bitwarden</strong>، نفس المكان الذي تحتفظ فيه بالفعل ببيانات تسجيل الدخول الأخرى لعملك. لا حاجة إلى تقديم أي طلب ولا إلى ملاحقة أحد — ستظهر ببساطة هناك.</p>
<p><strong>التوقيت متزامن عمدًا.</strong> تدخل بيانات الاعتماد إلى Bitwarden خلال الأيام القليلة القادمة، وهذا أيضًا الوقت الذي نُفعّل فيه الرسائل الآلية. لذا بحلول وصول أول رسالة على Slack إليك، ستتمكن من فتح <strong>tutors.kodland.org</strong> ورؤية التفاصيل وراءها.</p>
<p>إذا بدأت الرسائل ولا تزال غير قادر على إيجاد بيانات اعتماد LMS في Bitwarden الخاص بك — انشره في <strong>#lms-feedback-tts</strong> وسنحل الأمر في نفس اليوم.</p>`,

s9_h: "❓ 9 · الأسئلة الشائعة",
faq1_q: `<p><strong><em>"لدي الكثير من المجموعات. هل من المفترض أن أفعل كل هذا في كل مكان؟"</em></strong></p>`,
faq1_a: `<p>لا. ابنِ روتينًا <strong>واحدًا</strong> للافتتاح وآخر للختام يعملان في كل مجموعة، واستخدمهما بشكل متطابق. إذا كان عبء العمل نفسه هو المشكلة، فقل ذلك — تلك محادثة جدولة مع Teaching Ops، وليست شيئًا يُحل بجهد إضافي.</p>`,
faq2_q: `<p><strong><em>"طلابي ببساطة لا يفتحون الكاميرا. هل هذا يؤثر على درجتي؟"</em></strong></p>`,
faq2_a: `<p>لا — الحضور الصفي يتعلق <strong>بالوقت داخل الغرفة</strong>، وليس بالكاميرات. الكاميرات والمحادثة والمشاركة تنتمي إلى مقياس مختلف سيصل لاحقًا هذا الربع، وحتى هناك، الكاميرا مجرد إشارة واحدة من عدة إشارات.</p>`,
faq3_q: `<p><strong><em>"طالب لديه مشاكل في الاتصال ويستمر بالانقطاع. هل هذا يُحتسب ضدي؟"</em></strong></p>`,
faq3_a: `<p>حالات إعادة الاتصال المتكررة وأعطال المنصة مرئية في البيانات ولا تُفسَّر على أنها من فعلك. أبلغ عنها على أي حال — هذا يحميك ويساعد الطالب.</p>`,
faq4_q: `<p><strong><em>"إحدى مجموعاتي أصعب بكثير من الأخريات."</em></strong></p>`,
faq4_a: `<p>تُحسَب أرقامك لكل مجموعة ولكل دورة، لذا لا تختبئ المجموعة الصعبة خلف متوسط — ولا تسحب كل شيء آخر للأسفل أيضًا. السؤال المفيد عادةً هو <em>لماذا تتصرف غرفة معينة بشكل مختلف عن غيرها</em>، وهذا شيء جيد لتطرحه في جلسة توجيه.</p>`,
faq5_q: `<p><strong><em>"ما هو الشيء الأسرع الوحيد الذي يمكنني تغييره؟"</em></strong></p>`,
faq5_body: `<p>شيئان، ولا يكلفان شيئًا للتحضير:</p>
<ul>
<li>كن في الغرفة قبل طلابك — حتى ولو بدقيقة واحدة.</li>
<li>افتتح بسؤال يجب على كل طالب الإجابة عنه باسمه، بلا إجابة خاطئة. "كلمة واحدة: ماذا بنيت الأسبوع الماضي؟" أدر الغرفة بأكملها قبل مشاركة شاشتك.</li>
</ul>
<p>هذان الأمران يُحرّكان أكثر من أي شيء آخر في هذه الصفحة.</p>`,
faq6_q: `<p><strong><em>"غاب طالب عن حصتين متتاليتين. ماذا أفعل؟"</em></strong></p>`,

s2_p1: `<p><strong>Потому что вы просили. Многократно, на встречах тьюторов, годами.</strong></p>`,
s2_p2: `<p>До сих пор, когда одна из ваших групп начинала сбиваться с курса — ученик становился молчаливым, другой пропускал занятия — заметить это в основном приходилось вам самим. А когда поддержка приходила, часто оказывалось, что прошло уже несколько недель. Не потому, что никому не было дела: информация была разбросана по местам, которые никто не мог прочитать вместе, и не было процесса, чтобы превратить её в помощь.</p>
<p>К моменту, когда семья отменяет занятия, причина обычно уже <strong>неделями</strong> видна в классе. Теперь она видна и нам — и в первую очередь вам.</p>`,
s2_idea: `<p><strong>🎯 Вся идея в одной строке:</strong> вы узнаёте об этом за неделю вместо месяца — и получаете помощь, пока проблему ещё можно решить.</p>`,

s3_h: "🧰 3 · Так что же внутри на самом деле?",
s3_intro: `<p>Пять вещей. Вот каждая из них и что она делает для вас.</p>`,
s3_metrics_h: "📊 Ваши метрики",
s3_metrics_p: `<p>Как идут дела в ваших группах, в одном месте — обновляется еженедельно, видно вам в первую очередь. Больше не нужно догадываться, как у вас дела, и ждать встречи, чтобы это узнать.</p>`,
img_metrics: "Ваша страница метрик — ваши собственные цифры, обновляются каждую неделю.",
s3_watch_h: "👥 Ваш список наблюдения за учениками",
s3_watch_p: `<p><strong>Имена</strong> учеников из ваших групп, которым нужно дополнительное внимание на этой неделе, и <em>почему</em> каждый из них в списке. Это та часть, которая, по словам тьюторов, меняет больше всего: список имён — это то, на основе чего вы можете действовать на следующем занятии. Процент — нет.</p>`,
s3_watch_aside: `<p><strong>💡 Все имена кликабельны</strong> и перенаправляют вас на профиль ученика в Back Office.</p>`,
img_watch: "Список наблюдения за учениками с именами и статусами.",
s3_train_h: "🎓 Обучение и DST",
s3_train_p: `<p>Короткие, точечные обучающие материалы — не общие курсы. Когда что-то в ваших данных требует внимания, вы получаете конкретное обучение, которое помогает <em>именно с этим</em>, плюс <strong>Diagnostic Skill Test (DST)</strong>, чтобы проверить, усвоилось ли это. Оба можно пройти за один раз.</p>`,
img_train: "Страница обучения + DST.",
s3_coach_h: "🤝 Сессии коучинга 1:1",
s3_coach_p: `<p>Забронируйте время со своим региональным ментором в два клика — выберите время, скажите, о чём хотите поговорить, готово. Настоящий разговор о ваших реальных группах, а не общий обзор.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Вы можете запросить сессию в любой момент; не нужно ждать, пока вас пометят.</p>`,
img_coach: "Процесс бронирования коучинга.",
s3_new_h: "🚀 Новые курсы для преподавания",
s3_new_p: `<p>Обучение и тесты для <strong>внутреннего найма</strong>. Хотите преподавать что-то новое? Материалы доступны, и дверь открыта — рост здесь больше не зависит от того, заметит ли кто-то, что вы готовы.</p>`,
img_new: "Раздел внутреннего найма / доступных курсов.",
s3_slack: `<p><strong>💬 И вам не нужно помнить о входе в систему.</strong> Всё приходит к вам через <strong>Slack</strong>, на вашем языке — еженедельный список наблюдения, назначенное обучение, подтверждение коучинга. Платформа — это место, куда вы заходите, когда хотите разобраться подробнее.</p>`,

s4_h: "🙋 4 · Первая метрика: Посещаемость",
s4_p1: `<p>Теперь самая важная часть, потому что именно она запускается первой.</p>`,
s4_p2: `<p><strong>Мы намеренно начинаем с одной метрики, сделанной правильно.</strong> И теперь эта метрика отвечает на два вопроса вместо одного — потому что ученик может отсутствовать на занятии или присутствовать, но мысленно отсутствовать, а это совершенно разные проблемы.</p>`,

s4_absence_h: "🟡🔴 Как фиксируется Посещаемость в Back Office: два типа отсутствия",
s4_absence_p: `<p>Мы извлекаем данные об отсутствиях и их типах из того, что вы вводите вручную.</p>`,
s4_yellow: `<p><strong>🟡 Жёлтый — семья вас предупредила.</strong> Кто-то дал вам знать. Семья, у которой что-то случилось, ученик с экзаменом, сломанный ноутбук. Вы выбираете жёлтый <strong>и указываете причину, которую вам назвали</strong>. Эти двенадцать вариантов — не бумажная волокита. Это единственный способ, которым мы узнаём, <strong>какие отсутствия мы могли бы предотвратить со своей стороны.</strong> Выбирайте ближайший вариант честно. Пять секунд с вашей стороны — и закономерность, на основе которой мы можем реально действовать.</p><p>Доступные жёлтые причины:</p>`,
s4_red: `<p><strong>🔴 Красный — никто вам ничего не сказал.</strong> Ученик просто не появился, и никто не сказал почему. Выбирайте красный <strong>только</strong> в этом случае. Красный — это не более строгая метка для того же самого — <strong>это означает, что мы не знаем, что произошло.</strong> Именно это делает его самым опасным статусом на всей странице: отсутствие с причиной — это управляемая ситуация, тогда как отсутствие без причины — это ученик, который, возможно, уже ушёл, а помочь тому, чья проблема невидима, никто не может.</p>`,
s4_red_aside: `<p><strong>💡 Красный — это не приговор, а «пока неизвестно».</strong></p>
<p>Если вы отметили ученика красным, а семья потом объяснила причину, <strong>измените на жёлтый и добавьте причину</strong>. Это не исправление ошибки; это работающий процесс: вы связались, получили ответ, и запись теперь отражает реальность.</p>
<p>Это также самое быстрое, что вы можете сделать для своих собственных показателей. Необъяснённое отсутствие, которое остаётся необъяснённым, засчитывается против вашей посещаемости. То же самое отсутствие, после того как вы поговорили с семьёй и записали причину, не засчитывается.</p>`,

s4_presence_h: "🧮 Как рассчитывается Присутствие в классе",
s4_presence_p: `<p>Никакого чёрного ящика. Три шага.</p>`,
presence_why: `<p><strong>Почему мы это измеряем.</strong> Показывает, какую часть занятия ученик действительно присутствует &mdash; и это тесно связано с удержанием. Ученик, который подключается и отдаляется, идёт к уходу задолго до того, как это станет видно в посещаемости.</p>`,
step1: `<p><strong>1 &middot; Для каждого занятия мы суммируем всё время, когда ученик был подключён.</strong></p>`,
step1b: `<p>Присутствие в классе &mdash; это <strong>сумма всех отрезков между подключением и отключением ученика</strong>. Если связь оборвалась и ученик вернулся, отрезки складываются &mdash; само переподключение ничего не стоит.</p>`,
step2: `<p><strong>2 &middot; Эту сумму мы делим на запланированную длительность занятия.</strong></p>`,
step2b: `<p>Два разобранных примера:</p>`,
presence_examples: [
 "<strong>Занятие 19:00 &ndash; 20:00.</strong> Ученик подключается в 19:00 и отключается в 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Занятие 19:00 &ndash; 20:00.</strong> Ученик подключается в 19:00 и отключается в 19:20; решив проблему с компьютером или связью, он возвращается в 19:40 и остаётся ещё 20 минут. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; Присутствие в классе ученика &mdash; это среднее по его занятиям за последние 30 дней</strong> &mdash; считается <strong>по группе и по курсу</strong>, поэтому ученик, который занимается у вас на двух курсах, измеряется в каждом отдельно. Окно скользящее, а числа обновляются <strong>каждый понедельник</strong>.</p>`,
exclude_intro: `<p>Что исключается и почему:</p>`,
presence_note: `<p><strong>👀 Стоит знать:</strong> Присутствие в классе измеряет <strong>время в комнате</strong> — и ничего больше. Речь не о вашей камере, вашем чате или о том, кто больше говорит. Эти сигналы относятся к другой метрике, которая появится позже в этом квартале, и мы объясним её так же открыто.</p>`,

presence_reliability: `<p><strong>🔧 Если число выглядит неверным, скажите нам.</strong> Напишите в канал <strong>#lms-feedback-tts</strong>, приложите скриншот и краткое описание проблемы и отметьте своего регионального ментора.</p>`,
s4_risk_h: "🚦 Ваши два сигнала",
risk_p1: `<p>У каждого ученика <strong>две категории</strong> &mdash; одна из Присутствия в классе, другая из посещаемости в Back Office. Ваши списки показывают <strong>худшую из двух</strong>, чтобы никто не выпал из внимания, когда они расходятся.</p>`,
alert_warning: `<p><strong>⚠️ Одно слово, два значения &mdash; читайте метку вместе с её сигналом.</strong> <strong>ALERT</strong> на стороне Присутствия в классе означает присутствие ниже 50%. <strong>Alert</strong> на стороне Back Office означает 2&ndash;3 объяснённых отсутствия. Это разные сигналы разной тяжести &mdash; поэтому всегда называйте сигнал: <em>ALERT (присутствие)</em>, <em>Alert (отсутствия)</em>. То же советуем при обсуждении ученика с ментором. Названия групп в LMS показываются по-английски, поэтому и здесь мы оставляем их по-английски.</p>`,
risk_p2: `<p>Читайте их как <strong>альтернативы, а не условия</strong>: ученика определяет <em>либо</em> отсутствия, <em>либо</em> присутствие &mdash; то, что хуже. Ученик без единого отсутствия может попасть в 🟠 RISK только из-за присутствия, если он в комнате всего 60% занятия, а ученик с идеальным присутствием может попасть в 🔴 Critical из-за одного необъяснённого отсутствия.</p>`,
risk_p3: `<p>Для каждого отмеченного ученика вы также видите <strong>причину</strong> каждого жёлтого отсутствия &mdash; одну из двенадцати, перечисленных выше &mdash; так что гадать не нужно.</p>`,
s4_hpr_h: "📈 HPR и LPR — два числа на вашей карточке",
hpr_intro: `<p>Они измеряются на основе <strong>Присутствия в классе</strong>:</p>`,
bar_p: `<p>Планка, которую мы держим во всех регионах: <strong>LPR на уровне или ниже 25,5%</strong> · <strong>HPR на уровне или выше 49,5%</strong>.</p>`,
target_aside: `<p><strong>📌 Это глобальные цели на квартал запуска.</strong> Региональные цели согласовываются с каждым Head of Teaching, и ваша карточка в LMS всегда показывает ту, что применима к вам — так что доверяйте карточке больше, чем любому числу, записанному где-либо ещё.</p>`,
goal_aside: `<p><strong>🎯 В Присутствии в классе цель числовая:</strong> поднять HPR, снизить LPR.</p>
<p><strong>В Посещаемости Back Office цель — это два результата, без показателя:</strong></p>
<ul>
<li>🔴 <strong>Устранить необъяснённые отсутствия.</strong> Красное отсутствие означает, что ученик исчез, а никто не выяснил, что случилось. Это должно стать невозможным.</li>
<li>🟡 <strong>Устранить отток, который начинается со второго оправданного отсутствия.</strong> Два жёлтых — это момент, когда ученик начинает отдаляться <em>и</em> его ещё можно вернуть. После этого шансы быстро падают.</li>
</ul>
<p><strong>Ни один ученик не должен тихо исчезнуть, и ни один не должен быть потерян из-за двух отсутствий, на которые никто не отреагировал.</strong></p>`,

s4_payoff_h: "🧭 И вот практическая польза",
payoff_p1: `<p>Два показателя указывают на разные проблемы с разными решениями. Вот почему мы их разделили:</p>`,
payoff_p2: `<p>Тот же самый единый процент, что был у вас раньше, скрывает внутри себя два совершенно разных плана действий.</p>`,

maria_h: "🧑‍🏫 Случай 1 · Мария — проблема с Присутствием в классе",
maria_p1: `<p>Мария преподаёт в <strong>3 группах</strong>, всего <strong>21 ученик</strong>. Вот её последние 30 дней.</p>`,
maria_p2: `<p>Итак, её два числа:</p>`,
maria_aside: `<p><strong>💡 Марию отмечают по HPR, а не по LPR — и это самый распространённый случай.</strong></p>
<p>Никто не исчез. Все её ученики <em>приходят</em>. Но девять из них уходят на середине, поэтому слишком мало её учеников по-настоящему присутствуют на протяжении всего занятия. При старом едином числе это было невидимо: эти девять учеников засчитывались как «посетившие».</p>`,

monday_h: "📅 Утро понедельника — что происходит на самом деле",
monday_step1: `<p><strong>1 · Приходит личное сообщение в Slack.</strong> От Tutor Development, на языке Марии. Оно выглядит так:</p>`,
monday_after_quote: `<p>Марии не нужно входить в систему, чтобы узнать. <strong>Платформа приходит к ней сама.</strong></p>`,
monday_step2: `<p><strong>2 · Она открывает LMS, чтобы увидеть детали.</strong> На tutors.kodland.org она находит свои два показателя, свой HPR и LPR относительно целей, и тот же список наблюдения — но с группой каждого ученика, процентом его присутствия и прямой ссылкой на его профиль в Back Office. Именно туда она идёт, когда хочет узнать, <em>в какой группе</em> находится проблема.</p>`,
monday_step3: `<p><strong>3 · Она замечает то, о чём сообщение в Slack не может ей сказать.</strong> Семь из девяти её учеников, уходящих рано, находятся в одной группе — её субботнем классе в 18:00. Это не общая проблема преподавания, это одна комната, в одно время, с одной динамикой. Теперь она знает, куда направить усилия.</p>`,
monday_step4: `<p><strong>4 · Она проходит обучение.</strong> Оно в LMS, назначено ей, короткое. Она завершает его вместе с DST в течение четырёх дней и получает сообщение в Slack с подтверждением, что она справилась.</p>`,
monday_step5: `<p><strong>5 · Она меняет две вещи на следующих занятиях.</strong> Из обучения и еженедельных советов: она начинает открывать занятие вопросом, на который каждый ученик должен ответить по имени, и больше не даёт последним пяти минутам занятия уходить впустую — резюме и фраза «что нас ждёт на следующем занятии» — это то, что удерживает учеников в комнате до конца.</p>`,
monday_step6: `<p><strong>6 · Через две недели её HPR составляет 51%.</strong> Она получает сообщение в Slack, сообщающее, что она больше не отмечена. Ни разу никому не пришлось вести с ней сложный разговор.</p>`,
maria_ifnot: `<p><strong>🤝 А если бы не улучшилось?</strong> После обучения, если показатель всё ещё ниже цели, Марию просят забронировать <strong>сессию 1:1 со своим региональным ментором</strong> — два клика, выберите время. Этот разговор — о её настоящих группах, скорее всего о той субботней группе в 18:00. И по-прежнему никто не решает ничего о ней исходя из цифры.</p>`,

cases_h: "🧭 Два случая, один процесс",
cases_intro: `<p>Сообщение приходит к вам, когда происходит одно из трёх. Ваше <strong>Присутствие в классе</strong> вне цели — HPR ниже цели или LPR выше неё. Ваши <strong>отсутствия в Back Office</strong> выглядят проблемными — двое или более учеников, у каждого из которых два или более отсутствия, никем не объяснённых, либо, когда у вас уже 10 или более учеников, более половины вашего списка с одним таким отсутствием. Либо срабатывает <strong>срочный случай</strong>: один ученик с тремя или более необъяснёнными отсутствиями, или двое учеников с четырьмя и более объяснёнными — независимо от того, что говорят ваши показатели.</p><p>У Марии первая проблема, у Марко — вторая. То, что происходит дальше, одинаково во всех случаях:</p>`,
cases_list: ["<strong>Сообщение</strong> — с практическими советами <em>и</em> приложенными регламентами, чтобы вам никогда не приходилось искать правило.","<strong>Короткое обучение в LMS</strong> — назначенное вам, плюс DST, четыре дня на выполнение.","<strong>Сессия 1:1 с вашим региональным ментором</strong> — если после этого показатель так и не сдвинулся."],
cases_aside: `<p><strong>🤝 Ничто здесь не решается цифрой.</strong> Платформа определяет, куда мы смотрим в первую очередь — а дальше с вами говорит человек. Если что-то в данных выглядит неверно, сказать об этом полезно, а не неловко.</p>`,
marco_flag: `<p>Именно это запускает его сообщение. Посещаемость в Back Office отмечается не по среднему значению, а по состоянию записей: <strong>двое или более учеников, у каждого из которых два или более отсутствия, никем не объяснённых</strong>, либо, когда у вас уже 10 или более учеников, <strong>более половины вашего списка с одним таким отсутствием</strong>. Двое учеников Марко, у каждого по два необъяснённых отсутствия, — это ровно тот случай. Отсутствие с причиной — это управляемая ситуация. Красное — это ученик, который, возможно, уже ушёл.</p>`,
marco_week_h: "📅 Его утро понедельника — что действительно происходит",
marco_s0: `<p><strong>1 · То же сообщение в Slack — с приложенными правилами.</strong> Марко не нужно ничего искать или помнить наизусть. Выглядит оно так:</p>`,
marco_quote: [
 "Привет, Марко 👋",
 "Мы пишем из отдела Tutor Development по поводу записей посещаемости в ваших группах. <strong>У двух ваших учеников по два отсутствия, отмеченных 🔴 красным</strong> — записаны без указания причины.",
 "Ученики, с которыми нужно связаться:<br>🔴 Лукас Майер — 2 занятия, причина не записана<br>🔴 Ана Силва — 2 занятия, причина не записана",
 "Мы назначили короткое обучение, которое поможет: <em>Работа с отсутствиями</em> — [ссылка]. Пожалуйста, пройдите его вместе с DST в течение следующих 4 дней.",
 "Правила по красным и жёлтым отсутствиям приложены к этому сообщению — что делать, в каком порядке и что записать.",
 "Ваш региональный ментор всегда готов помочь.",
],
marco_s1: `<p><strong>2 · Он открывает LMS, чтобы увидеть кого и где.</strong> Тот же список наблюдения, что видит Мария, но у него он показывает двух учеников, их группы и прямую ссылку на профиль каждого в Back Office.</p>`,
marco_s2: `<p><strong>3 · В тот же день он пишет обеим семьям.</strong> Запись занятия, короткое резюме пропущенного и один вопрос: что случилось? Отсутствие, которое никто не заметил, гораздо вероятнее превратится во второе.</p>`,
marco_s3: `<p><strong>4 · Он записывает то, что ему сказали.</strong> 🔴 красное становится 🟡 жёлтым с указанной причиной — в одном случае неделя экзаменов, в другом сломанный ноутбук. Красное отсутствие не должно оставаться без объяснения дольше 48 часов.</p>`,
marco_s4: `<p><strong>5 · Он спрашивает, прежде чем что-то обещать.</strong> Один из двоих отстал, поэтому Марко обсуждает это со своим TL: решение о дополнительном или мотивационном занятии — за ними, и семье его никогда не предлагают напрямую. А пока «дайте я уточню» — это полный ответ.</p>`,
marco_s5: `<p><strong>6 · На следующей неделе его записи чисты</strong>, и сообщение в Slack говорит ему, что он больше не отмечен. Как и с Марией, ни в один момент никто не вёл с ним трудный разговор.</p>`,
marco_ifnot: `<p><strong>🤝 А если отсутствия продолжались бы?</strong> Точно так же, как с Марией: если после обучения картина не улучшилась, Марко просят забронировать <strong>сессию 1:1 со своим региональным ментором</strong> — два клика, выберите время. Тот же процесс, другая тема: у неё — как вести занятие, у него — что происходит между занятиями.</p>`,
marco_h: "🔄 Случай 2 · Марко — проблема с Посещаемостью в Back Office",
marco_p1: `<p>Марко тоже ведёт 3 группы. Ученики, которые приходят, присутствуют полностью — его HPR составляет 61%, спокойно выше цели, так что в его Присутствии в классе ничего не отмечено. Его проблема в другом показателе: <strong>двое его учеников не пришли на последние два занятия и ничего ему не сказали.</strong> Оба стоят в записи как 🔴 красные — никто не знает почему.</p>`,
marco_aside: `<p><strong>🎯 Одна и та же метрика, две противоположные проблемы.</strong> Работа Марии — <em>внутри</em> занятия. Работа Марко — <em>вне</em> его. Именно поэтому мы разделили посещаемость на два показателя — чтобы получаемая вами помощь соответствовала той проблеме, что у вас реально есть.</p>`,

s5_h: "📅 5 · Как выглядит обычная неделя",
s5_p1: `<p>Теперь вы знаете, что такое платформа и что означают цифры. Вот весь процесс в одном месте.</p>`,
s5_flow_h: "🧭 Процесс вкратце",
s5_when_h: "❓ Когда именно меня отметят и почему?",
s5_when_p: `<p>Три ситуации, и ничего больше:</p>`,
s5_when_aside: `<p><strong>🙋 А что мне нужно делать?</strong> Три вещи, каждый раз.</p>
<ol class="list">
<li>Прочитайте сообщение. В нём указаны метрика, ученики и срок.</li>
<li>Завершите обучение и DST в течение 4 дней. Они короткие по замыслу.</li>
<li>Дайте этим ученикам возможность включиться на ваших следующих занятиях. Обучение и советы подскажут как — это та часть, которая реально сдвигает показатель.</li>
</ol>`,

s5_arrive_h: "📨 И вот как это к вам приходит",
s5_three_aside: `<p><strong>🙌 Три вещи, о которых мы просим</strong></p>
<ol class="list">
<li>Читайте сообщение, когда оно приходит.</li>
<li>Действуйте на его основе — если назначено обучение, завершите его с DST в течение 4 дней.</li>
<li>Спрашивайте, если что-то непонятно. Именно для этого и существует ваш региональный ментор.</li>
</ol>`,

s5_msg_h: "📲 Только что пришло сообщение. Что делать?",
s5_msg_p: `<p>Всё приходит к вам как <strong>личное сообщение в Slack от Tutor Development</strong>. Есть всего пять типов, и ни один не требует длинного ответа.</p>`,
s5_msg_aside: `<p><strong>🤖 Эти сообщения отправляются автоматически</strong>, поэтому ответ на сообщение не доходит до человека. Если хотите что-то сказать, напишите напрямую своему <strong>региональному ментору</strong> — или опубликуйте в канале ниже, что обычно быстрее.</p>`,

s5_feedback_h: "🛠 Что-то выглядит неправильно? Есть одно место, чтобы сообщить об этом",
feedback_aside: `<p><strong>📣 Опубликуйте в #lms-feedback-tts.</strong></p>
<p>Не личное сообщение кому-то знакомому, и не потерянное в вашем канале тьюторов. Один канал означает, что мы видим каждое сообщение, исправляем вещи один раз вместо девяти, и вы можете видеть, что кто-то это заметил.</p>
<p>Стоит публиковать:</p>
<ul>
<li>🔢 Число, которое выглядит неправильно — ученик, отмеченный как отсутствующий, хотя явно был в комнате, процент, не совпадающий с тем, что вы видели</li>
<li>🔗 Неработающую ссылку или обучение, не соответствующее проблеме, описанной в сообщении</li>
<li>🌐 Сообщение на неправильном языке или называющее ученика, который не ваш</li>
<li>🔑 Учётные данные, которые вы не можете найти в Bitwarden после того, как сообщения уже начались</li>
<li>😵 Всё, что сбивает с толку, сломано или медленно работает — и всё, что вы хотели бы видеть, но чего нет</li>
</ul>
<p><strong>Это не жалоба, и это не засчитывается против вас.</strong> Особенно в первые недели вы — единственные, кто может увидеть, работает ли это на самом деле. Сообщение, которое избавит следующего тьютора от той же путаницы, стоит для нас гораздо больше, чем вежливое молчание.</p>`,

s5_mentor_h: "🌍 Ваш региональный ментор",
mentor_p: `<p>Это человек, указанный в каждом сообщении, которое вы получаете от нас, — и тот, с кем вы действительно будете разговаривать. Вам не нужно ждать, пока вас отметят, чтобы обратиться к нему.</p>`,

s6_h: "🙅 6 · Чем это не является",
s6_p1: `<p>Прежде чем вы впервые войдёте в систему, давайте прямо поговорим о том, что беспокоит людей.</p>`,
s6_aside: `<p><strong>⚖️</strong> И там, где данные действительно неверны — ученик, отмеченный как отсутствующий, хотя явно был в комнате, сбой платформы — <strong>сообщите нам в #lms-feedback-tts</strong>. Такие случаи видны и нам тоже, и сообщение о них защищает и вас, и ученика.</p>`,

s7_h: "🔮 7 · Что дальше",
s7_p1: `<p>Посещаемость — это первая метрика, а не последняя.</p>`,
s7_aside: `<p><strong>🛠 Это первая версия</strong>, и мы намерены продолжать строить её вместе с вами. Если что-то непонятно, отсутствует или неверно, скажите об этом — эта обратная связь и определяет, какой будет следующая версия.</p>`,

s8_h: "🔐 8 · Получение доступа",
s8_aside: `<p><strong>🔑 Ваши учётные данные направляются в Bitwarden</strong> — и появятся там в течение пары дней.</p>
<p>LMS содержит <strong>личные данные</strong> о вас и ваших учениках, поэтому доступ является именным и индивидуальным: без общих логинов, без демо-аккаунта, без исключений.</p>
<p><strong>Как вы войдёте:</strong> мы добавляем ваши учётные данные для LMS в <strong>Bitwarden</strong>, то же самое место, где вы уже храните другие рабочие логины. Ничего запрашивать не нужно, никому напоминать не нужно — они просто появятся там.</p>
<p><strong>Время рассчитано намеренно.</strong> Учётные данные попадают в Bitwarden в течение ближайших нескольких дней, и это также время, когда мы включаем автоматические сообщения. Так что к моменту, когда до вас дойдёт первое сообщение в Slack, вы сможете открыть <strong>tutors.kodland.org</strong> и увидеть детали, стоящие за ним.</p>
<p>Если сообщения уже начались, а вы всё ещё не можете найти учётные данные LMS в своём Bitwarden — опубликуйте это в <strong>#lms-feedback-tts</strong>, и мы решим это в тот же день.</p>`,

s9_h: "❓ 9 · Часто задаваемые вопросы",
faq1_q: `<p><strong><em>«У меня много групп. Мне нужно делать всё это везде?»</em></strong></p>`,
faq1_a: `<p>Нет. Постройте <strong>один</strong> ритуал открытия и один ритуал закрытия, которые работают в каждой группе, и используйте их одинаково. Если сама нагрузка является проблемой, скажите об этом — это разговор о расписании с Teaching Ops, а не что-то, что нужно решать дополнительными усилиями.</p>`,
faq2_q: `<p><strong><em>«Мои ученики просто не включают камеры. Это влияет на мой показатель?»</em></strong></p>`,
faq2_a: `<p>Нет — Присутствие в классе касается <strong>времени в комнате</strong>, а не камер. Камеры, чат и участие относятся к другой метрике, которая появится позже в этом квартале, и даже там камера — лишь один из нескольких сигналов.</p>`,
faq3_q: `<p><strong><em>«У ученика проблемы со связью, и он постоянно отключается. Это засчитывается против меня?»</em></strong></p>`,
faq3_a: `<p>Повторяющиеся переподключения и сбои платформы видны в данных и не трактуются как ваша вина. Всё равно сообщайте о них — это защищает вас и помогает ученику.</p>`,
faq4_q: `<p><strong><em>«Одна из моих групп гораздо сложнее остальных.»</em></strong></p>`,
faq4_a: `<p>Ваши показатели рассчитываются по группе и по курсу, так что сложная группа не прячется за средним значением — и не тянет всё остальное вниз. Полезный вопрос обычно звучит так: <em>почему конкретная комната ведёт себя иначе, чем ваши остальные</em>, и это хорошая тема для сессии коучинга.</p>`,
faq5_q: `<p><strong><em>«Какую одну вещь я могу изменить быстрее всего?»</em></strong></p>`,
faq5_body: `<p>Две вещи, и их подготовка ничего не стоит:</p>
<ul>
<li>Будьте в комнате раньше своих учеников — хотя бы на минуту.</li>
<li>Открывайте занятие вопросом, на который каждый ученик должен ответить по имени, без неправильного ответа. «Одно слово: что вы построили на прошлой неделе?» Обойдите всю комнату, прежде чем поделиться экраном.</li>
</ul>
<p>Эти две вещи меняют больше, чем что-либо ещё на этой странице.</p>`,
faq6_q: `<p><strong><em>«Ученик пропустил два занятия подряд. Что мне делать?»</em></strong></p>`,
faq6_a: `<p><strong>Скажите кому-нибудь — не ждите третьего.</strong> Это та точка, в которой отдаляющегося ученика ещё можно вернуть, и обычно только вы видите это достаточно рано.</p>`,
faq7_q: `<p><strong><em>«У кого спросить, если что-то непонятно?»</em></strong></p>`,
faq7_a: `<p>У вашего регионального ментора.</p>`,
faq_aside: `<p><strong>💬 Есть что-то, на что эта страница не ответила?</strong> Спросите в своём канале тьюторов или напишите своему региональному ментору. Если вопрос возникает более двух раз, он должен быть на этой странице — так что вопрос помогает всем.</p>`,

closing_aside: `<p><strong>🎓 В одной строке</strong></p><p>LMS существует для того, чтобы, когда в одной из ваших групп что-то начинает идти не так, <strong>вы узнавали об этом на второй неделе вместо третьего месяца — и получали помощь, пока это ещё можно исправить.</strong></p>`,

t1: { h:["О чём вы просили","Что у вас есть теперь"], r:[
  ["\u00ABЯ понятия не имею, как идут дела в моих группах, пока мне кто-то не скажет.\u00BB","Ваши собственные цифры, каждую неделю — вы видите их раньше, чем кто-либо их обсудит"],
  ["\u00ABЯ узнаю, что ученик уходит, когда он уже ушёл.\u00BB","Еженедельный список наблюдения с именами — кто в зоне риска и почему"],
  ["\u00ABОбучение общее — оно не о моей проблеме.\u00BB","Короткое обучение, привязанное к тому конкретному, что показывают ваши данные"],
  ["\u00ABМне хотелось бы поговорить с кем-то, кто реально знает мои группы.\u00BB","Коучинг 1:1 с вашим региональным ментором, бронируется в два клика"],
  ["\u00ABЯ хочу преподавать что-то новое, но никто не замечает моей готовности.\u00BB","Обучение и тесты внутреннего найма, открытые для вас"],
  ["\u00ABОбратная связь от QA доходит до меня слишком поздно, чтобы что-то с ней сделать.\u00BB","Сигнал на второй неделе, а не разговор на третий месяц"],
]},
t2: { h:["Показатель","Вопрос, на который он отвечает","Откуда он берётся"], r:[
  ["Посещаемость","Пришёл ли ученик?","Back Office — занятие было запланировано, и ученик либо пришёл, либо нет"],
  ["Присутствие в классе","Когда пришёл, был ли он реально там?","Данные класса — сколько от занятия ученик реально был в комнате"],
]},

  ["🟢 High", "≥ 85%", "Постоянно в классе"],
  ["🟡 WATCH", "75% – 84,99%", "Первый сигнал — присутствие снижается"],
  ["🟠 RISK", "50% – 74,99%", "В классе только половину занятия — требует внимания"],
  ["🔴 ALERT", "Ниже 50%", "Подключается, но почти не присутствует — нужно действовать"],
]},
t3b: { h:["Группа", "Отсутствия в Back Office", "Что это значит"], r:[
  ["🟢 Healthy", "Нет красных, максимум 1 жёлтое", "Приходит на занятия"],
  ["🟡 Alert", "2-3 жёлтых", "Пропускает занятия, которые объяснила семья"],
  ["🔴 Critical", "Одно или более красных, или четыре или более жёлтых", "Отсутствие, которое никто не объяснил, или накапливающиеся отсутствия — мы не знаем, остаётся ли этот ученик с нами"],
]},
t4: { h:["Если это низкое…","…проблема обычно в","…и работа происходит"], r:[
  ["Посещаемость — не приходят","Расписание, семья, мотивация, курс, переставший казаться актуальным","Вне занятия — обратиться, отметить, привлечь семью или Teaching Ops"],
  ["Присутствие в классе — приходят, но их там нет","Фасилитация — комната пассивна, участие ложится на одного-двух учеников","Внутри занятия — как вы открываете, кого вызываете, как закрываете"],
]},
t5: { h:["Её ученики","Сколько","Что видит платформа"], r:[
  ["Остаются на всё занятие","9","🟢 High — присутствие выше 85%"],
  ["Приходят, потом уходят рано — около 35 минут из 60-минутного занятия, за последние 4 занятия","9","🟠 RISK — присутствие около 58%"],
  ["Подключаются на несколько минут или отключаются почти сразу","3","🔴 ALERT — присутствие ниже 50%"],
]},
t6: { h:["Вы услышите от нас, когда…","Потому что","Что вы получите"], r:[
  ["Ваш HPR ниже 49,5% или ваш LPR выше 25,5%","Слишком мало ваших учеников полностью присутствуют, или слишком много едва там","Обучение по ведению занятия — открытие, участие, завершение"],
  ["У двух или более ваших учеников есть два или более необъяснённых (красных) отсутствия", "Отсутствия повторяются, и никто не знает почему. Один ученик с одним красным отсутствием сам по себе не приводит к отметке — её вызывает закономерность", "Обучение по протоколу отсутствий — связь с семьями, фиксация причины, дополнительные занятия"],
  ["У одного ученика три или более необъяснённых (красных) отсутствия, или у двух или более учеников у каждого четыре или более оправданных (жёлтых) отсутствия","Эти ученики близки к уходу, независимо от того, как выглядят ваши общие показатели. Это единственный случай, когда оправданные отсутствия тоже считаются — четыре подряд уже сами по себе закономерность","Имена, немедленно, и обучение — это срочно"],
]},
t7: { h:["Что приходит","Когда","Что вы делаете"], r:[
  ["👥 Ваш список наблюдения за учениками","Раз в неделю","Посмотрите на имена. Дайте этим ученикам возможность включиться на следующем занятии."],
  ["🚩 Отметка + назначенное обучение","Только если показатель ниже цели","Завершите обучение и DST в течение 4 дней."],
  ["⏰ Напоминание","Если срок приближается","Закончите его. Оно короткое."],
