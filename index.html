T.id = {
launch_note: `<p><strong>📆 Khusus minggu ini: kita mulai pada hari Rabu, 02.09.2026.</strong></p><p>Mulai minggu depan, ritme normal kembali berlaku — semuanya dihitung ulang setiap <strong>Senin</strong> dan pesannya dikirim di awal minggu. Minggu pertama ini kami sengaja meluncurkannya pada hari <strong>Rabu</strong>, supaya Anda punya beberapa hari untuk melihat-lihat, mengenali angka Anda sendiri, dan memberi tahu kami kalau ada yang terlihat keliru.</p><p>Kalau ada yang perlu diperbaiki, dua hari ini memang untuk itu: laporkan di <strong>#lms-feedback-tts</strong> dan kami akan memperbaikinya sebelum siklus mingguan yang normal dimulai.</p>`,
brandLabel: "Kodland LMS",
footerNote: "Halaman ini menampilkan ulang panduan Notion Kodland LMS untuk keperluan penerjemahan. Placeholder tangkapan layar menandai tempat gambar Notion asli seharusnya dimasukkan.",
imgNote: "Placeholder tangkapan layar — gambar aslinya tidak disertakan dalam konten sumber; tambahkan di sini.",

title: "Kodland LMS: panduan Anda",
intro1: `<p><strong>🚀 Akhirnya hadir. Dan Anda sudah lama menantikannya.</strong></p>
<p><em>"Sebenarnya bagaimana perkembangan grup saya?" · "Siswa saya yang mana yang hampir berhenti?" · "Bisakah saya dapat pelatihan untuk hal yang memang jadi kesulitan saya?" · "Bisakah saya bicara langsung dengan orang yang mengenal grup saya?"</em></p>
<p>Pertanyaan-pertanyaan itu wajar. Kami hanya belum punya alat dan prosesnya untuk menjawabnya. <strong>Sekarang kami punya.</strong></p>
<p><strong>Dibangun berdasarkan cara Anda mengajar, bukan demi pelaporan — dan ini baru permulaan.</strong></p>`,
intro2: `<p><strong>🗺 Cara membaca halaman ini.</strong> Kita akan berjalan berurutan: apa ini → apa isinya → metrik pertama dan cara membaca angka Anda sendiri → seperti apa satu minggu yang normal → apa yang akan datang berikutnya. Sekitar delapan menit. FAQ di bagian bawah bisa Anda baca nanti.</p>`,

s1_h: "🧭 1 · Pertama, apa ini sebenarnya?",
s1_p1: `<p><strong>LMS (Learning Management System)</strong> adalah platform yang dibangun oleh tim Tutor Development, untuk tutor. Anda sudah punya platform untuk sisi operasional pekerjaan Anda. Yang ini untuk sisi pengajaran.</p>`,
backoffice: `<p><strong>🏢 Back Office — platform operasional</strong></p><p>Jadwal, grup, pembayaran, administrasi. Menjalankan sisi <em>bisnis</em> dari kegiatan mengajar.</p>`,
lms: `<p><strong>🎓 LMS — platform pedagogis</strong></p><p><em>Pengajaran</em> Anda. Bagaimana grup Anda sebenarnya berjalan, dan apa yang membantu Anda membuatnya lebih baik.</p>`,
s1_p2: `<p>Keduanya tidak saling menggantikan. Back Office menjawab <em>"apa yang dijadwalkan?"</em> — LMS menjawab <em>"bagaimana pengajaran saya berjalan, dan apa yang harus saya lakukan?"</em></p>`,
login: `<p><strong>🔗 Halaman login dan hal pertama yang Anda lihat setelah masuk.</strong></p><p>https://tutors.kodland.org/</p><p>Simpan sebagai bookmark. Kredensial login Anda sendiri akan Anda terima dari kami — lihat bagian 8 di bawah untuk cara kerja aksesnya.</p>`,

s2_h: "💡 2 · Mengapa kami membangunnya",
s2_p1: `<p><strong>Karena Anda memintanya. Berulang kali, di pertemuan tutor, selama bertahun-tahun.</strong></p>`,
s2_p2: `<p>Sampai sekarang, ketika salah satu grup Anda mulai melenceng — ada siswa yang jadi diam saja, ada lagi yang mulai bolos sesi — hampir selalu Anda sendiri yang harus menyadarinya. Dan ketika bantuan akhirnya datang, sering kali sudah berlalu berminggu-minggu. Bukan karena tidak ada yang peduli: informasinya tersebar di tempat-tempat yang tidak bisa dibaca bersamaan, dan tidak ada proses untuk mengubahnya menjadi bantuan.</p>
<p>Ketika sebuah keluarga akhirnya berhenti, alasannya biasanya sudah terlihat di kelas <strong>berminggu-minggu sebelumnya</strong>. Sekarang hal itu terlihat oleh kami juga — dan oleh Anda lebih dulu.</p>`,
s2_idea: `<p><strong>🎯 Seluruh idenya dalam satu baris:</strong> Anda tahu di minggu kedua, bukan di bulan ketiga — dan Anda mendapat bantuan saat masalahnya masih bisa diperbaiki.</p>`,

s3_h: "🧰 3 · Jadi, apa saja isinya?",
s3_intro: `<p>Ada lima hal. Berikut masing-masingnya, dan apa manfaatnya untuk Anda.</p>`,
s3_metrics_h: "📊 Metrik Anda",
s3_metrics_p: `<p>Bagaimana perkembangan grup Anda, semuanya di satu tempat — diperbarui setiap minggu, dan Anda yang melihatnya lebih dulu. Tidak perlu lagi menebak-nebak posisi Anda atau menunggu rapat untuk mengetahuinya.</p>`,
img_metrics: "Halaman metrik Anda — angka Anda sendiri, diperbarui setiap minggu.",
s3_watch_h: "👥 Daftar pantauan siswa Anda",
s3_watch_p: `<p><strong>Nama-nama</strong> siswa di grup Anda yang perlu perhatian ekstra minggu ini, dan <em>mengapa</em> masing-masing masuk ke daftar itu. Inilah bagian yang menurut para tutor paling banyak mengubah keadaan: daftar nama adalah sesuatu yang bisa langsung Anda tindak lanjuti di sesi berikutnya. Angka persentase tidak.</p>`,
s3_watch_aside: `<p><strong>💡 Semua nama bisa diklik</strong> dan akan mengarahkan Anda ke profil siswa di Back Office.</p>`,
img_watch: "Daftar pantauan siswa dengan nama dan statusnya.",
s3_train_h: "🎓 Pelatihan dan DST",
s3_train_p: `<p>Pelatihan singkat dan tepat sasaran — bukan kursus umum. Ketika ada sesuatu di data Anda yang perlu perhatian, Anda akan mendapat pelatihan khusus yang membantu untuk <em>hal itu</em>, ditambah <strong>Diagnostic Skill Test (DST)</strong> untuk memastikan materinya benar-benar terserap. Keduanya dirancang agar selesai dalam sekali duduk.</p>`,
img_train: "Halaman pelatihan + DST.",
s3_coach_h: "🤝 Sesi coaching 1:1",
s3_coach_p: `<p>Pesan jadwal dengan mentor regional Anda dalam dua klik — pilih slot, tulis apa yang ingin Anda bicarakan, selesai. Percakapan sungguhan tentang grup Anda yang sebenarnya, bukan tinjauan umum.</p>`,
s3_coach_aside: `<p><strong>💡</strong> Anda bisa mengajukannya kapan saja; tidak perlu menunggu sampai ditandai.</p>`,
img_coach: "Alur pemesanan sesi coaching.",
s3_new_h: "🚀 Kursus baru untuk Anda ajarkan",
s3_new_p: `<p>Pelatihan dan tes untuk <strong>rekrutmen internal</strong>. Ingin mengajar sesuatu yang baru? Materinya sudah ada dan pintunya terbuka — berkembang di sini tidak lagi bergantung pada ada tidaknya orang yang menyadari bahwa Anda sudah siap.</p>`,
img_new: "Area rekrutmen internal / kursus yang tersedia.",
s3_slack: `<p><strong>💬 Dan Anda tidak perlu repot mengingat untuk login.</strong> Semuanya sampai ke Anda lewat <strong>Slack</strong>, dalam bahasa Anda sendiri — daftar pantauan mingguan, pelatihan yang ditugaskan, konfirmasi sesi coaching. Platformnya adalah tempat Anda masuk kalau ingin melihat lebih dalam.</p>`,

s4_h: "🙋 4 · Metrik pertama: Attendance",
s4_p1: `<p>Sekarang bagian yang paling penting, karena inilah yang lebih dulu mulai berjalan.</p>`,
s4_p2: `<p><strong>Kami sengaja memulai dengan satu metrik saja, tapi dikerjakan dengan benar.</strong> Dan metrik itu sekarang menjawab dua pertanyaan, bukan satu — karena seorang siswa bisa <em>tidak ada di sesi</em>, atau <em>hadir tapi tidak terlibat sama sekali</em>, dan itu dua masalah yang sepenuhnya berbeda.</p>`,

s4_absence_h: "🟡🔴 Cara Back Office Attendance dicatat: dua jenis ketidakhadiran",
s4_absence_p: `<p>Ketidakhadiran dan alasannya berasal dari data yang Anda isi secara manual.</p>`,
s4_yellow: `<p><strong>🟡 Kuning — keluarga sudah memberi tahu Anda.</strong> Ada yang mengabari Anda. Keluarga yang sedang menghadapi suatu situasi, siswa yang sedang ujian, laptop yang rusak. Anda pilih kuning <strong>dan pilih alasan yang disampaikan kepada Anda</strong>. Dua belas pilihan itu bukan urusan administrasi. Itulah satu-satunya cara kami mengetahui <strong>ketidakhadiran mana yang bisa kami cegah dari sisi kami.</strong> Pilih yang paling mendekati, dengan jujur. Lima detik dari Anda, dan sebuah pola yang benar-benar bisa kami tindak lanjuti.</p><p>Alasan kuning yang tersedia:</p>`,
s4_red: `<p><strong>🔴 Merah — sama sekali tidak ada yang mengabari Anda.</strong> Siswanya memang tidak muncul, dan tidak ada yang menjelaskan kenapa. Pilih merah <strong>hanya</strong> dalam kasus itu. Merah bukan label yang lebih keras untuk hal yang sama — <strong>merah berarti kami tidak tahu apa yang terjadi.</strong> Itulah yang membuatnya menjadi kondisi paling berbahaya di seluruh halaman ini: ketidakhadiran yang ada alasannya berarti situasi yang sedang ditangani, sedangkan ketidakhadiran tanpa alasan berarti siswa yang mungkin sudah hilang, dan tidak ada yang bisa membantu orang yang masalahnya tidak terlihat.</p>`,
s4_red_aside: `<p><strong>💡 Merah bukan sebuah putusan — artinya "belum diketahui".</strong></p>
<p>Kalau Anda menandai seorang siswa merah dan keluarganya kemudian menjelaskan, <strong>ubah menjadi kuning dan tambahkan alasannya</strong>. Itu bukan memperbaiki kesalahan; itu tanda prosesnya berjalan: Anda menghubungi mereka, Anda mendapat jawaban, dan catatannya kini sesuai dengan kenyataan.</p>
<p>Ini juga salah satu hal tercepat yang bisa Anda lakukan untuk angka Anda sendiri. Ketidakhadiran tanpa penjelasan yang dibiarkan begitu saja akan merugikan angka Attendance Anda. Ketidakhadiran yang sama, setelah Anda bicara dengan keluarganya dan mencatat alasannya, tidak.</p>`,

s4_presence_h: "🧮 Cara Classroom Presence dihitung",
s4_presence_p: `<p>Tidak ada kotak hitam. Tiga langkah.</p>`,
presence_why: `<p><strong>Mengapa kami mengukurnya.</strong> Ini menunjukkan berapa banyak bagian kelas yang benar-benar diikuti siswa &mdash; dan hal itu berkaitan erat dengan retensi. Siswa yang masuk lalu menjauh sudah berada di jalur keluar jauh sebelum terlihat di data kehadiran.</p>`,
step1: `<p><strong>1 &middot; Untuk setiap sesi, kami menjumlahkan seluruh waktu siswa terhubung.</strong></p>`,
step1b: `<p>Classroom Presence adalah <strong>jumlah dari semua segmen antara saat siswa terhubung dan terputus</strong>. Kalau koneksinya terputus lalu dia kembali, segmen-segmennya dijumlahkan &mdash; menyambung ulang itu sendiri tidak merugikan.</p>`,
step2: `<p><strong>2 &middot; Total itu kami bagi dengan durasi sesi yang dijadwalkan.</strong></p>`,
step2b: `<p>Dua contoh perhitungan:</p>`,
presence_examples: [
 "<strong>Sesi 19:00 &ndash; 20:00.</strong> Siswa terhubung pukul 19:00 dan terputus pukul 19:50. &rarr; 50 / 60 = <strong>83,33%</strong>",
 "<strong>Sesi 19:00 &ndash; 20:00.</strong> Siswa terhubung pukul 19:00 dan terputus pukul 19:20; setelah mengatasi masalah PC atau koneksi, dia tersambung lagi pukul 19:40 dan bertahan 20 menit lagi. &rarr; (20 + 20) / 60 = <strong>66,66%</strong>",
],
step3: `<p><strong>3 &middot; Classroom Presence siswa adalah rata-rata dari itu pada sesi-sesinya dalam 30 hari terakhir</strong> &mdash; dihitung <strong>per kelompok dan per kursus</strong>, jadi siswa yang mengikuti dua kursus dengan Anda diukur terpisah di masing-masing. Jendelanya bergulir, dan angkanya diperbarui <strong>setiap hari Senin</strong>.</p>`,
exclude_intro: `<p>Apa yang tidak dihitung, dan mengapa:</p>`,
presence_note: `<p><strong>👀 Perlu Anda tahu:</strong> Classroom Presence mengukur <strong>lama waktu di dalam kelas</strong> — tidak ada yang lain. Ini bukan soal kamera Anda, chat Anda, atau siapa yang paling banyak bicara. Sinyal-sinyal itu masuk ke metrik lain yang akan hadir akhir kuartal ini, dan metrik itu pun akan kami jelaskan seterbuka ini.</p>`,

presence_reliability: `<p><strong>🔧 Kalau ada angka yang terlihat salah, beri tahu kami.</strong> Tulis di kanal <strong>#lms-feedback-tts</strong> dengan tangkapan layar dan penjelasan singkat soal masalahnya, lalu tag mentor regional Anda.</p>`,
s4_risk_h: "🚦 Dua sinyal Anda",
risk_p1: `<p>Setiap siswa punya <strong>dua kategori</strong> &mdash; satu dari Classroom Presence, satu dari kehadiran Back Office. Daftar Anda menampilkan <strong>yang lebih buruk di antara keduanya</strong>, supaya tidak ada yang lolos ketika keduanya berbeda.</p>`,
alert_warning: `<p><strong>⚠️ Satu kata, dua arti &mdash; baca label bersama sinyalnya.</strong> <strong>ALERT</strong> di sisi Classroom Presence berarti kehadiran di bawah 50%. <strong>Alert</strong> di sisi Back Office berarti 2&ndash;3 ketidakhadiran yang dijelaskan. Sinyal berbeda dengan tingkat keparahan berbeda &mdash; jadi selalu sebutkan sinyalnya: <em>ALERT (Classroom Presence)</em>, <em>Alert (ketidakhadiran)</em>. Kami menyarankan hal yang sama saat membahas siswa dengan mentor Anda. Nama kelompoknya muncul dalam bahasa Inggris di LMS, karena itu di sini pun kami biarkan dalam bahasa Inggris.</p>`,
risk_p2: `<p>Bacalah keduanya sebagai <strong>alternatif, bukan syarat</strong>: siswa ditempatkan <em>entah</em> oleh ketidakhadiran <em>atau</em> oleh Classroom Presence &mdash; mana yang lebih buruk. Siswa yang tidak pernah absen sama sekali bisa masuk 🟠 RISK karena Classroom Presence saja kalau dia hanya berada di kelas 60% sesi, dan siswa dengan Classroom Presence sempurna bisa masuk 🔴 Critical hanya karena satu ketidakhadiran yang tidak dijelaskan.</p>`,
risk_p3: `<p>Untuk setiap siswa yang ditandai, Anda juga melihat <strong>alasan</strong> di balik setiap ketidakhadiran kuning &mdash; salah satu dari dua belas alasan di atas &mdash; jadi Anda tidak perlu menebak.</p>`,
s4_hpr_h: "📈 HPR dan LPR — dua angka di kartu Anda",
hpr_intro: `<p>Keduanya diukur berdasarkan <strong>Classroom Presence</strong>:</p>`,
bar_p: `<p>Batas yang kami pegang di semua wilayah: <strong>LPR pada 25,5% atau lebih rendah</strong> · <strong>HPR pada 49,5% atau lebih tinggi</strong>.</p>`,
target_aside: `<p><strong>📌 Ini adalah target global untuk kuartal peluncuran.</strong> Target per wilayah sedang dipastikan bersama masing-masing Head of Teaching, dan kartu Anda di LMS selalu menampilkan target yang berlaku untuk Anda — jadi percayai kartu itu, bukan angka yang tertulis di tempat lain mana pun.</p>`,
goal_aside: `<p><strong>🎯 Untuk Classroom Presence, tujuannya berupa angka:</strong> dorong HPR naik, tarik LPR turun.</p>
<p><strong>Untuk Back Office Attendance, tujuannya berupa dua hasil — tanpa angka:</strong></p>
<ul>
<li>🔴 <strong>Hilangkan ketidakhadiran tanpa penjelasan.</strong> Ketidakhadiran merah berarti ada siswa yang hilang dan tidak ada yang menindaklanjutinya. Hal seperti itu semestinya tidak mungkin terjadi lagi.</li>
<li>🟡 <strong>Hentikan pola menjauhnya siswa yang mulai muncul pada ketidakhadiran kedua yang ada izinnya.</strong> Dua kuning adalah titik ketika seorang siswa mulai menjauh <em>dan</em> masih bisa ditarik kembali. Setelah itu, peluangnya turun dengan cepat.</li>
</ul>
<p><strong>Tidak boleh ada siswa yang hilang begitu saja tanpa ada yang tahu, dan jangan sampai ada siswa yang berhenti karena dua ketidakhadiran yang tidak ditanggapi siapa pun.</strong></p>`,

s4_payoff_h: "🧭 Dan inilah manfaat praktisnya",
payoff_p1: `<p>Kedua ukuran itu menunjuk masalah yang berbeda, dengan cara penanganan yang berbeda. Itulah alasan kami memisahkannya:</p>`,
payoff_p2: `<p>Angka persentase tunggal yang sama seperti dulu, tapi di dalamnya tersembunyi dua rencana tindakan yang sepenuhnya berbeda.</p>`,

maria_h: "🧑‍🏫 Kasus 1 · Maria — masalah Classroom Presence",
maria_p1: `<p>Maria mengajar <strong>3 grup</strong>, dengan total <strong>21 siswa</strong>. Berikut 30 hari terakhirnya.</p>`,
maria_p2: `<p>Jadi dua angkanya adalah:</p>`,
maria_aside: `<p><strong>💡 Maria ditandai karena HPR, bukan LPR — dan inilah kasus yang paling sering terjadi.</strong></p>
<p>Tidak ada siswa yang hilang. Semua siswanya <em>datang</em>. Tapi sembilan di antaranya pergi di tengah jalan, jadi terlalu sedikit siswanya yang benar-benar hadir sepanjang sesi. Dengan satu angka tunggal seperti dulu, hal ini tidak terlihat sama sekali: sembilan siswa itu terhitung "hadir".</p>`,

monday_h: "📅 Senin pagi — apa yang sebenarnya terjadi",
monday_step1: `<p><strong>1 · Sebuah DM Slack masuk.</strong> Dari Tutor Development, dalam bahasa Maria sendiri. Bunyinya seperti ini:</p>`,
monday_after_quote: `<p>Maria tidak perlu login untuk mengetahuinya. <strong>Platformnya yang datang kepadanya.</strong></p>`,
monday_step2: `<p><strong>2 · Dia membuka LMS untuk melihat detailnya.</strong> Di tutors.kodland.org dia menemukan kedua ukurannya, HPR dan LPR-nya dibandingkan dengan target, dan daftar pantauan yang sama — tapi lengkap dengan grup setiap siswa, persentase Classroom Presence mereka, dan link langsung ke profil mereka di Back Office. Ke situlah dia pergi kalau ingin tahu <em>di grup mana</em> masalahnya berada.</p>`,
monday_step3: `<p><strong>3 · Dia menyadari sesuatu yang tidak bisa disampaikan pesan Slack itu.</strong> Tujuh dari sembilan siswa yang pergi lebih awal berada di grup yang sama — kelas Sabtu jam 6 malamnya. Berarti ini bukan masalah pengajaran secara menyeluruh, ini satu ruang, di satu jam, dengan satu dinamika tertentu. Sekarang dia tahu ke mana harus mengarahkan usahanya.</p>`,
monday_step4: `<p><strong>4 · Dia mengerjakan pelatihannya.</strong> Ada di LMS, sudah ditugaskan kepadanya, dan singkat. Dia menyelesaikannya bersama DST dalam empat hari itu dan mendapat pesan Slack yang mengonfirmasi bahwa dia lulus.</p>`,
monday_step5: `<p><strong>5 · Dia mengubah dua hal di sesi-sesi berikutnya.</strong> Dari pelatihan dan tips mingguan: dia mulai membuka dengan pertanyaan yang harus dijawab setiap siswa saat namanya dipanggil, dan dia berhenti membiarkan lima menit terakhir terpakai habis — rangkuman dan kalimat "apa yang akan kita bahas sesi depan" itulah yang membuat siswa bertahan di kelas sampai akhir.</p>`,
monday_step6: `<p><strong>6 · Dua minggu kemudian HPR-nya 51%.</strong> Dia mendapat pesan Slack yang memberitahunya bahwa dia sudah tidak ditandai lagi. Tidak pernah ada satu pun percakapan yang berat dengannya sepanjang proses itu.</p>`,
maria_ifnot: `<p><strong>🤝 Dan kalau dia tidak membaik?</strong> Setelah pelatihan, kalau metriknya masih di bawah target, Maria akan diminta memesan <strong>sesi 1:1 dengan mentor regionalnya</strong> — dua klik, pilih slot. Percakapannya soal grup-grupnya yang nyata, kemungkinan besar kelas Sabtu jam 6 malam itu. Tetap tidak ada siapa pun yang memutuskan apa-apa tentang dia berdasarkan sebuah angka.</p>`,

cases_h: "🧭 Dua kasus, satu proses",
cases_intro: `<p>Sebuah pesan sampai ke Anda kalau salah satu dari tiga hal ini terjadi. <strong>Classroom Presence</strong> Anda tidak sesuai target — HPR di bawah target, atau LPR di atasnya. <strong>Ketidakhadiran di Back Office</strong> Anda terlihat bermasalah — dua siswa atau lebih punya dua ketidakhadiran atau lebih yang tidak dijelaskan siapa pun, atau, kalau siswa Anda sudah 10 orang atau lebih, lebih dari setengah daftar siswa Anda punya satu ketidakhadiran seperti itu. Atau ada <strong>kasus mendesak</strong> yang terpicu: satu siswa dengan tiga ketidakhadiran tanpa penjelasan atau lebih, atau dua siswa dengan empat ketidakhadiran yang ada penjelasannya atau lebih — apa pun angka Anda.</p><p>Maria menghadapi masalah yang pertama, Marco yang kedua. Apa yang terjadi setelahnya sama saja di setiap kasus:</p>`,
cases_list: ["<strong>Sebuah pesan</strong> — berisi tips praktis <em>dan</em> aturan yang berlaku, dilampirkan langsung di pesannya, jadi Anda tidak perlu repot mencari-cari kebijakannya.","<strong>Satu pelatihan singkat di LMS</strong> — ditugaskan kepada Anda, ditambah DST, dengan empat hari untuk menyelesaikannya.","<strong>Sesi 1:1 dengan mentor regional Anda</strong> — kalau setelah itu belum ada yang membaik."],
cases_aside: `<p><strong>🤝 Tidak ada satu pun hal di sini yang diputuskan oleh angka.</strong> Platformnya menentukan ke mana kami melihat lebih dulu — setelah itu, ada manusia yang berbicara dengan Anda. Kalau ada yang terlihat keliru di datanya, mengatakannya itu berguna, bukan hal yang bikin tidak nyaman.</p>`,
marco_flag: `<p>Itulah yang memicu pesan untuknya. Back Office Attendance tidak ditandai berdasarkan rata-rata — tandanya muncul dari kondisi catatannya: <strong>dua siswa atau lebih punya dua ketidakhadiran atau lebih yang tidak dijelaskan siapa pun</strong>, atau, kalau siswa Anda sudah 10 orang atau lebih, <strong>lebih dari setengah daftar siswa Anda punya satu ketidakhadiran seperti itu</strong>. Dua siswa Marco, dengan masing-masing dua ketidakhadiran tanpa penjelasan, persis seperti itu. Ketidakhadiran yang ada alasannya berarti situasi yang sedang ditangani. Ketidakhadiran merah berarti siswa yang mungkin sudah hilang.</p>`,
marco_week_h: "📅 Senin paginya — apa yang sebenarnya terjadi",
marco_s0: `<p><strong>1 · DM Slack yang sama — lengkap dengan aturannya.</strong> Marco tidak perlu mencari-cari kebijakan atau menghafalnya. Bunyinya seperti ini:</p>`,
marco_quote: [
 "Hai Marco 👋",
 "Kami dari Tutor Development Department ingin membahas catatan kehadiran di grup-grup Anda. <strong>Dua siswa Anda masing-masing punya dua ketidakhadiran yang ditandai 🔴 merah</strong> — tercatat tanpa alasan apa pun.",
 "Siswa yang perlu ditindaklanjuti:<br>🔴 Lukas Meyer — 2 sesi, tanpa alasan tercatat<br>🔴 Ana Silva — 2 sesi, tanpa alasan tercatat",
 "Kami sudah menugaskan satu pelatihan singkat untuk membantu: <em>Menangani Ketidakhadiran</em> — [link]. Mohon selesaikan pelatihan itu bersama DST dalam 4 hari ke depan.",
 "Aturan untuk ketidakhadiran merah dan kuning dilampirkan di pesan ini — apa yang harus dilakukan, dalam urutan apa, dan apa yang harus dicatat.",
 "Mentor regional Anda selalu siap membantu.",
],
marco_s1: `<p><strong>2 · Dia membuka LMS untuk melihat siapa dan di mana.</strong> Daftar pantauan yang sama seperti yang dilihat Maria, tapi punyanya menampilkan dua siswa itu, grup mereka, dan link langsung ke masing-masing profil Back Office.</p>`,
marco_s2: `<p><strong>3 · Dia menghubungi kedua keluarga di hari yang sama.</strong> Dia mengirim rekamannya, rangkuman singkat materi yang terlewat, dan satu pertanyaan: apa yang terjadi? Ketidakhadiran yang tidak ditanggapi siapa pun jauh lebih mungkin berlanjut menjadi ketidakhadiran kedua.</p>`,
marco_s3: `<p><strong>4 · Dia mencatat apa yang disampaikan kepadanya.</strong> 🔴 merah berubah menjadi 🟡 kuning lengkap dengan alasannya — yang satu sedang pekan ujian, yang lain laptopnya rusak. Ketidakhadiran merah tidak boleh dibiarkan tanpa penjelasan lebih dari 48 jam.</p>`,
marco_s4: `<p><strong>5 · Dia bertanya dulu sebelum menjanjikan apa pun yang di luar kebiasaan.</strong> Salah satu dari keduanya sudah tertinggal materi, jadi Marco menyampaikannya ke TL-nya (team leader) — sesi tambahan atau sesi motivasi adalah keputusan mereka, bukan sesuatu yang boleh langsung ditawarkan ke keluarga. Sementara itu, "nanti saya cek dulu" sudah merupakan jawaban yang utuh.</p>`,
marco_s5: `<p><strong>6 · Catatannya bersih di minggu berikutnya</strong>, dan sebuah pesan Slack memberitahunya bahwa dia sudah tidak ditandai lagi. Sama seperti Maria, tidak pernah ada satu pun percakapan yang berat dengannya sepanjang proses itu.</p>`,
marco_ifnot: `<p><strong>🤝 Dan kalau ketidakhadirannya terus berlanjut?</strong> Sama persis seperti Maria: kalau keadaannya belum membaik setelah pelatihan, Marco akan diminta memesan <strong>sesi 1:1 dengan mentor regionalnya</strong> — dua klik, pilih slot. Prosesnya sama, topiknya berbeda: punya Maria soal cara menjalankan sesi, punya Marco soal apa yang terjadi di antara sesi.</p>`,
marco_h: "🔄 Kasus 2 · Marco — masalah Back Office Attendance",
marco_p1: `<p>Marco juga mengajar 3 grup. Siswa yang datang benar-benar hadir penuh — HPR-nya 61%, jauh di atas target, jadi tidak ada apa pun di Classroom Presence-nya yang ditandai. Masalahnya ada di ukuran yang satunya: <strong>dua siswanya tidak datang di dua sesi terakhir dan tidak pernah mengabarinya.</strong> Keduanya tercatat 🔴 merah — tidak ada yang tahu kenapa.</p>`,
marco_aside: `<p><strong>🎯 Metrik yang sama, dua masalah yang berlawanan.</strong> Pekerjaan Maria ada <em>di dalam</em> sesi. Pekerjaan Marco ada <em>di luar</em> sesi. Justru itulah alasan kami memecah Attendance menjadi dua ukuran — supaya bantuan yang Anda dapat sesuai dengan masalah yang benar-benar Anda hadapi.</p>`,

s5_h: "📅 5 · Seperti apa satu minggu yang normal",
s5_p1: `<p>Sekarang Anda sudah tahu apa itu platformnya dan apa arti angka-angkanya. Berikut seluruh alurnya di satu tempat.</p>`,
s5_flow_h: "🧭 Alurnya, secara singkat",
s5_when_h: "❓ Kapan tepatnya saya akan ditandai, dan kenapa?",
s5_when_p: `<p>Hanya tiga situasi, tidak ada yang lain:</p>`,
s5_when_aside: `<p><strong>🙋 Dan apa yang perlu saya lakukan?</strong> Tiga hal, setiap kalinya.</p>
<ol class="list">
<li>Baca pesannya. Di situ tercantum metriknya, nama siswanya, dan tenggat waktunya.</li>
<li>Selesaikan pelatihannya dan DST-nya dalam 4 hari. Keduanya memang dibuat singkat.</li>
<li>Beri siswa-siswa itu kesempatan untuk terlibat di sesi Anda berikutnya. Pelatihan dan tipsnya akan memberi tahu caranya — itulah bagian yang benar-benar menggerakkan angkanya.</li>
</ol>`,

s5_arrive_h: "📨 Dan inilah cara semuanya sampai ke Anda",
s5_three_aside: `<p><strong>🙌 Tiga hal yang kami minta dari Anda</strong></p>
<ol class="list">
<li>Baca pesannya begitu masuk.</li>
<li>Tindak lanjuti — kalau ada pelatihan yang ditugaskan, selesaikan bersama DST-nya dalam 4 hari.</li>
<li>Bertanya kalau ada yang belum jelas. Untuk itulah mentor regional Anda ada.</li>
</ol>`,

s5_msg_h: "📲 Ada pesan masuk. Apa yang harus saya lakukan?",
s5_msg_p: `<p>Semuanya sampai ke Anda sebagai <strong>DM Slack dari Tutor Development</strong>. Jenisnya hanya ada lima, dan tidak ada satu pun yang perlu dibalas panjang-panjang.</p>`,
s5_msg_aside: `<p><strong>🤖 DM ini dikirim otomatis</strong>, jadi membalas pesannya tidak akan sampai ke siapa pun. Kalau ada yang ingin Anda sampaikan, kirim pesan langsung ke <strong>mentor regional</strong> Anda — atau tulis di channel di bawah ini, yang biasanya lebih cepat.</p>`,

s5_feedback_h: "🛠 Ada yang terlihat keliru? Ada satu tempat untuk melaporkannya",
feedback_aside: `<p><strong>📣 Tulis di #lms-feedback-tts.</strong></p>
<p>Bukan DM ke siapa pun yang kebetulan Anda kenal, dan bukan terselip di channel tutor Anda. Satu channel berarti kami melihat setiap laporan, kami memperbaikinya sekali saja alih-alih sembilan kali, dan Anda bisa melihat bahwa ada orang yang menanganinya.</p>
<p>Yang layak dilaporkan:</p>
<ul>
<li>🔢 Angka yang terlihat keliru — siswa yang ditandai tidak hadir padahal jelas ada di kelas, persentase yang tidak cocok dengan yang Anda lihat</li>
<li>🔗 Link yang rusak, atau pelatihan yang tidak sesuai dengan masalah yang disebutkan di pesannya</li>
<li>🌐 Pesan yang bahasanya salah, atau yang menyebut nama siswa yang bukan siswa Anda</li>
<li>🔑 Kredensial yang tidak Anda temukan di Bitwarden padahal pesannya sudah mulai masuk</li>
<li>😵 Apa pun yang membingungkan, rusak atau lambat — dan apa pun yang Anda harap ada di sini tapi ternyata belum ada</li>
</ul>
<p><strong>Ini bukan mengeluh, dan tidak akan merugikan Anda.</strong> Terutama di minggu-minggu awal, hanya Andalah yang bisa melihat apakah ini benar-benar berjalan. Satu laporan yang menyelamatkan tutor berikutnya dari kebingungan yang sama jauh lebih berharga bagi kami daripada diam demi kesopanan.</p>`,

s5_mentor_h: "🌍 Mentor regional Anda",
mentor_p: `<p>Inilah orang yang namanya tercantum di setiap pesan yang Anda terima dari kami — dan orang yang benar-benar akan berbicara dengan Anda. Anda tidak perlu menunggu sampai ditandai untuk menghubunginya.</p>`,

s6_h: "🙅 6 · Ini bukan…",
s6_p1: `<p>Sebelum Anda login untuk pertama kali, mari kita bicara terus terang tentang hal-hal yang biasanya dikhawatirkan orang.</p>`,
s6_aside: `<p><strong>⚖️</strong> Dan kalau datanya memang salah — siswa yang ditandai tidak hadir padahal jelas ada di kelas, atau platform yang bermasalah — <strong>beri tahu kami di #lms-feedback-tts</strong>. Kasus seperti itu terlihat oleh kami juga, dan melaporkannya melindungi Anda sekaligus siswanya.</p>`,

s7_h: "🔮 7 · Apa yang akan datang berikutnya",
s7_p1: `<p>Attendance adalah metrik pertama, bukan yang terakhir.</p>`,
s7_aside: `<p><strong>🛠 Ini versi pertama</strong>, dan kami berniat terus mengembangkannya bersama Anda. Kalau ada yang membingungkan, kurang, atau keliru, sampaikan saja — dari masukan itulah versi berikutnya ditulis.</p>`,

s8_h: "🔐 8 · Cara mendapatkan akses",
s8_aside: `<p><strong>🔑 Kredensial Anda akan dimasukkan ke Bitwarden</strong> — dan akan ada di sana dalam beberapa hari.</p>
<p>LMS menyimpan <strong>data pribadi</strong> tentang Anda dan tentang siswa Anda, jadi aksesnya bersifat individual dan atas nama masing-masing orang: tidak ada login bersama, tidak ada akun percobaan, tanpa pengecualian.</p>
<p><strong>Cara Anda masuk:</strong> kami sedang menambahkan kredensial LMS Anda ke <strong>Bitwarden</strong>, tempat yang sama dengan yang sudah Anda pakai untuk login kerja lainnya. Tidak ada yang perlu diminta dan tidak ada siapa pun yang perlu dikejar — kredensialnya akan muncul sendiri di sana.</p>
<p><strong>Waktunya kami selaraskan dengan sengaja.</strong> Kredensialnya masuk ke Bitwarden dalam beberapa hari ke depan, dan saat itu juga kami menyalakan pesan-pesan otomatisnya. Jadi ketika pesan Slack pertama sampai ke Anda, Anda sudah bisa membuka <strong>tutors.kodland.org</strong> dan melihat detail di baliknya.</p>
<p>Kalau pesannya sudah mulai masuk tapi Anda masih belum menemukan kredensial LMS di Bitwarden Anda — tulis di <strong>#lms-feedback-tts</strong> dan kami akan membereskannya di hari yang sama.</p>`,

s9_h: "❓ 9 · FAQ",
faq1_q: `<p><strong><em>"Saya punya banyak grup. Apakah semua ini harus saya lakukan di semua grup?"</em></strong></p>`,
faq1_a: `<p>Tidak. Buat <strong>satu</strong> rutinitas pembuka dan satu rutinitas penutup yang cocok untuk semua grup, lalu terapkan sama persis di setiap grup. Kalau beban kerjanya sendiri yang jadi masalah, katakan saja — itu urusan penjadwalan dengan Teaching Ops, bukan sesuatu yang harus diselesaikan dengan usaha ekstra.</p>`,
faq2_q: `<p><strong><em>"Siswa saya memang tidak mau menyalakan kamera. Apakah itu jadi nilai saya?"</em></strong></p>`,
faq2_a: `<p>Tidak — Classroom Presence soal <strong>lama waktu di dalam kelas</strong>, bukan soal kamera. Kamera, chat dan partisipasi masuk ke metrik lain yang akan hadir akhir kuartal ini, dan di sana pun kamera hanya salah satu dari beberapa sinyal.</p>`,
faq3_q: `<p><strong><em>"Ada siswa yang koneksinya bermasalah dan terus terputus. Apakah itu merugikan saya?"</em></strong></p>`,
faq3_a: `<p>Koneksi yang terputus-sambung berulang kali dan gangguan platform terlihat di datanya, dan tidak dibaca sebagai kesalahan Anda. Tetap laporkan — itu melindungi Anda sekaligus membuat siswanya mendapat bantuan.</p>`,
faq4_q: `<p><strong><em>"Salah satu grup saya jauh lebih sulit daripada yang lain."</em></strong></p>`,
faq4_a: `<p>Angka Anda dihitung per grup dan per kursus, jadi grup yang sulit tidak tersembunyi di balik rata-rata — dan juga tidak menarik turun semua yang lain. Pertanyaan yang berguna biasanya <em>mengapa satu kelas tertentu berjalan berbeda dari kelas Anda yang lain</em>, dan itu bagus untuk dibawa ke sesi coaching.</p>`,
faq5_q: `<p><strong><em>"Satu hal apa yang paling cepat bisa saya ubah?"</em></strong></p>`,
faq5_body: `<p>Dua hal, dan keduanya tidak butuh persiapan apa pun:</p>
<ul>
<li>Hadirlah di kelas sebelum siswa Anda — walau hanya satu menit lebih awal.</li>
<li>Buka dengan pertanyaan yang harus dijawab setiap siswa satu per satu saat namanya dipanggil, dan tidak ada jawaban yang salah. "Satu kata: apa yang kamu buat minggu lalu?" Putari seluruh kelas dulu sebelum Anda membagikan layar.</li>
</ul>
<p>Dua hal itu berdampak lebih besar daripada apa pun yang lain di halaman ini.</p>`,

faq6_a: `<p><strong>Beri tahu seseorang — jangan tunggu sampai yang ketiga.</strong> Di titik itulah siswa yang mulai menjauh masih bisa ditarik kembali, dan biasanya Andalah satu-satunya orang yang melihatnya sedini itu.</p>`,

/* ===================== BLOCK RENDERERS ===================== */
function renderTable(data){
  let html = '<div class="table-scroll"><table><thead><tr>';
  data.h.forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody>';
  data.r.forEach(row => {
    html += '<tr>';
    row.forEach(cell => html += `<td>${cell}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderBlock(b, lang){
  const val = T[lang][b.key];
  if(val === undefined) return '';
  switch(b.type){
    case 'html':  return val;
    case 'h3':    return `<h4 class="h3">${val}</h4>`;
    case 'aside': return `<div class="aside">${val}</div>`;
    case 'note':  return `<div class="aside hot">${val}</div>`;
    case 'list':  return `<ul class="list">${val.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'table': return renderTable(val);
    case 'quote': return `<div class="quote">${val.map(l=>`<p>${l}</p>`).join('')}</div>`;
    case 'flow':  return `<div class="flow">${val.map(l=>`<p>${l}</p>`).join('')}</div>`;
    case 'img': {
      const src = IMAGES[b.key];
      const alt = String(val).replace(/"/g,'&quot;');
      if(src) return `<figure class="img-figure"><img src="${src}" alt="${alt}" loading="lazy"><figcaption>📸 ${val}</figcaption></figure>`;
      return `<div class="img-placeholder"><div class="img-cap">📸 ${val}</div><div class="img-box">${T[lang].imgNote||''}</div></div>`;
    }
    default: return '';
  }
}

/* ===================== TREE BUILDER =====================
   Turns the flat BLOCKS list into: sections (h1) → subsections (h2)
   → nested subsections (h3). Translations are never touched.        */
const FAQ_Q = /^faq\d+_q$/;
const FAQ_ANY = /^faq\d+_/;

function buildTree(lang){
  const t = k => T[lang][k];
  const sections = [];
  let sec = null, h2 = null, sub = null, inFaq = false;
  let docTitle = '';
  const pre = [];

  BLOCKS.forEach(b => {
    if(b.type === 'title'){ docTitle = t(b.key) || ''; return; }

    /* closes the current subsection so what follows sits at section level */
    if(b.type === 'end'){ h2 = null; sub = null; inFaq = false; return; }

    if(b.type === 'h1'){
      sec = { label: t(b.key) || '', intro: [], subs: [], outro: [] };
      sections.push(sec);
      h2 = null; sub = null; inFaq = false;
      return;
    }

    /* FAQ entries have no heading blocks — each question becomes its own toggle */
    if(sec && FAQ_Q.test(b.key)){
      const node = { level:2, isFaq:true, label: stripTags(t(b.key) || ''), blocks: [], kids: [] };
      sec.subs.push(node);
      h2 = null; sub = node; inFaq = true;
      return;
    }
    if(inFaq && !FAQ_ANY.test(b.key)){ inFaq = false; sub = null; }
    if(b.type === 'h2'){
      if(!sec) return;
      h2 = { level:2, label: t(b.key) || '', blocks: [], kids: [] };
      sec.subs.push(h2); sub = h2;
      return;
    }
    if(b.type === 'h3'){
      const node = { level:3, label: t(b.key) || '', blocks: [], kids: [] };
      if(h2){ h2.kids.push(node); }
      else if(sec){ node.level = 2; sec.subs.push(node); }
      else { return; }
      sub = node;
      return;
    }
    // regular content block
    if(sub) sub.blocks.push(b);
    else if(sec) (sec.subs.length ? sec.outro : sec.intro).push(b);
    else pre.push(b);
  });

  // Synthetic opening section built from the doc title + intro blocks
  if(pre.length){
    sections.unshift({ label: docTitle, intro: pre, subs: [], outro: [], isIntro:true });
  }
  return { docTitle, sections };
}

/* ===================== HTML BUILDERS ===================== */
let TREE = null;
let LANG = 'en';
let ACTIVE = 0;
let VISITED = new Set();

function subHtml(node, lang, path){
  const inner =
    node.blocks.map(b => renderBlock(b, lang)).join('\n') +
    node.kids.map((k,i) => subHtml(k, lang, path + '-' + i)).join('\n');
  const cls = node.isFaq ? 'sub faq' : (node.level === 3 ? 'sub l3' : 'sub');
  return `<details class="${cls}" data-path="${path}">
    <summary><span class="chev">›</span><span class="sub-label">${node.label}</span></summary>
    <div class="sub-body">${inner}</div>
  </details>`;
}

function sectionHtml(sec, idx, lang){
  const titleTag = sec.isIntro
    ? `<h1 class="doc-title">${sec.label}</h1>`
    : `<div class="sec-kicker"><span dir="ltr">${idx} / ${TREE.sections.length - 1}</span></div><h1 class="sec-title">${sec.label}</h1>`;

  const intro = sec.intro.length
    ? `<div class="sec-intro">${sec.intro.map(b=>renderBlock(b,lang)).join('\n')}</div>` : '';

  const tools = sec.subs.length
    ? `<div class="sec-tools">
         <button class="tool-btn" data-act="expand">${ui(lang,'expand')}</button>
         <button class="tool-btn" data-act="collapse">${ui(lang,'collapse')}</button>
       </div>` : '';

  const subs = sec.subs.map((s,i)=>subHtml(s, lang, idx + '.' + i)).join('\n');

  const grid = sec.isIntro
    ? `<div class="sec-grid">` + TREE.sections.slice(1).map((s,i)=>
        `<button class="grid-card" data-goto="${i+1}">
           <span class="grid-lbl">${s.label}</span>
           <span class="grid-arrow">→</span>
         </button>`).join('') + `</div>`
    : '';

  const outro = (sec.outro && sec.outro.length)
    ? `<div class="sec-outro">${sec.outro.map(b=>renderBlock(b,lang)).join('\n')}</div>` : '';

  return `<section class="sec" data-idx="${idx}">${titleTag}${intro}${grid}${tools}${subs}${outro}</section>`;
}

function buildToc(){
  const toc = document.getElementById('toc');
  toc.innerHTML = TREE.sections.map((sec,i)=>{
    const tick = VISITED.has(i) ? '✓' : '';
    let html = `<button class="nav-item" data-idx="${i}">
      <span class="nav-tick">${tick}</span><span>${sec.label}</span></button>`;
    if(i === ACTIVE && sec.subs.length){
      html += '<div class="nav-sub">' + sec.subs.map((s,j)=>{
        let rows = `<button class="nav-sub-item" data-idx="${i}" data-path="${i}.${j}">${s.label}</button>`;
        rows += s.kids.map((k,x)=>`<button class="nav-sub-item l3" data-idx="${i}" data-path="${i}.${j}-${x}">${k.label}</button>`).join('');
        return rows;
      }).join('') + '</div>';
    }
    return html;
  }).join('');
  toc.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.toggle('active', +b.dataset.idx === ACTIVE);
    b.addEventListener('click', ()=>{ go(+b.dataset.idx); closeNav(); });
  });
  toc.querySelectorAll('.nav-sub-item').forEach(b=>{
    b.addEventListener('click', ()=>{ go(+b.dataset.idx, b.dataset.path); closeNav(); });
  });
}

function buildPager(){
  const p = document.getElementById('pager');
  const secs = TREE.sections;
  const prev = ACTIVE > 0 ? secs[ACTIVE-1] : null;
  const next = ACTIVE < secs.length-1 ? secs[ACTIVE+1] : null;
  const arrowBack = document.body.dir === 'rtl' ? '→' : '←';
  const arrowFwd  = document.body.dir === 'rtl' ? '←' : '→';
  p.innerHTML = `
    <button class="pager-btn prev" ${prev?'':'disabled'}>
      <span class="pager-dir">${arrowBack} ${ui(LANG,'prev')}</span>
      <span class="pager-lbl">${prev?prev.label:''}</span>
    </button>
    <button class="pager-btn next" ${next?'':'disabled'}>
      <span class="pager-dir">${ui(LANG,'next')} ${arrowFwd}</span>
      <span class="pager-lbl">${next?next.label:''}</span>
    </button>`;
  const pb = p.querySelector('.prev'), nb = p.querySelector('.next');
  if(prev) pb.addEventListener('click', ()=>go(ACTIVE-1));
  if(next) nb.addEventListener('click', ()=>go(ACTIVE+1));
}

function updateProgress(){
  const total = TREE.sections.length;
  const pct = total ? Math.round(VISITED.size/total*100) : 0;
  const fill = document.getElementById('progressFill');
  fill.style.width = pct + '%';
  fill.parentElement.title = ui(LANG,'read').replace('%1', VISITED.size).replace('%2', total);
}

/* ===================== NAVIGATION ===================== */
function go(idx, path){
  ACTIVE = idx;
  VISITED.add(idx);
  saveState();
  document.querySelectorAll('.sec').forEach(s=>{
    s.classList.toggle('is-active', +s.dataset.idx === idx);
  });
  buildToc();
  buildPager();
  updateProgress();
  clearHits();

  if(path){
    const el = document.querySelector(`.sec.is-active details[data-path="${path}"]`);
    if(el){
      let p = el;
      while(p){ if(p.tagName === 'DETAILS') p.open = true; p = p.parentElement.closest('details'); }
      requestAnimationFrame(()=> el.scrollIntoView({behavior:'smooth', block:'start'}));
      return;
    }
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function closeNav(){
  document.body.classList.remove('nav-open');
  document.getElementById('navToggle').setAttribute('aria-expanded','false');
}

/* ===================== SEARCH ===================== */
const stripTags = html => String(html).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();

function blockText(b, lang){
  const v = T[lang][b.key];
  if(v === undefined) return '';
  if(Array.isArray(v)) return stripTags(v.join(' '));
  if(typeof v === 'object'){
    const h = (v.h||[]).join(' ');
    const r = (v.r||[]).map(row=>row.join(' ')).join(' ');
    return stripTags(h + ' ' + r);
  }
  return stripTags(v);
}

function buildIndex(lang){
  const idx = [];
  TREE.sections.forEach((sec,i)=>{
    idx.push({ sec:i, path:null, crumb:sec.label, label:sec.label,
               text: sec.label + ' ' + sec.intro.map(b=>blockText(b,lang)).join(' ') });
    const walk = (node, path) => {
      idx.push({ sec:i, path, crumb: sec.label + ' › ' + node.label, label:node.label,
                 text: node.label + ' ' + node.blocks.map(b=>blockText(b,lang)).join(' ') });
      node.kids.forEach((k,x)=>walk(k, path + '-' + x));
    };
    sec.subs.forEach((s,j)=>walk(s, i + '.' + j));
  });
  return idx;
}

let INDEX = [];

function snippet(text, q){
  const at = text.toLowerCase().indexOf(q);
  if(at < 0) return text.slice(0,110) + (text.length>110?'…':'');
  const from = Math.max(0, at-45);
  const raw = (from>0?'…':'') + text.slice(from, at) +
              '<mark>' + text.slice(at, at+q.length) + '</mark>' +
              text.slice(at+q.length, at+q.length+70) + (text.length>at+q.length+70?'…':'');
  return raw;
}

function runSearch(){
  const box = document.getElementById('results');
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(q.length < 2){ box.hidden = true; box.innerHTML=''; return; }
  const hits = INDEX.filter(e => e.text.toLowerCase().includes(q)).slice(0, 24);
  if(!hits.length){
    box.innerHTML = `<div class="res-empty">${ui(LANG,'none')}</div>`;
    box.hidden = false; return;
  }
  box.innerHTML = hits.map((h,n)=>`<button class="res-item" data-n="${n}">
      <span class="res-crumb">${h.crumb}</span>
      <span class="res-snip">${snippet(h.text, q)}</span></button>`).join('');
  box.querySelectorAll('.res-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const h = hits[+btn.dataset.n];
      box.hidden = true;
      go(h.sec, h.path);
      setTimeout(()=>highlight(q), 420);
    });
  });
  box.hidden = false;
}

function clearHits(){
  document.querySelectorAll('mark.hit').forEach(m=>{
    m.replaceWith(document.createTextNode(m.textContent));
  });
}

function highlight(q){
  clearHits();
  const scope = document.querySelector('.sec.is-active');
  if(!scope || !q) return;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement.closest('summary,mark') || !n.nodeValue.toLowerCase().includes(q))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const targets = [];
  while(walker.nextNode()) targets.push(walker.currentNode);
  targets.slice(0,60).forEach(node=>{
    const i = node.nodeValue.toLowerCase().indexOf(q);
    if(i < 0) return;
    const after = node.splitText(i);
    const rest = after.splitText(q.length);
    const mark = document.createElement('mark');
    mark.className = 'hit';
    mark.appendChild(document.createTextNode(after.nodeValue));
    after.replaceWith(mark);
    void rest;
  });
}

/* ===================== STATE ===================== */
function saveState(){
  try{
    localStorage.setItem('lms_guide_lang', LANG);
    localStorage.setItem('lms_guide_active', String(ACTIVE));
    localStorage.setItem('lms_guide_visited', JSON.stringify([...VISITED]));
  }catch(e){}
}
function loadState(){
  let lang = 'en', active = 0, visited = [];
  try{
    const l = localStorage.getItem('lms_guide_lang');
    if(l && LANGS.some(x=>x.code===l)) lang = l;
    const a = parseInt(localStorage.getItem('lms_guide_active'),10);
    if(!isNaN(a)) active = a;
    const v = JSON.parse(localStorage.getItem('lms_guide_visited') || '[]');
    if(Array.isArray(v)) visited = v;
  }catch(e){}
  return {lang, active, visited};
}

/* ===================== RENDER ===================== */
function render(lang, keepIdx){
  LANG = lang;
  const langObj = LANGS.find(l=>l.code===lang) || LANGS[0];
  document.documentElement.lang = lang;
  document.body.dir = langObj.dir;

  TREE = buildTree(lang);
  INDEX = buildIndex(lang);
  if(!keepIdx || ACTIVE >= TREE.sections.length) ACTIVE = 0;

  document.getElementById('content').innerHTML =
    TREE.sections.map((s,i)=>sectionHtml(s,i,lang)).join('\n');

  document.getElementById('brandLabel').textContent = T[lang].brandLabel || 'Kodland LMS';
  document.getElementById('footerNote').textContent = T[lang].footerNote || '';
  document.getElementById('navHead').textContent = ui(lang,'contents');
  document.getElementById('search').placeholder = ui(lang,'search');
  document.getElementById('langSelect').value = lang;

  // expand / collapse all, per section
  document.querySelectorAll('.sec-tools .tool-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const open = btn.dataset.act === 'expand';
      btn.closest('.sec').querySelectorAll('details.sub').forEach(d=>{ d.open = open; });
    });
  });

  // overview grid on the opening section
  document.querySelectorAll('.grid-card').forEach(card=>{
    card.addEventListener('click', ()=> go(+card.dataset.goto));
  });

  // image lightbox
  document.querySelectorAll('.img-figure img').forEach(img=>{
    img.addEventListener('click', ()=>{
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').hidden = false;
    });
  });

  VISITED.add(ACTIVE);
  document.querySelectorAll('.sec').forEach(s=>{
    s.classList.toggle('is-active', +s.dataset.idx === ACTIVE);
  });
  buildToc();
  buildPager();
  updateProgress();
  saveState();
}

/* ===================== BOOT ===================== */
function buildLangSelect(){
  const sel = document.getElementById('langSelect');
  sel.innerHTML = LANGS.map(l=>`<option value="${l.code}">${l.label}</option>`).join('');
  sel.addEventListener('change', ()=>{
    const y = window.scrollY;
    render(sel.value, true);
    window.scrollTo({top:y});
  });
}

const st = loadState();
VISITED = new Set(st.visited);
ACTIVE = st.active;
buildLangSelect();
render(st.lang, true);

document.getElementById('navToggle').addEventListener('click', ()=>{
  const open = document.body.classList.toggle('nav-open');
  document.getElementById('navToggle').setAttribute('aria-expanded', String(open));
});
document.getElementById('scrim').addEventListener('click', closeNav);

const searchEl = document.getElementById('search');
let sTimer;
searchEl.addEventListener('input', ()=>{ clearTimeout(sTimer); sTimer = setTimeout(runSearch, 130); });
searchEl.addEventListener('focus', runSearch);
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-wrap')) document.getElementById('results').hidden = true;
});

document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').hidden = true;
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    document.getElementById('results').hidden = true;
    document.getElementById('lightbox').hidden = true;
    closeNav();
  }
  if((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) &&
      document.activeElement !== searchEl){
    e.preventDefault(); searchEl.focus(); searchEl.select();
  }
  if(e.altKey && e.key === 'ArrowRight' && ACTIVE < TREE.sections.length-1) go(ACTIVE+1);
  if(e.altKey && e.key === 'ArrowLeft'  && ACTIVE > 0) go(ACTIVE-1);
});

window.addEventListener('beforeprint', ()=>{
  document.querySelectorAll('details.sub').forEach(d=>{ d.open = true; });
});
</script>
